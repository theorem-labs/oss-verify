# Temporary, never merged: builds projects/zlib of this branch twice with this branch's tools (oss-verify check
# --twice --checks), for the pins of its DSL fuzz targets, and keeps the manifest and their binaries as an artifact.
name: dsl-pins
on:
  push:
    branches: ['ci/dsl-pins-*']
permissions: {contents: read}
jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
      - name: Make room, and install PyYAML and qemu
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          mkdir "$RUNNER_TEMP/qemu" && cd "$RUNNER_TEMP/qemu"
          deb=qemu-user_10.0.11+ds-0+deb13u1_amd64.deb
          curl -fsSL --retry 3 -o "$deb" https://snapshot.debian.org/file/a0eaa62f815efb2361d43b1e3f8011c17ad9123a
          echo "6b6fea55551fbcc1eb30e146ad5abdfbb49f8fa8c5998016242126de4d7f80df  $deb" | sha256sum -c --quiet
          dpkg-deb -x "$deb" . && ln -s qemu-riscv64 usr/bin/qemu-riscv64-static
          echo "$RUNNER_TEMP/qemu/usr/bin" >> "$GITHUB_PATH"
      - name: Pull the pinned toolchain image
        run: docker pull "$(python3 -P -m oss_verify check --print-toolchain projects/zlib < /dev/null)"
      - name: Build twice
        run: |
          code=0
          python3 -P -m oss_verify check --no-shell --twice --summary "$RUNNER_TEMP/binaries.md" \
            --checks "$RUNNER_TEMP/checks.md" --checks-budget 30 --dir "$RUNNER_TEMP/work" projects/zlib < /dev/null \
            || code=$?
          echo "oss-verify check exited $code" | tee -a "$GITHUB_STEP_SUMMARY"
          for f in "$RUNNER_TEMP/binaries.md" "$RUNNER_TEMP/checks.md"; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          mkdir -p "$RUNNER_TEMP/keep"
          find "$RUNNER_TEMP/work" -maxdepth 2 -name 'manifest.yaml' -exec cp {} "$RUNNER_TEMP/keep/" \;
          for t in api-driver sysfail_fuzzer; do
            [ -d "$RUNNER_TEMP/work/out/$t" ] && cp -r "$RUNNER_TEMP/work/out/$t" "$RUNNER_TEMP/keep/"
          done
          cp "$RUNNER_TEMP"/*.md "$RUNNER_TEMP/keep/" 2>/dev/null || :
          ls -laR "$RUNNER_TEMP/keep"
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        if: always()
        with:
          name: dsl-pins
          path: ${{ runner.temp }}/keep
          if-no-files-found: warn
