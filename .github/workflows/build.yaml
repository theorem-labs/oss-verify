# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: builds twice with OSS Verify's tools/check, maps its
# exit codes, and accepts OSS Verify's file names.
name: "Build"
# Builds the project an enrollment pull request adds or changes with tools/check --twice: everything is built a second
# time from scratch, and the two builds must have the same bytes, as they must before we pin a binary. The output is in
# the run's log; the step summary also has one row for each binary: its target, build, file size, .text size and whether
# it is statically linked.
#
# project-builds is a required check: it runs on every pull request (.github/scripts/take-project says which project
# it takes):
#   - A pull request from a fork is judged on the files GitHub lists for it: it fails if it changes anything but one
#     project, which is built as it is at the fork's head. A pull request from a branch of this repository is judged
#     on what merging it into the base branch changes (git merge-tree): it fails if the merge conflicts, and the one
#     project the merge changes is built as the merge has it, whatever else the pull request changes; those other
#     files are not taken. So a stacked branch whose parent is merged, a renamed project, or a project the base branch
#     renamed since the branch left it, still has its one project built.
#   - It passes with "nothing to build" in the summary for a pull request that changes no file or removes its project,
#     and for one from a branch of this repository whose merge changes no project or several ("Not an enrollment").
#     The merge decides for a branch of this repository however many files it changes; a fork that changes more than
#     the 3000 files the API lists fails, because that list is the fork's only rule.
#   - It fails for a pull request into any branch but the default one. The ruleset that requires the check guards only
#     the default branch, so this failure blocks nothing, and it keeps a result judged against another branch from
#     ever standing as a pass on the head commit if the base is then changed to the default branch.
#   - It fails if the pull request's head or base moves while the step reads it; the run for the newest commit or
#     base checks it again.
# It runs on edited too, so that changing the base runs it again against the new base. edited is also sent when the
# title or description is edited, and the project is then built again in full: a run that skipped its build would
# replace an earlier result with a pass.
# A failure is usually the project's, but it can be the runner's: GitHub's runner may run out of disk or time on a
# build that works on a larger machine. A maintainer then reruns the failed job (gh run rerun <run> --failed). If it
# fails again for the runner's reason, the maintainer builds the project with `tools/check --no-shell --twice <name>` on
# a larger machine and says so in the pull request; the check stays red until a rerun passes, so merging before then
# needs a bypass of the ruleset that requires it.
#
# pull_request_target, not pull_request, so the pull request cannot edit this workflow or tools/check:
#   - The checkout is the base branch, never the pull request, so a project is built with the base branch's tools.
#   - Only the files directly inside the one projects/<name>/ are taken from it, as regular files written from git's
#     object store.
#   - Its Dockerfile runs only inside `docker build`, and its build.sh only inside `docker run --network=none`, never
#     as a step on the runner.
#
# This job builds code from anyone. The toolchain images in infra/toolchains.tsv are public, so the job pulls the one
# image tools/check will build FROM without signing in, for every pull request, before the pull request's Dockerfile
# or build.sh runs. Never add a secret, a cache, an artifact or a write permission available to pull-request code.
# Runs do not wait for a maintainer's approval. To build only on request, remove pull_request_target below.
#
# To build a pull request by number:
#   gh workflow run build.yaml -f pr=123
# Such a run reports a check named project-builds too, but a check from a workflow_dispatch run never satisfies a
# ruleset's required check (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated).

run-name: ${{ github.event.pull_request.title || format('Pull request {0}', inputs.pr) }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request to build"
        required: true
        type: number

permissions: {}

concurrency:
  # By event too, so that a run started by hand never cancels the pull request's own run of the required check.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  project-builds:
    # A static name: GitHub reports the check under it on every run, and a required job has no job-level if:.
    name: project-builds
    runs-on: ubuntu-latest
    # tools/check has no time limit of its own: this one is the runner's, for two builds.
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      - name: Take projects/<name>/ from the pull request, and nothing else
        id: project
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Empty on a run started by hand, which builds the pull request's head as the API gives it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/take-project build

      - name: Make room and install PyYAML
        if: steps.project.outputs.name != ''
        run: |
          # Unused toolchains, removed to free disk for the build: the toolchain image alone is about 6 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      - name: Pull the pinned toolchain image
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
        run: |
          set -euo pipefail
          # Until the token is printed again, the runner reads none of tools/check's output about the project as a
          # workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          image=$(python3 tools/check --print-toolchain "projects/$NAME" < /dev/null)
          echo "::$resume::"
          [[ $image == *@sha256:* ]] || { echo "::error::Unpinned toolchain image: $image"; exit 1; }
          docker pull "$image"

      - name: Build the project twice with tools/check
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
          SHA: ${{ steps.project.outputs.sha }}
        run: |
          # Until the token is printed again, the runner reads none of the build's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          summary="$RUNNER_TEMP/binaries.md"
          # The path, as in the pull step, never the bare name: tools/check reads a bare name as a directory of the
          # checkout's root when that directory has a project.yaml, as templates/ does. Its table shows a target name,
          # which the pull request chooses, in code with every unusual byte as %XX.
          python3 tools/check --no-shell --twice --summary "$summary" "projects/$NAME" < /dev/null || code=$?
          echo "::$resume::"

          case $code in
            0) result="builds, and a second build from scratch has the same bytes" ;;
            1) result="does not build (the log says which step failed)" ;;
            2) result="breaks the enrollment rules (the log lists them)" ;;
            3) result="builds, but a second build from scratch has different bytes (the log says which)" ;;
            *) result="could not be checked: tools/check exited $code" ;;
          esac
          echo "\`projects/$NAME/\` at \`${SHA:0:7}\` $result." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$summary" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$code" = 0 ] || echo "::error::projects/$NAME/ $result."
          exit "$code"
