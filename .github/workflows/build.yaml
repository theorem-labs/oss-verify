# Adapted from OSS Scanner's .github/workflows/build.yaml (https://github.com/anthropics/oss-scanner), Copyright 2026
# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: builds twice with OSS Verify's tools/check, maps its
# exit codes, accepts OSS Verify's file names, measures the fuzz targets' checks, and adds the review and its comment.
name: "Build"
# Builds the project an enrollment pull request adds or changes with tools/check --twice: everything is built a second
# time from scratch, and the two builds must have the same bytes, as they must before we pin a binary. The output is in
# the run's log; the step summary also has one row for each binary: its target, build, file size, .text size and whether
# it is statically linked. With --checks, tools/check also measures what the fuzz targets' checks catch on their seed
# inputs (docs/build-contract.md, "The checks of a fuzz target"), and does four checks on each binary: its instructions,
# its system calls against the process model of the published proofs, its quiet twin, and the code it links
# uninstrumented (docs/build-contract.md, "The checks of the binaries"). The step summary has both reports too.
#
# The jobs, each run:
#   route    decides the kind of the run, its output `kind`: enrollment, change or issue, or nothing. A pull request
#            into the default branch that changes at least one file and none under projects/ is a change: route asks
#            for no build, and the review checks it against review-change.md. Any other pull request is an
#            enrollment, which gets the build, and so is a change that an App the review's action refuses started
#            (Dependabot's, say): .github/scripts/actor-kind decides that as the action does, by the account's type,
#            with the one list of admitted Apps, ALLOWED_BOTS below. An issue of this repository is an issue, which
#            asks for the review alone: on its own event (opened, edited, reopened) when the issue waits for us, and
#            on a run started for it (gh workflow run build.yaml -f issue=<n>), once route has read that the number is
#            an issue and not a pull request. An issue's event is ours, and route asks for nothing, when someone who is
#            not the issue's author sent it (only a person with access to this repository can: GitHub lets no one
#            else edit or reopen another person's issue), when an owner or a member of the organization sent it
#            (GitHub's author_association OWNER or MEMBER), or when any App sent it (actor-kind).
#   project-builds
#            the build above, under the check name build, when route asks for it; it passes with nothing to build
#            when the pull request enrolls no project (below). Its job id stays project-builds, the name the other jobs
#            read its outputs by.
#   record   writes the build's record, the artifact enrollment-record: the pull request, the project, the commit
#            project-builds built, and each binary's .text and executable bytes, for enroll-dispatch.yml, which starts
#            the theorem statements once every required check has passed.
#   review   Claude Code, through anthropics/claude-code-action, in one Review step for every kind: what it reads and
#            what it gives come from .github/scripts/review-prompt, run before it for route's kind. For an
#            enrollment it checks what review.md says (main's copy, at the root of the checkout) on what
#            .github/scripts/review-gather gathered: the pull request, the project's source at the built commit, and
#            the build's results, with .claude/skills/review-enrollment/SKILL.md for where those are. It gives a
#            structured output: the comment that asks the maintainer for each fix, any finding held back (review.md,
#            rule 6), and a verdict for each check. The comment and the verdicts are the artifact enroll-review-draft.
#            On a later push it resumes the same Claude Code session as the last review, so it knows what it asked
#            for and why, and reviews only the diff since the commit it reviewed then, with one exception: check D3 of
#            review.md answers each failing result of this build's report of the new head. For a change it checks
#            what review-change.md says, on the pull request's diff and files read as data, with no session kept. For
#            an issue it drafts the reply as review-issue.md says, from the issue's title, body and comments, read as
#            data, with no session kept. No job posts the draft, and it is never the public artifact or job summary:
#            it and what a person decides on it go to the private held-findings bucket
#            (.github/scripts/store-issue-draft), and the job summary says how a person at Theorem reads them. This
#            repository is public, so anyone with a GitHub account can open an issue and start that path: on an
#            issue's own event the step "Hold the draft at the hourly cap" (.github/scripts/issue-draft-cap) runs
#            first, and at 6 drafts that ran the model in the last hour, or when it cannot read the runs, it fails the
#            job with `::error::HELD: ...`: no draft is made and the run is red, and the CI/CD lane's inbound watch
#            pages for each such run (ISSUE CAP HELD). A person re-runs the job to make the draft. The draft can be
#            stored only when Google's identity provider for this repository admits the run's event: when the sign-in
#            before the model is refused for an issue, the step "Stop before the model when the draft cannot be
#            stored" fails the job with `::error::NOT STORED: ...` before the model runs, and the cap does not count
#            that run.
#   hold     sends each real bug in a project's own code that a review held back from its comment (review.md, rule 6)
#            to the disclosure route as a private issue (.github/scripts/review-hold): the review job stores it in a
#            private bucket that only this job can read, and this job sends every finding stored there, a cancelled
#            run's too. A finding never reaches a log, an output or an artifact.
#   comment  posts that comment, with the checks' report folded under it, or replaces
#            the one already there. The comment starts with <!-- oss-verify-review -->, as the triage comment starts
#            with its own marker. It never runs for an issue: a person approves the exact text of each reply to an
#            issue before anyone posts it.
#   required always runs, last, and reports the required check (below).
#
# project-builds is the required check, and the job required reports it (.github/scripts/collect). required runs on
# every run, after all the other jobs whatever their results, and passes only if route passed and every job route asked
# for passed: the build when route asked for it, and the record, review, hold and comment jobs when their own
# conditions call for them (the review when the build took a project, or the kind is change or issue); every other
# job must be skipped. A skipped job counts as a pass where a check is required, so the build job is never the
# required check itself. The build takes the project with .github/scripts/take-project, for each commit on its own:
#   - A pull request from a fork is judged on the files GitHub lists for it: it fails if it changes anything but one
#     project, which is built as it is at the fork's head. A pull request from a branch of this repository is judged
#     on what merging it into the base branch changes (git merge-tree): it fails if the merge conflicts, and the one
#     project the merge changes is built as the merge has it, whatever else the pull request changes; those other
#     files are not taken. So a stacked branch whose parent is merged, a renamed project, or a project the base branch
#     renamed since the branch left it, still has its one project built.
#   - It passes with "nothing to build" in the summary for a pull request that changes no file or removes its project,
#     and for one from a branch of this repository whose merge changes no project or several ("Not an enrollment").
#     The merge decides for a branch of this repository however many files it changes; a fork that changes more than
#     the 3000 files the API lists fails, because that list is the fork's only rule.
#   - It fails for a pull request into any branch but the default one. The ruleset that requires the check guards only
#     the default branch, so this failure blocks nothing, and it keeps a result judged against another branch from
#     ever standing as a pass on the head commit if the base is then changed to the default branch.
#   - It fails if the pull request's head or base moves while the step reads it; the next run (for a newer commit, or
#     after a change of base) checks it again.
# It does not run on edited, which GitHub sends for an edit of the title or description (nothing the build judges
# changes; before, such an edit built the project again in full) and for a change of base. After a change of base, a
# push or closing and reopening the pull request runs it again; until then a pull request into another branch keeps
# its failed check. The review is of a commit too: an edit of the description alone is reviewed with the next push.
# It runs on ready_for_review too: enroll-dispatch.yml starts no statements for a draft pull request, and the
# completion of this run, when the draft is marked ready, is what has it decide again.
# A failure is usually the project's, but it can be the runner's: GitHub's runner may run out of disk or time on a
# build that works on a larger machine. A maintainer then reruns the failed job (gh run rerun <run> --failed). If it
# fails again for the runner's reason, the maintainer builds the project with `tools/check --no-shell --twice <name>` on
# a larger machine and says so in the pull request; the check stays red until a rerun passes, so merging before then
# needs a bypass of the ruleset that requires it.
#
# pull_request_target, not pull_request, so the pull request cannot edit this workflow or tools/check:
#   - The checkout is the base branch, never the pull request, so a project is built with the base branch's tools.
#   - Only the files directly inside the one projects/<name>/ are taken from it, as regular files written from git's
#     object store.
#   - Its Dockerfile runs only inside `docker build`, and its build.sh and the fuzz targets only inside
#     `docker run --network=none` or qemu-riscv64 (tools/check --checks), never as a step of their own on the runner.
#
# project-builds builds code from anyone. The toolchain images in infra/toolchains.tsv are public, so the job pulls the
# one image tools/check will build FROM without signing in, for every pull request, before the pull request's
# Dockerfile or build.sh runs. Never add a secret, a cache, an artifact, an identity token or a write permission to that
# job. Its results reach the other jobs only as job outputs, which this repository's tools write: text, never code.
# The review job runs no code of the pull request or the project. It and the comment job hold identity tokens
# (id-token: write), which they trade for short-lived tokens: the review's for an Anthropic token by workload identity
# federation, so no API key is stored, and for an ephemeral tailnet node that exports the review's usage (below), and
# both jobs' for a Google access token by Google workload identity
# federation (Theorem's infrastructure code). Claude gets three tools only, Read, Glob and Grep (`--tools`), in the
# default permission mode (`--permission-mode default`, which refuses a read outside the checkout): no shell, no
# network and no tool that writes, so the text of the pull request, which it reads as data (review.md, rule 1),
# cannot make it run anything or reach the job's tokens. The action keeps the GitHub identity token's request
# variables out of Claude Code's environment, and with allowed_non_write_users it keeps the GitHub token out of the
# checkout's git config. Never re-run the review job with debug logging (ACTIONS_STEP_DEBUG): the action then prints
# the whole conversation, a held finding too, to the public log. The comment job alone writes: it posts the comment as
# the oss-verify GitHub App (oss-verify[bot]), with an installation token that can write pull requests in this
# repository only. It makes that token from the App's client id below and its private key, which it reads at run time
# from Secret Manager (oss-verify-github-app-key), and runs no code of the pull request or the project.
#
# This repository stores no long-lived credential for any of that. Google's provider admits this file, triage.yaml
# and the enrollment workflow enroll-dispatch.yml, each on refs/heads/main and only from its own events (here
# pull_request_target, issues and workflow_dispatch; Theorem's infrastructure code lists them). A token carries no job
# name, so what keeps each Google account to the job that needs it is the job's GitHub Environment, which the token
# carries a claim for: `ossv-ci`, which this job uses only to store a held finding or an issue's draft, can be acted as only from
# the environment `enroll-review`, which the review job declares; `ossv-app-comment`, the account these jobs read the
# App's key as, only from `comment`, which the comment job declares. A job that declares no environment,
# project-builds among them, reaches neither account, and project-builds, which builds the pull request's code, must
# never be given id-token: write.
# A pull request from a fork gets the same identity tokens in the review and comment jobs: pull_request_target runs
# this file from the base branch, never the fork's, so the fork's code never holds them.
# Runs do not wait for a maintainer's approval. To build only on request, remove pull_request_target below.
#
# The review reaches Claude by workload identity federation, with no stored key: the review job's GitHub identity token
# is traded for an Anthropic token, by the federation rule whose ids the Review step gives (ids, not secrets). A rule,
# made in the Claude Console of Anthropic's organization "Theorem - HDO", grants Claude calls only:
#   issuer   fdis_01JvJ1UhZ8X2HHgcmXqjkJbc: https://token.actions.githubusercontent.com, keys by discovery
#   main     fdrl_019restxFx3PhpLhbziQoQKf: subject_prefix "repo:theorem-labs@212152656/oss-verify@1429568498:*",
#            audience "https://api.anthropic.com", claims {"repository_id": "1429568498",
#            "ref": "refs/heads/main", "workflow": "Build"}, and the condition
#            claims.workflow_ref.startsWith("theorem-labs/oss-verify/.github/workflows/build.yaml@")
#   target   the service account oss-verify-ci (svac_01WdHTLcJPEfiPttcuLK1hGT), with the developer role
#   scope    workspace:inference, in the workspace Default+CVP, with a token lifetime of 3600 seconds
# The numbers are the immutable ids of theorem-labs and of this repository. `workflow` is the workflow's display name
# (its `name:`), not its file, and `ref` is the run's ref; the condition pins the file, so the rule gives a token only
# to this file, build.yaml, on main, from any event (a fork's pull_request_target run carries this repository's
# workflow_ref, so it signs in too). The review and comment jobs of this
# file ask for an identity token; no other job of it does.
# A review runs only on main: the Anthropic rule above admits refs/heads/main alone, so a run on another branch gets
# no Anthropic token (Google's provider and the tailnet identity of the export below admit main alone too, so such a
# run also gets no Google token and no tailnet node). So a change to
# the review is tried for real only once it is on main: run `gh workflow run build.yaml -f pr=<n>`, which posts the
# comment on that pull request (its draft is also the review job's artifact enroll-review-draft), or `-f issue=<n>`
# for the reply to an issue, which posts nothing and stores the draft in the private bucket.
# Before the merge, tools/tests runs the review's own steps with stand-ins.
#
# The review's Claude Code exports its usage by OpenTelemetry to Theorem's cost collector, over Theorem's tailnet, at
# the collector's tailnet address on port 80 (SPEND_COLLECTOR_URL below; an address, not a secret). The collector
# keeps a public endpoint with a bearer token until INFRA-832 deletes it; this job uses neither. The review job joins
# the tailnet as an ephemeral node with the tag tag:ossv-review, and holds no token for the collector: Tailscale
# makes the node from this job's GitHub identity token, and WireGuard authenticates and encrypts each connection.
# The tag, the federated identity that trades the token for the node, the grant that gives the tag the collector's
# Tailscale Service svc:spend on tcp:80 and nothing else beyond the two read-only pages every node of the tailnet
# may read (Dispatch and the results dashboard, on tcp:443), and the policy test that fails if the tag reaches
# anything else, are declared by INFRA-832 S1a in agent-infra, merged on 2026-10-30 as 99d1b5d. Its apply runs
# before this file carries a client id, so all of it is live before this job first joins. The export is
# tagged theorem.project=oss-verify, theorem.subproject=<name> (or _change, or _issue: a project name never starts with
# `_`), theorem.lane=enroll-review-ci and theorem.credential=oss-verify-ci. The export is a measurement and never
# decides whether a review runs: if the job cannot join the tailnet, the run's page carries a warning saying that
# this review's usage is not exported, and the review runs without it.
#
# The review's session goes from one push to the next in the Actions cache, under the key
# enroll-review/<pull request>/<project>/<run id>-<attempt>: ~/.claude/projects, where Claude Code keeps its sessions,
# and ~/.claude/ossv-last-review, one line `session=<id> head=<commit>`. The review job restores the newest entry of
# the pull request and project; when the head descends from the commit that session reviewed, review-gather writes the
# diff since then and the review resumes that session (claude --resume <id>, which keeps its id) to review only that
# diff. When a session is kept, the log of the gather step says which: "the review resumes the session <id>", or "the
# review is fresh"; it says neither on a first review. The
# review job saves the session after the review (cache-mode: write); it runs no code of the pull request, and its
# Claude can write nothing. Both are main's copy of this file, whatever the pull request changes. A run on main
# restores only entries that a run on main saved: a pull request's own runs (pull_request, or a push to its branch)
# save only in the scope of refs/pull/<n>/merge or of their branch, which a run on main does not restore. So the code
# of a pull request cannot write the session that its review resumes. Every other job has cache-mode: none (below).
# A session holds the public inputs the review read and the review's own reasoning. As with every cache entry of main,
# a pull request's own run can read it. GitHub drops an entry that no run has read for 7 days, and the next review is
# then fresh. A review that holds back a finding (review.md, rule 6) keeps no session, because the session would hold
# the finding: the next push resumes the last session kept before it, or starts fresh.
# Only the review job can act as ossv-ci: that comes with the environment enroll-review. Its deployment branch rule,
# declared in Theorem's infrastructure code, allows main alone; GitHub checks it against the run's ref, which is main
# for pull_request_target and refs/pull/<n>/merge for a pull request's own run
# (https://github.blog/changelog/2025-11-07-actions-pull_request_target-and-environment-branch-protections-changes).
# That rule is the second lock beside Google's provider, which admits refs/heads/main alone. The environment and its
# rule are declared in the organisation's infrastructure code, and made by its apply: do not make them by hand.
#
# To build a pull request by number:
#   gh workflow run build.yaml -f pr=123
# To draft the reply to an issue of this repository (its own events start such runs too):
#   gh workflow run build.yaml -f issue=45
# Such a run reports a check named project-builds too, but a check from a workflow_dispatch run never satisfies a
# ruleset's required check (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated).

run-name: ${{ github.event.pull_request.title || ((inputs.issue || github.event.issue.number) && format('Issue {0}', inputs.issue || github.event.issue.number)) || format('Pull request {0}', inputs.pr) }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request to build (give pr or issue, not both)"
        required: false
        type: number
      issue:
        description: "Number of the issue of this repository to draft a reply to (give pr or issue, not both)"
        required: false
        type: number

permissions: {}
# No job reads or writes the Actions cache unless it says so: only the review job does, for its session.
cache-mode: none

env:
  # The Apps whose runs the review's action admits (its allowed_bots): our automation's, which opens enrollments and
  # starts this file by hand, and the oss-verify App's. The one list: route reads it through .github/scripts/actor-kind,
  # which decides as the action does, and the Review step gives it to the action.
  ALLOWED_BOTS: sjawhar-agent[bot],oss-verify[bot]

concurrency:
  # By event too, so that a run started by hand never cancels the pull request's own run of the required check. For an
  # issue's events, one run at a time for each issue, and the newest waiting run replaces an older waiting one: an
  # edit while a draft runs waits for it. Only the events that the issue's author sent share that group: route skips
  # every other (the top of this file), and each of those gets a group of its own run, so it never replaces a waiting
  # run of the author's own edit. An event that the author sent and route still skips (an owner, a member or an App
  # wrote the issue) is of an issue that never gets a draft.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr || inputs.issue || (github.event.sender.login == github.event.issue.user.login && github.event.issue.number || format('{0}-run-{1}', github.event.issue.number, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name != 'issues' }}

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # contents: read only for the checkout of .github/scripts, main's (actor-kind).
    permissions: {contents: read, pull-requests: read, issues: read}
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: An enrollment, a change or an issue
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The account the review's action judges (its GITHUB_ACTOR).
          ACTOR: ${{ github.actor }}
          # An issue's own event: who sent it, the issue's author, and how GitHub relates the author to this repository.
          EVENT: ${{ github.event_name }}
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          # An issue's event that is ours (the top of this file) asks for nothing: the issue does not wait for us.
          if [ "${EVENT:-}" = issues ]; then
            if [[ $SENDER != "$AUTHOR" || $ASSOCIATION == OWNER || $ASSOCIATION == MEMBER ]]; then
              say "issue $ISSUE: the event is ours (sent by $SENDER), so nothing runs."
              exit 0
            fi
            # Its own assignment, so that a failed read fails route (set -e) instead of reading as a person.
            who=$(.github/scripts/actor-kind "$ACTOR")
            if [ "$who" != person ]; then
              say "issue $ISSUE: an App sent the event ($ACTOR), so nothing runs."
              exit 0
            fi
          fi
          if [ -n "${ISSUE:-}" ]; then
            # An issue of this repository, not a pull request (GitHub lists both as issues), and never both inputs.
            [[ $ISSUE =~ ^[0-9]+$ && -z ${PR:-} ]] \
              || { echo "::error::Give the number of a pull request or of an issue, not both."; exit 1; }
            [ "$(gh api "repos/$REPO/issues/$ISSUE" --jq '.pull_request == null')" = true ] \
              || { echo "::error::$ISSUE is not an issue of $REPO."; exit 1; }
            echo "kind=issue" >> "$GITHUB_OUTPUT"
            say "issue reply: nothing is built; the review drafts the reply, which no job posts (review-issue.md)."
            exit 0
          fi
          [[ ${PR:-} =~ ^[0-9]+$ ]] || { echo "::error::Give the number of a pull request or of an issue."; exit 1; }
          pull=$(gh api "repos/$REPO/pulls/$PR")
          sha=${HEAD_SHA:-$(jq -r .head.sha <<< "$pull")}
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not read the pull request's head commit."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Every path, a renamed file under both names. Over the 3000 files the API lists, the list decides nothing.
          paths=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          kind=enrollment
          message="build runs: it takes the pull request's project, if it has one (.github/scripts/take-project)."
          # A change only into the default branch: take-project refuses a pull request into any other.
          if [ -n "$paths" ] && ! grep -q '^projects/' <<< "$paths" && (( $(jq .changed_files <<< "$pull") <= 3000 )) \
              && [ "$(jq -r .base.ref <<< "$pull")" = "$(jq -r .base.repo.default_branch <<< "$pull")" ]; then
            # The action refuses a run that an App outside ALLOWED_BOTS started: such a change is built, as before.
            who=$(.github/scripts/actor-kind "$ACTOR")
            if [ "$who" != refused ]; then
              kind=change
              message="change review: the pull request changes no file under projects/, so nothing is built (review-change.md)."
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          say "$message"

  project-builds:
    # Not the required check, which the job required reports (the top of this file).
    name: build
    needs: route
    if: needs.route.outputs.kind == 'enrollment'
    runs-on: ubuntu-24.04
    # tools/check has no time limit of its own: this one is the runner's, the most it allows, for two builds and
    # --checks (at most 30 minutes of runs for the checks of the binaries, 2 x 20 minutes of seed runs on the unchanged
    # code, and the 45-minute budget of the breakages).
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    # Text that this repository's tools wrote, for the review, comment and record jobs.
    outputs:
      name: ${{ steps.project.outputs.name }}
      sha: ${{ steps.project.outputs.sha }}
      commit: ${{ steps.build.outputs.commit }}
      result: ${{ steps.build.outputs.result }}
      binaries: ${{ steps.build.outputs.binaries }}
      checks: ${{ steps.build.outputs.checks }}
      sizes: ${{ steps.build.outputs.sizes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      - name: Take projects/<name>/ from the pull request, and nothing else
        id: project
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Empty on a run started by hand, which builds the pull request's head as the API gives it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/take-project build

      - name: Make room, and install PyYAML and qemu
        if: steps.project.outputs.name != ''
        run: |
          # Unused toolchains, removed to free disk for the build: the toolchain image alone is about 6 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          # qemu-riscv64-static runs the fuzz targets for tools/check --checks, inside a container of the project image.
          # It is taken out of its package, not installed: the package registers qemu with the kernel for riscv64
          # programs (binfmt_misc), and a build.sh could then run the riscv64 programs that it makes. (From #24.)
          # Without it, --checks says that it could not measure, and the build is checked as before.
          # The check of system calls reads the runs of qemu 10.0.11 only (tools/check_binaries.py QEMU_VERSIONS), so this
          # is Debian 13's qemu-user 1:10.0.11+ds-0+deb13u1, pinned by its SHA-256 at its snapshot.debian.org address:
          # the build theorem-labs/oss-verify-proofs's toolchain/runner.Dockerfile runs counterexamples with. Its
          # qemu-riscv64 is a static binary; the -static name is the one tools/check looks for.
          mkdir "$RUNNER_TEMP/qemu" && cd "$RUNNER_TEMP/qemu"
          deb=qemu-user_10.0.11+ds-0+deb13u1_amd64.deb
          if curl -fsSL --retry 3 -o "$deb" https://snapshot.debian.org/file/a0eaa62f815efb2361d43b1e3f8011c17ad9123a \
              && echo "6b6fea55551fbcc1eb30e146ad5abdfbb49f8fa8c5998016242126de4d7f80df  $deb" | sha256sum -c --quiet \
              && dpkg-deb -x "$deb" . && ln -s qemu-riscv64 usr/bin/qemu-riscv64-static \
              && usr/bin/qemu-riscv64-static --version | grep -q 'version 10\.0\.11'; then
            echo "$RUNNER_TEMP/qemu/usr/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::No qemu-riscv64-static 10.0.11: tools/check --checks cannot run the fuzz targets."
          fi

      - name: Pull the pinned toolchain image
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
        run: |
          set -euo pipefail
          # Until the token is printed again, the runner reads none of tools/check's output about the project as a
          # workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          image=$(python3 tools/check --print-toolchain "projects/$NAME" < /dev/null)
          echo "::$resume::"
          [[ $image == *@sha256:* ]] || { echo "::error::Unpinned toolchain image: $image"; exit 1; }
          docker pull "$image"

      - name: Build the project twice with tools/check, and measure its checks
        id: build
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
          SHA: ${{ steps.project.outputs.sha }}
        run: |
          # Until the token is printed again, the runner reads none of the build's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          summary="$RUNNER_TEMP/binaries.md"
          checks="$RUNNER_TEMP/checks.md"
          # The path, as in the pull step, never the bare name: tools/check reads a bare name as a directory of the
          # checkout's root when that directory has a project.yaml, as templates/ does. Its table shows a target name,
          # which the pull request chooses, in code with every unusual byte as %XX. --checks changes no exit status.
          python3 tools/check --no-shell --twice --summary "$summary" --checks "$checks" --checks-budget 45 \
            "projects/$NAME" < /dev/null \
            || code=$?
          echo "::$resume::"

          case $code in
            0) result="builds, and a second build from scratch has the same bytes" ;;
            1) result="does not build (the log says which step failed)" ;;
            2) result="breaks the enrollment rules (the log lists them)" ;;
            3) result="builds, but a second build from scratch has different bytes (the log says which)" ;;
            *) result="could not be checked: tools/check exited $code" ;;
          esac
          echo "\`projects/$NAME/\` at \`${SHA:0:7}\` $result." >> "$GITHUB_STEP_SUMMARY"
          for file in "$summary" "$checks"; do
            if [ -f "$file" ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # For the review: the commit the build fetched, from the manifest tools/check wrote, and the three texts.
          commit=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["commit"])' \
            ~/.cache/oss-verify-check/"$NAME"/manifest.yaml 2> /dev/null || true)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || commit=""
          # For the record job: each binary's .text bytes and executable bytes (.github/scripts/binary-sizes), as one
          # line of JSON {target: {build: {text, exec}}}, with null for a size that could not be read.
          sizes=$(python3 .github/scripts/binary-sizes ~/.cache/oss-verify-check/"$NAME" 2> /dev/null < /dev/null || true)
          [[ $sizes == "{"*"}" && $sizes != *$'\n'* ]] || sizes=""
          # A random delimiter, so that no text can end an output early.
          delimiter="output-$(openssl rand -hex 16)"
          {
            echo "commit=$commit"
            echo "sizes=$sizes"
            echo "result=\`projects/$NAME/\` at \`${SHA:0:7}\` $result"
            for output in binaries checks; do
              file=$summary
              [ "$output" = binaries ] || file=$checks
              echo "$output<<$delimiter"
              if [ -f "$file" ]; then
                head -c 60000 "$file"; echo
                if [ "$(wc -c < "$file")" -gt 60000 ]; then
                  echo "(Cut at 60,000 bytes: the rest is in the Build check's step summary.)"
                fi
              fi
              echo "$delimiter"
            done
          } >> "$GITHUB_OUTPUT"

          [ "$code" = 0 ] || echo "::error::projects/$NAME/ $result."
          exit "$code"

  record:
    # The build's record, for enroll-dispatch.yml: the pull request, the project, the head commit project-builds built,
    # and each binary's .text and executable bytes. A workflow that another run starts cannot read this run's job
    # outputs, so this job writes them, as text that this repository's tools wrote, into the artifact
    # enrollment-record. It runs no code of the pull request or the project, checks out nothing, and holds no
    # permission: the artifact goes up with the runner's own artifact token, which every job has. On a run started by
    # hand (gh workflow run build.yaml -f pr=<n>) the record is of that pull request's head as the API gave it, which
    # is how a maintainer has enroll-dispatch.yml look again at a pull request.
    needs: project-builds
    if: ${{ !cancelled() && needs.project-builds.result == 'success' && needs.project-builds.outputs.name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the record
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          SHA: ${{ needs.project-builds.outputs.sha }}
          SIZES: ${{ needs.project-builds.outputs.sizes }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/record"
          jq -n --argjson pr "$PR" --arg project "$NAME" --arg sha "$SHA" --argjson sizes "${SIZES:-null}" \
            '{schema: "oss-verify enrollment record v1", pr: $pr, project: $project, sha: $sha, sizes: $sizes}' \
            > "$RUNNER_TEMP/record/record.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        with:
          name: enrollment-record
          path: ${{ runner.temp }}/record/record.json
          if-no-files-found: error
          retention-days: 30
          # A re-run of the job replaces the record of its run, so that the run keeps one.
          overwrite: true

  review:
    # Claude Code, through anthropics/claude-code-action, checks the enrollment against review.md, or a change against
    # review-change.md, or drafts the reply to an issue as review-issue.md says (the top of this file): route's kind.
    needs: [route, project-builds]
    if: ${{ !cancelled() && (needs.project-builds.outputs.name != '' || needs.route.outputs.kind == 'change' || needs.route.outputs.kind == 'issue') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    cache-mode: write
    environment: {name: enroll-review, deployment: false}
    # actions: read only for the hourly cap of issue drafts (its step below), which reads this workflow's runs. A job's
    # permissions cannot change with route's kind, so the job holds it for every kind, and the Review step's token has
    # it too: read-only, on the runs of a public repository.
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read, actions: read, id-token: write}
    env:
      KIND: ${{ needs.route.outputs.kind }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      ISSUE: ${{ inputs.issue || github.event.issue.number }}
      NAME: ${{ needs.project-builds.outputs.name }}
      HEAD_SHA: ${{ needs.project-builds.outputs.sha || needs.route.outputs.sha }}
      SESSION_KEY: enroll-review/${{ github.event.pull_request.number || inputs.pr }}/${{ needs.project-builds.outputs.name }}/
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-ci@theorem-agent-infra.iam.gserviceaccount.com
      # The client id Tailscale gave the federated identity ossv-review-github: bootstrap/'s stack output
      # ossvReviewTailnetClientId, which INFRA-832 S1a in agent-infra declares (merged as 99d1b5d) and its apply
      # makes. The id is public, not a secret, and this is the one place this file names it. It is empty
      # until that apply has run; tools/tests refuses an empty value, so this file cannot merge before then.
      TAILNET_CLIENT_ID: ""
      # The cost collector's address on the tailnet, http://<IPv4 address> on port 80. Every sender of spend
      # records takes this one URL, and it holds the address, not the Service's MagicDNS name, because
      # linux28-agents-1 joins the tailnet with --accept-dns=false and resolves no MagicDNS name; tailscaled
      # routes a Tailscale Service by the destination address. The address is the one Tailscale gives the Service
      # svc:spend, read after the INFRA-832 S1a apply; bootstrap on agent-infra main 99d1b5d exports the
      # collector's client id and audience but no URL. It is empty until someone fills it in, and tools/tests
      # refuses an empty value.
      SPEND_COLLECTOR_URL: ""
    outputs:
      # The result step writes it for an enrollment or a change, never for an issue: an issue's draft, which no one has
      # approved, is in no output (a re-run with debug logging prints outputs to the public log).
      comment: ${{ steps.result.outputs.comment }}
      held_object: ${{ steps.held.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, fetch-depth: 0}
      # The cap on the model runs of the issue path: this repository is public, so anyone with a GitHub account can open
      # an issue and start one. At the cap (6 drafts that ran the model in the last hour), or when it cannot read the
      # runs, the step fails with a `::error::HELD: ...` annotation: no draft, a red run, never a pass. The CI/CD lane's
      # inbound watch pages the CI/CD role once for each run and attempt whose step of this name failed (ISSUE CAP
      # HELD); a run stopped by the later step "Stop before the model when the draft cannot be stored" is not paged as
      # held. Keep this step's name: issue-draft-cap's count and the inbound watch both find a held run by it.
      - name: Hold the draft at the hourly cap
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CAP: 6
        run: .github/scripts/issue-draft-cap
      - name: Take projects/<name>/ from the pull request, as the build did
        if: env.KIND == 'enrollment'
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}"}
        run: GITHUB_STEP_SUMMARY=/dev/null .github/scripts/take-project build
      - name: Restore the last review's session and the head it reviewed
        if: env.KIND == 'enrollment'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (sha-pinned)
        with: {path: "~/.claude/projects\n~/.claude/ossv-last-review", key: "${{ env.SESSION_KEY }}${{ github.run_id }}-${{ github.run_attempt }}", restore-keys: "${{ env.SESSION_KEY }}"}
      - name: Gather what the review reads, and the diff since the last review
        id: gather
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ needs.project-builds.outputs.commit }}
          BUILD: "The Build check ${{ needs.project-builds.result }}: ${{ needs.project-builds.outputs.result || 'no result' }}."
          BINARIES: ${{ needs.project-builds.outputs.binaries }}
          CHECKS: ${{ needs.project-builds.outputs.checks }}
        run: |
          if [ "$KIND" = enrollment ]; then
            dpkg -s python3-yaml unzip > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml unzip; }
          fi
          LAST_REVIEW=~/.claude/ossv-last-review .github/scripts/review-gather .review
      # The sign-in an issue's draft needs, and nothing else: the review's usage goes over the tailnet with no
      # Google token (below), so this step runs for the issue path alone.
      - name: Sign in to Google Cloud, to check that an issue's draft can be stored
        if: env.KIND == 'issue'
        id: gcp
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: 300s, create_credentials_file: false, export_environment_variables: false}
      # An issue's draft is stored after the model, with a sign-in that Google's identity provider for this repository
      # must admit for the run's event. The sign-in above asks the same provider for the same account, so when it was
      # refused for an issue, the store would be refused too, and the model's work lost: stop here, before the model
      # runs, with a red run. Its token (300 s) is not the store's: the store signs in again after the model, so its
      # token is never older than that step. issue-draft-cap does not count a run this step stopped, and the inbound
      # watch pages only for the cap step's failure, not for this one. Keep this step's name: issue-draft-cap finds such
      # a run by it.
      - name: Stop before the model when the draft cannot be stored
        if: env.KIND == 'issue'
        env: {SIGN_IN: "${{ steps.gcp.outcome }}", EVENT: "${{ github.event_name }}"}
        run: |
          [ "$SIGN_IN" = success ] && exit 0
          message="Google Cloud refused this run's sign-in, so its draft could not be stored,"
          message+=" and the model was not run."
          if [ "$EVENT" = issues ]; then
            message+=" The usual cause: Theorem's Google identity provider for this repository does not admit runs"
            message+=" that an issue's event starts yet. A person at Theorem applies that setting, then re-runs this"
            message+=" job."
          else
            # A run started by hand: the provider admits this event already, so the cause is another one.
            message+=" The provider admits a run started by hand, so the cause is elsewhere: a person at Theorem checks"
            message+=" Google's identity provider for this repository and its service account, then re-runs this job."
          fi
          echo "::error::NOT STORED: $message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # The node is ephemeral and preauthorized, and it carries tag:ossv-review. INFRA-832 S1a in agent-infra,
      # merged as 99d1b5d, declares that tag, the grant that gives it the cost collector's Tailscale Service
      # svc:spend on tcp:80 and nothing else beyond the two read-only pages every node of the tailnet may read, and
      # the federated identity ossv-review-github, whose claims admit only this workflow of this repository, on
      # refs/heads/main, in the environment enroll-review, on a GitHub-hosted runner. Its apply runs before the
      # client id above is filled in. The job joins with its GitHub identity token, so no key is stored. One review
      # job runs in a run attempt, so the run id and the attempt name the node. use-cache is off: the action would
      # otherwise keep the tailscale binary in this repository's Actions cache and run it as root from there, and
      # the review job's cache holds its review session alone (above). The job's 70 minutes hold every step's cap:
      # gather 15, join 3, review 45 and logout 2.
      - name: Join Theorem's tailnet, to export this review's usage
        id: tailnet
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0 (sha-pinned)
        with:
          oauth-client-id: ${{ env.TAILNET_CLIENT_ID }}
          audience: theorem.dev/tailnet/ossv-review
          tags: tag:ossv-review
          hostname: ossv-review-${{ github.run_id }}-${{ github.run_attempt }}
          use-cache: false
      - name: Export the review's usage to the cost collector
        env: {TAILNET: "${{ steps.tailnet.outcome }}"}
        run: |
          if [ "$TAILNET" != success ]; then
            echo "::warning::This job did not join the tailnet: this review's usage is not exported."; exit 0; fi
          subproject=${NAME:-_$KIND}
          builtin printf '%s\n' CLAUDE_CODE_ENABLE_TELEMETRY=1 OTEL_LOGS_EXPORTER=otlp OTEL_METRICS_EXPORTER=none \
            OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf "OTEL_EXPORTER_OTLP_ENDPOINT=$SPEND_COLLECTOR_URL" \
            "OTEL_RESOURCE_ATTRIBUTES=theorem.project=oss-verify,theorem.subproject=$subproject,theorem.lane=enroll-review-ci,theorem.credential=oss-verify-ci" \
            >> "$GITHUB_ENV"
      # What the one Review step reads and gives, for route's kind: the rules file, the pull request or issue, the
      # structured output's schema, and for an enrollment the session to resume.
      - name: What the review reads and gives
        id: prompt
        env:
          SESSION: ${{ steps.gather.outputs.session }}
          LAST: ${{ steps.gather.outputs.last }}
        run: .github/scripts/review-prompt
      - name: Review
        id: review
        timeout-minutes: 45
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          anthropic_federation_rule_id: fdrl_019restxFx3PhpLhbziQoQKf
          anthropic_organization_id: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
          anthropic_service_account_id: svac_01WdHTLcJPEfiPttcuLK1hGT
          anthropic_workspace_id: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          # Only these Apps' runs get a review (the action refuses any other App): the one list, at the top.
          allowed_bots: ${{ env.ALLOWED_BOTS }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode default --model claude-opus-5-5 --effort xhigh --max-turns 300
            ${{ steps.prompt.outputs.arguments }}
      # The logout deletes the ephemeral node at once, whatever the review did. When the runner itself is lost,
      # Tailscale deletes the node 30 to 60 minutes after its last activity. The step takes continue-on-error, as the
      # join does: this is the measurement's own cleanup, and a failed logout must not skip the steps below it, which
      # keep the draft, the verdicts and a held finding. The action's post step logs out again at the end of the job.
      - name: Leave the tailnet
        if: ${{ always() && steps.tailnet.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: sudo tailscale logout
      - name: Keep the draft, and the held finding apart from it
        id: result
        env:
          RESULT: ${{ steps.review.outputs.execution_file }}
          SESSION: ${{ steps.review.outputs.session_id }}
        run: |
          out=$(jq -ce 'map(select(.type == "result")) | last | .structured_output | objects' "$RESULT")
          # An issue's draft, which no one has approved, and what a person decides on it: never the artifact, which any
          # signed-in GitHub account can download from this public repository, nor the public job summary. A file
          # here, which the step "Store the issue draft for a person" puts in the private bucket.
          if [ "$KIND" = issue ]; then
            { echo "The draft reply:"; echo; jq -r .comment <<< "$out"; echo
              echo "What a person at Theorem decides before it is posted:"; echo; jq -r .decide <<< "$out"; } \
              > "$RUNNER_TEMP/issue-draft.md"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/draft" && jq -r .comment <<< "$out" > "$RUNNER_TEMP/draft/comment.md"
          # The job's comment output, which the comment job posts.
          delimiter="comment_$(openssl rand -hex 16)"
          { echo "comment<<$delimiter"; cat "$RUNNER_TEMP/draft/comment.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          jq .verdicts <<< "$out" > "$RUNNER_TEMP/draft/verdicts.json"
          # Only an enrollment's schema has a held finding.
          { echo '<!-- held finding -->'; jq -r '.held // ""' <<< "$out"; } > "$RUNNER_TEMP/held-finding.md"
          if jq -e '(.held // "") | test("\\S")' <<< "$out" > /dev/null; then echo "held=yes" >> "$GITHUB_OUTPUT"
          else mkdir -p ~/.claude && printf 'session=%s head=%s\n' "$SESSION" "$HEAD_SHA" > ~/.claude/ossv-last-review; fi
      # enroll-dispatch.yml reads verdicts.json from this run: F2 or F7 fail, or no verdicts, starts no statements. A
      # re-run replaces it, which is how a held enrollment is decided again. Never for an issue (the step above).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        if: env.KIND != 'issue'
        with: {name: enroll-review-draft, path: "${{ runner.temp }}/draft", if-no-files-found: error, overwrite: true}
      # A session that holds a held finding is not kept: any run of a pull request can read main's cache.
      - name: Keep this review's session for the next push's review
        if: ${{ steps.result.outputs.held != 'yes' && env.KIND == 'enrollment' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (sha-pinned)
        with: {path: "~/.claude/projects\n~/.claude/ossv-last-review", key: "${{ env.SESSION_KEY }}${{ github.run_id }}-${{ github.run_attempt }}"}
      # A sign-in of its own, after the model: its 300 s token is minted for the store step that follows, never older.
      - name: Sign in to Google Cloud to store the held finding, or an issue's draft
        id: gcp-held
        if: ${{ steps.result.outputs.held == 'yes' || env.KIND == 'issue' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: 300s, create_credentials_file: false, export_environment_variables: false}
      # An issue's draft, into the private bucket under issue-drafts/, which the hold job does not read; the job
      # summary names the command a person at Theorem reads it with (.github/scripts/store-issue-draft).
      - name: Store the issue draft for a person
        if: env.KIND == 'issue'
        env: {GCP_ACCESS_TOKEN: "${{ steps.gcp-held.outputs.access_token }}", RUN_ID: "${{ github.run_id }}", RUN_ATTEMPT: "${{ github.run_attempt }}", RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: .github/scripts/store-issue-draft "$RUNNER_TEMP/issue-draft.md"
      # Into the private bucket only the hold job reads (the top of this file); never a log, an output or an artifact.
      - name: Store the held finding for the hold job
        id: held
        if: ${{ steps.result.outputs.held == 'yes' }}
        env: {GCP_ACCESS_TOKEN: "${{ steps.gcp-held.outputs.access_token }}", RUN_ID: "${{ github.run_id }}", RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: |
          set -euo pipefail
          name="held/$RUN_ID/$(openssl rand -hex 16)"
          header=$(printf 'oss-verify held finding v1\npr: %s\nhead: %s\nproject: %s\nrun: %s\n---' "$PR" "$HEAD_SHA" "$NAME" "$RUN_URL")
          generation=$(.github/scripts/held-bucket-put "$name" "$header" "$RUNNER_TEMP/held-finding.md")
          echo "object=$name" >> "$GITHUB_OUTPUT" && echo "Stored the held finding as $name, generation $generation."

  hold:
    # Sends every finding stored in the held-findings bucket to the disclosure route as a private issue
    # (.github/scripts/review-hold, .github/scripts/review-held): this run's, if its review held one back from the
    # public comment (review.md, rule 6), and any that an earlier run stored but did not send (a newer push cancelled
    # it). It reads the findings from the bucket, never from an output, and the App's key and the repository's name from
    # Secret Manager, as the comment job reads the key: so it runs in the environment comment, the only one whose jobs
    # can act as ossv-app-comment. It runs no code of the pull request. Only after an enrollment's review: a change's or
    # an issue's schema has no held finding, so their runs store none, and the next enrollment's run sends what any
    # earlier run left (so a flood of issues cannot fill this job's one queue below).
    needs: [route, project-builds, review]
    if: ${{ !cancelled() && needs.review.result != 'skipped' && needs.route.outputs.kind == 'enrollment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One hold job at a time in the repository, whatever pull request: two sweeps at once could each send the same
    # stored finding before either filed its issue. Every waiting hold job keeps its place (queue: max, up to 100), so
    # none is cancelled by a later one (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
    concurrency:
      group: build-hold
      cancel-in-progress: false
      queue: max
    environment:
      name: comment
      deployment: false
    permissions:
      # contents: read only for the checkout of .github/scripts. It writes with the oss-verify App's token.
      contents: read
      # Only for the GitHub identity token that Google's federation trades for an access token of
      # ossv-app-comment@theorem-agent-infra, which reads the App's key, the repository's name and the held findings.
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-app-comment@theorem-agent-infra.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Every step below fails this job only for this run's own finding (review-hold's own rule): when this review
      # held none, a failure here is about another run's stored finding, which stays in the bucket for the next run,
      # and it must not fail this run's required check (project-builds collects this job). The step still shows as
      # failed, with its annotation.
      - name: Sign in to Google Cloud
        id: gcp
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      # Whether the bucket holds any finding at all: most runs end here.
      - name: Look for stored held findings
        id: list
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          count=$(curl -q -sSf --max-time 60 -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://storage.googleapis.com/storage/v1/b/theorem-agent-infra-oss-verify-held-findings/o?prefix=held%2F&fields=items(name)' \
            | jq -er '(.items // []) | length')
          echo "The bucket holds $count stored held findings."
          if [ "$count" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi

      # The App's private key, as the comment job reads it (that job's comment says how it is masked).
      - name: Read the oss-verify App's key
        id: key
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        if: ${{ steps.list.outputs.any == 'true' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          payload=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-github-app-key/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)')
          builtin printf '::add-mask::%s\n' "$payload"
          key=$(builtin printf '%s' "$payload" | base64 -d)
          while IFS= read -r line; do
            if [[ $line == *[![:space:]]* ]]; then builtin printf '::add-mask::%s\n' "$line"; fi
          done <<< "$key"
          delimiter="key-$(openssl rand -hex 16)"
          { echo "key<<$delimiter"; builtin printf '%s\n' "$key"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      # The name of the private repository the disclosure route reads, in this repository's organisation: Secret
      # Manager oss-verify-held-findings-repo, which Theorem's infrastructure code declares and only ossv-app-comment can
      # read. It is masked before any step uses it, so no log of this public repository shows it. review-held refuses
      # it unless GitHub says it is private.
      - name: Where the held findings go
        id: where
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        if: ${{ steps.list.outputs.any == 'true' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          name=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-held-findings-repo/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)' | base64 -d) || name=""
          if ! [[ $name =~ ^[A-Za-z0-9_.-]{1,100}$ ]]; then
            echo "::error::Could not read the held findings' repository (Secret Manager oss-verify-held-findings-repo), so no held finding is sent, and a review that holds one is not posted."
            exit 1
          fi
          builtin printf '::add-mask::%s\n' "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Get the oss-verify App's token for the held findings' repository
        id: app
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        # Only with the key and the one repository read: an empty repository list would give a token for every
        # repository of the App's installation.
        if: ${{ steps.list.outputs.any == 'true' && steps.key.outputs.key != '' && steps.where.outputs.name != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ steps.key.outputs.key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.where.outputs.name }}
          permission-issues: write

      # Each stored finding, read, sent and then deleted; one that is not sent stays for the next run.
      - name: Send every stored held finding to the disclosure route
        if: ${{ steps.list.outputs.any == 'true' && steps.app.outputs.token != '' }}
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          HELD_FINDINGS_REPO: ${{ github.repository_owner }}/${{ steps.where.outputs.name }}
          REPO: ${{ github.repository }}
          # This run's own finding, if any: the job fails only if that one is not sent.
          CURRENT_OBJECT: ${{ needs.review.outputs.held_object }}
        run: .github/scripts/review-hold "$RUNNER_TEMP/held"

  comment:
    # Posts the review's comment as oss-verify[bot], or updates the one already there; when the review held a finding
    # back, only once the hold job sent it, because the comment says that it was sent. Never for an issue: a person
    # approves the exact text of each reply to an issue before anyone posts it.
    needs: [route, project-builds, review, hold]
    if: >-
      ${{ !cancelled() && needs.route.outputs.kind != 'issue'
      && needs.review.result == 'success' && needs.review.outputs.comment != ''
      && (needs.review.outputs.held_object == '' || needs.hold.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The GitHub Environment is what gets this job the App's key and keeps it from every other job: its identity
    # token carries an `environment` claim, and only a token with that claim may act as ossv-app-comment, the
    # dedicated reader of the key for these jobs (Theorem's infrastructure code). Its one protection rule is
    # the deployment-branch policy `main` (Theorem's infrastructure code); it has no
    # required reviewer and no wait timer, so it adds no wait and no approval. Removing this line does not weaken the
    # job; it stops it working.
    # deployment: false, so a comment posts no deployment on the pull request; the environment claim, which is what
    # the account needs, is in the token either way (measured on a run of this file).
    environment:
      name: comment
      deployment: false
    # One comment job at a time for a pull request, whatever event started its run (the run's own group is by event):
    # two at once could each find no comment, each post one, and only the first would ever be updated after.
    concurrency:
      group: build-comment-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    permissions:
      # Only for the GitHub identity token that Google's federation trades for an access token of
      # ossv-app-comment@theorem-agent-infra, which reads the App's key. It writes with the oss-verify App's token, not
      # this job's, and runs no code of the pull request.
      id-token: write
    env:
      # The review job's provider, and the account only a job in this environment can act as
      # (Theorem's infrastructure code).
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-app-comment@theorem-agent-infra.iam.gserviceaccount.com
    steps:
      - name: Sign in to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      # The App's private key: Secret Manager oss-verify-github-app-key in theorem-agent-infra, which Theorem's
      # infrastructure code declares and versions. This repository stores no copy of it. Each
      # line of the key is masked, and so is its base64 form, because one mask command registers one line: that keeps
      # these two representations out of the log, not every possible re-encoding of the key.
      - name: Read the oss-verify App's key
        id: key
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          payload=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-github-app-key/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)')
          builtin printf '::add-mask::%s\n' "$payload"
          key=$(builtin printf '%s' "$payload" | base64 -d)
          while IFS= read -r line; do
            if [[ $line == *[![:space:]]* ]]; then builtin printf '::add-mask::%s\n' "$line"; fi
          done <<< "$key"
          delimiter="key-$(openssl rand -hex 16)"
          { echo "key<<$delimiter"; builtin printf '%s\n' "$key"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Get the oss-verify App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ steps.key.outputs.key }}
          permission-pull-requests: write

      - name: Post the comment, or update the one already there
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REVIEW: ${{ needs.review.outputs.comment }}
          CHECKS: ${{ needs.project-builds.outputs.checks }}
          HEAD_SHA: ${{ needs.project-builds.outputs.sha || needs.route.outputs.sha }}
          RULES: ${{ needs.route.outputs.kind == 'change' && 'review-change.md' || 'review.md' }}
        run: |
          set -euo pipefail
          # A pull request's comment only: a run for an issue has no pull request, and an issue's draft is never posted.
          [[ ${PR:-} =~ ^[0-9]+$ ]] || { echo "::error::This run has no pull request, so nothing is posted."; exit 1; }
          # Only a run of the pull request's current head posts: a run of an older head that finished later would
          # replace the newer head's review. The current head's own run posts.
          current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The pull request's head is now $current, not $HEAD_SHA: the run of $current posts the comment."
            exit 0
          fi
          # The marker first, which finds the comment again; GitHub refuses a comment over 65,536 characters.
          {
            printf '<!-- oss-verify-review -->\n<sub>Claude wrote this review of `%s` from `%s`. It can be wrong. Each push replaces it.</sub>\n\n%s\n' \
              "${HEAD_SHA:0:7}" "$RULES" "${REVIEW:0:50000}"
            if [ -n "$CHECKS" ]; then
              printf '\n<details><summary>What the checks of the fuzz targets and of the binaries measured</summary>\n\n%s\n\n</details>\n' "${CHECKS:0:12000}"
            fi
          } > "$RUNNER_TEMP/comment.md"
          # Ours is the oss-verify App's comment that starts with the marker.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "oss-verify[bot]" and (.body | startswith("<!-- oss-verify-review -->"))) | .id')
          existing=${existing%%$'\n'*}
          if [ -n "$existing" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' \
              | gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input - > /dev/null
          else
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' \
              | gh api --method POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null
          fi

  required:
    # The required check project-builds (the top of this file), with .github/scripts/collect. A static name: GitHub
    # reports the check under it on every run.
    name: project-builds
    needs: [route, project-builds, record, review, hold, comment]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Only for the checkout of .github/scripts.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Every job route asked for passed, and no other ran
        env:
          ROUTE: ${{ needs.route.result }}
          BUILD: ${{ needs.project-builds.result }}
          ASKED_BUILD: ${{ needs.route.outputs.kind == 'enrollment' }}
          # Each of the others is asked for on its own job's condition: the record when the build passed and took a
          # project, the review when the build took a project or the kind is change or issue, hold when an
          # enrollment's review ran, comment when the review wrote a comment (and, if it held a finding back, the hold
          # job sent it), never for an issue.
          RECORD: ${{ needs.record.result }}
          ASKED_RECORD: ${{ needs.project-builds.result == 'success' && needs.project-builds.outputs.name != '' }}
          REVIEW: ${{ needs.review.result }}
          ASKED_REVIEW: ${{ (needs.project-builds.outputs.name != '' || needs.route.outputs.kind == 'change' || needs.route.outputs.kind == 'issue') }}
          HOLD: ${{ needs.hold.result }}
          ASKED_HOLD: ${{ needs.review.result != 'skipped' && needs.route.outputs.kind == 'enrollment' }}
          COMMENT: ${{ needs.comment.result }}
          ASKED_COMMENT: >-
            ${{ needs.route.outputs.kind != 'issue'
            && needs.review.result == 'success' && needs.review.outputs.comment != ''
            && (needs.review.outputs.held_object == '' || needs.hold.result == 'success') }}
        run: >-
          .github/scripts/collect "$ROUTE" "build:$BUILD:$ASKED_BUILD" "record:$RECORD:$ASKED_RECORD"
          "review:$REVIEW:$ASKED_REVIEW" "hold:$HOLD:$ASKED_HOLD" "comment:$COMMENT:$ASKED_COMMENT"
