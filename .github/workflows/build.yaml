# Adapted from OSS Scanner's .github/workflows/build.yaml (https://github.com/anthropics/oss-scanner), Copyright 2026
# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: builds twice with `oss-verify check`, maps its
# exit codes, accepts OSS Verify's file names, measures the fuzz targets' checks, adds the review and its comment,
# and then moves them to .github/workflows/review.yml and this file to the trigger pull_request.
name: "Build"
# Builds the project an enrollment pull request adds or changes with oss-verify check --twice: everything is built a
# second time from scratch, and the two builds must have the same bytes, as they must before we pin a binary. The output
# is in the run's log; the step summary also has one row for each binary: its target, build, file size, .text size and
# whether it is statically linked. With --checks, oss-verify check also measures what the fuzz targets' checks catch on
# their seed inputs (docs/build-contract.md, "The checks of a fuzz target"), and does four checks on each binary: its
# instructions, its system calls against the process model of the published proofs, its quiet twin, and the code it
# links uninstrumented (docs/build-contract.md, "The checks of the binaries"). The step summary has both reports too.
#
# The jobs, each run:
#   route    decides whether the run builds, its output `build`: true, or empty. A pull request into the default
#            branch that changes at least one file, none under projects/, and at most the 3000 files the API lists, is
#            a change: route asks for no build, and review.yml reviews it against review-change.md. Any other pull
#            request is an enrollment, which gets the build. route reads every path the API lists for the pull
#            request, a renamed file under both names. A read that fails fails route. Its step summary says what it
#            decided.
#   project-builds
#            the build above, under the check name build, when route asks for it; it passes with nothing to build
#            when the pull request enrolls no project (below). Its job id stays project-builds, the name the other jobs
#            read its outputs by.
#   record   writes the build's record, the artifact enrollment-record: the pull request, the project, the commit
#            project-builds built, and each binary's .text and executable bytes, for enroll-dispatch.yml, which starts
#            the theorem statements once every required check has passed.
#   results  writes the build's results, the artifact build-results, when the build took a project, whether the
#            build passed or failed: the pull request, the project, the head commit, the commit of the project's
#            repository that the build fetched, the exit status of oss-verify check, its result, the binaries table,
#            the checks' report and each binary's .text and executable bytes (sizes). review.yml's gather job reads
#            it, as data, through .github/scripts/take-build-results, and only for a pull request that changes no
#            steering file (.github/scripts/steering.py).
#   required always runs, last, and reports the required check (below).
#
# project-builds is the required check, and the job required reports it (.github/scripts/collect). required runs on
# every run, after all the other jobs whatever their results, and passes only if route passed and every job route asked
# for passed: the build when route asked for it, the record when the build passed and took a project, and the results
# when the build took a project. Every other job must be skipped. A skipped job counts as a pass where a check is
# required, so the build job is never the required check itself. The review is not part of this check: review.yml
# records the review of an enrollment in its own check run, Enrollment review, which enroll-dispatch.yml reads.
# The build takes the project with .github/scripts/take-project, for each commit on its own:
#   - A pull request from a fork is judged on the files GitHub lists for it: one that changes a file under projects/
#     fails if it changes anything but one project, which is built as it is at the fork's head. It also fails if
#     docs/seeded-projects.tsv marks that project seeded, even when it removes the project: a maintainer carries a
#     change to a seeded project on a branch of this repository. A pull request from a branch of this repository is
#     judged on what merging it into the base branch changes (git merge-tree): it fails if the merge conflicts, and the
#     one project the merge changes is built as the merge has it, whatever else the pull request changes; those other
#     files are not taken. So a stacked branch whose parent is merged, a renamed project, or a project the base branch
#     renamed since the branch left it, still has its one project built.
#   - It passes with "nothing to build" in the summary for a pull request that changes no file or removes its project,
#     for one from a fork that changes no file under projects/ (route asks for no build of such a pull request into
#     the default branch, which review.yml reviews as a change), and for one from a branch of this
#     repository whose merge changes no project or several ("Not an enrollment").
#     The merge decides for a branch of this repository however many files it changes; a fork that changes more than
#     the 3000 files the API lists fails, because that list is the fork's only rule.
#   - It fails for a pull request into any branch but the default one. The ruleset that requires the check guards only
#     the default branch, so this failure blocks nothing, and it keeps a result judged against another branch from
#     ever standing as a pass on the head commit if the base is then changed to the default branch.
#   - It fails if the pull request's head or base moves while take-project reads it; the next run (for a newer commit,
#     or after a change of base) checks it again.
# It does not run on edited, which GitHub sends for an edit of the title or description (nothing the build judges
# changes; before, such an edit built the project again in full) and for a change of base. It runs only for a pull
# request into main (the trigger's branches, below). After a change of base to main, push a commit to run it again. A
# reopen can start a run on GitHub's merge into the earlier base, and project-builds refuses a merge whose first parent
# is not a commit of main (below). The review is of a commit too: an edit of the description alone is reviewed with
# the next push.
# It runs on ready_for_review too: enroll-dispatch.yml starts no statements for a draft pull request, and the
# completion of this run, when the draft is marked ready, starts review.yml, whose completion has it decide again.
# A failure is usually the project's, but it can be the runner's: GitHub's runner may run out of disk or time on a
# build that works on a larger machine. A maintainer then reruns the failed job (gh run rerun <run> --failed). If it
# fails again for the runner's reason, the maintainer builds the project with `oss-verify check --no-shell --twice
# <name>` on a larger machine and says so in the pull request; the check stays red until a rerun passes, so merging
# before then needs a bypass of the ruleset that requires it.
#
# The trigger is pull_request: each run takes this file from the merge commit of the pull request and its base branch,
# which the pull request can change. The job required also runs .github/scripts/collect of that merge commit. A pull
# request that changes them controls its own run, its checks and its artifacts. That is safe for this repository
# because:
#   - The merge of a pull request that changes a workflow or a script needs the approval of a code owner. Each is a
#     steering file (.github/scripts/steering.py), under the path /.github/ of .github/CODEOWNERS.
#   - enroll-dispatch.yml sends no pull request that changes a steering file for its theorem statements until a person
#     approves its head.
#   - A fork's run gets a read-only token and no secret. No job of this file holds a secret, an identity token, an
#     environment or a write permission.
#   - With the repository's default setting, GitHub holds each run of a first-time contributor's pull request until
#     someone with write access approves it. Held runs (.github/workflows/held-runs.yml) starts a run by hand of
#     review.yml for such a head, which approves its held runs after the screen passes the pull request.
# project-builds takes its tools, take-project and oss-verify check, from the first parent of the merge commit: the
# base branch's commit on which GitHub built the merge. So this file and those tools come from one commit of the base
# branch: a script of another commit can lack an option that this file gives it, as the binary-sizes of an older base
# lacked --cut (#272). GitHub, not the pull request, chooses the first parent, and the step after the checkout fails
# unless that parent is a commit of the base branch. So the pull request controls none of those tools. Until that step
# ends, the checkout holds the merge commit's files, so the step is inline and runs only git and gh. Of the pull
# request, the job takes and runs only this:
#   - Only the files directly inside the one projects/<name>/ are taken from the pull request, as regular files written
#     from git's object store.
#   - Its Dockerfile runs only inside `docker build`, and its build.sh and the fuzz targets only inside
#     `docker run --network=none` or qemu-riscv64 (oss-verify check --checks), never as a step of their own on the
#     runner.
#
# project-builds builds code from anyone. The toolchain images in infra/toolchains.tsv are public, so the job pulls the
# one image oss-verify check will build FROM without signing in, for every pull request, before the pull request's
# Dockerfile or build.sh runs. Never add a secret, a cache, an artifact, an identity token or a write permission to that
# job. Its results reach the other jobs only as job outputs, which this repository's tools write: text, never code.
#
# The review runs in .github/workflows/review.yml, from main's copy, after this run completes (workflow_run). It reads
# the pull request from the API, and this run's results only as data, the artifact build-results. The jobs that sign
# in are there, and none is here.
#
# There is no run by hand of the build: a push, or closing and reopening the pull request, builds it again.

run-name: ${{ github.event.pull_request.title }}

on:
  pull_request:
    # Only a pull request into main, the default branch. review.yml takes each run as a run of the open pull request
    # into the default branch from the run's head repository and branch, at the run's head commit. So a run for a pull
    # request into another branch gives the pull request into main from the same branch and commit a second review,
    # and a second count of the daily cap.
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}
# No job reads or writes the Actions cache.
cache-mode: none

concurrency:
  # One run for each pull request: a push cancels the run of the older head. By event too, so that the runs of this
  # file's copy from before the move to pull_request (on pull_request_target) and the runs of this copy never cancel
  # each other.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only to read the pull request and its files: route checks out nothing.
    permissions: {pull-requests: read}
    outputs:
      # true when the run builds, else empty (the top of this file).
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: An enrollment or a change
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          [[ ${PR:-} =~ ^[0-9]+$ ]] || { echo "::error::Not the number of a pull request: ${PR:-}"; exit 1; }
          pull=$(gh api "repos/$REPO/pulls/$PR")
          # Every path, a renamed file under both names. Over the 3000 files the API lists, the list decides nothing.
          paths=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # A change only into the default branch: take-project refuses a pull request into any other.
          if [ -n "$paths" ] && ! grep -q '^projects/' <<< "$paths" && (( $(jq .changed_files <<< "$pull") <= 3000 )) \
              && [ "$(jq -r .base.ref <<< "$pull")" = "$(jq -r .base.repo.default_branch <<< "$pull")" ]; then
            say "No build: the pull request changes no file under projects/. review.yml reviews it as a change (review-change.md)."
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          say "build runs: it takes the pull request's project, if it has one (.github/scripts/take-project)."

  project-builds:
    # Not the required check, which the job required reports (the top of this file).
    name: build
    needs: route
    if: needs.route.outputs.build == 'true'
    runs-on: ubuntu-24.04
    # oss-verify check has no time limit of its own: this one is the runner's, the most it allows, for two builds and
    # --checks (at most 30 minutes of runs for the checks of the binaries, 2 x 20 minutes of seed runs on the unchanged
    # code, and the 45-minute budget of the breakages).
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    # This repository's package, for python3 -P -m oss_verify and .github/scripts/binary-sizes: -P keeps the top of the
    # checkout off sys.path, and PYTHONPATH names its src/ alone.
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    # Text that this repository's tools wrote, for the record and results jobs.
    outputs:
      name: ${{ steps.project.outputs.name }}
      sha: ${{ steps.project.outputs.sha }}
      commit: ${{ steps.build.outputs.commit }}
      code: ${{ steps.build.outputs.code }}
      result: ${{ steps.build.outputs.result }}
      binaries: ${{ steps.build.outputs.binaries }}
      checks: ${{ steps.build.outputs.checks }}
      sizes: ${{ steps.build.outputs.sizes }}
      # sizes, cut at 100,000 bytes, for the results job (the build step says why).
      results_sizes: ${{ steps.build.outputs.results_sizes }}
    steps:
      # The merge commit that GitHub built and its two parents. The next step checks out the first parent: the base
      # branch's commit on which GitHub built the merge (the top of this file says why).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the first parent of the merge commit
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Inline, and it runs only git and gh: until this step ends, the checkout is the merge commit, whose files are
          # the pull request's.
          merge=$(git rev-parse HEAD)
          read -r -a commits <<< "$(git rev-list --parents -n 1 HEAD)"
          if (( ${#commits[@]} != 3 )); then
            echo "::error::The commit $merge of this run has $(( ${#commits[@]} - 1 )) parents in its checkout, not the two of GitHub's merge commit of a pull request: this job takes no tools from it."
            exit 1
          fi
          parent=${commits[1]}
          # The head of the base branch, by its name, with no encoding of the name in a URL.
          remote=$(git ls-remote --exit-code origin "refs/heads/$BASE") \
            || { echo "::error::The base branch $BASE could not be read from the repository."; exit 1; }
          read -r head _ <<< "$remote"
          status=$(gh api "repos/$REPO/compare/$parent...$head" --jq .status) \
            || { echo "::error::GitHub could not compare $parent with the head of $BASE."; exit 1; }
          case $status in
            identical|ahead) ;;
            *) echo "::error::GitHub built this run's merge commit $merge on $parent, which is $status from $BASE: a merge into an earlier base. Push a commit to the branch to run this check again: a rerun checks out the same merge commit."
               exit 1 ;;
          esac
          git checkout --quiet --detach "$parent"
          echo "sha=$parent" >> "$GITHUB_OUTPUT"
          echo "Checked out $parent, the first parent of the merge commit $merge: this job runs the tools of $BASE at that commit."

      - name: Take projects/<name>/ from the pull request, and nothing else
        id: project
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/take-project build

      - name: Make room, and install PyYAML and qemu
        if: steps.project.outputs.name != ''
        run: |
          # Unused toolchains, removed to free disk for the build: the toolchain image alone is about 6 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          # qemu-riscv64-static runs the fuzz targets for oss-verify check --checks, inside a container of the project
          # image. It is taken out of its package, not installed: the package registers qemu with the kernel for riscv64
          # programs (binfmt_misc), and a build.sh could then run the riscv64 programs that it makes. (From #24.)
          # Without it, --checks says that it could not measure, and the build is checked as before. The check of system
          # calls reads the runs of qemu 10.0.11 only (src/oss_verify/check_binaries.py QEMU_VERSIONS), so this is
          # Debian 13's qemu-user 1:10.0.11+ds-0+deb13u1, pinned by its SHA-256 at its snapshot.debian.org address: the
          # build theorem-labs/oss-verify-proofs's toolchain/runner.Dockerfile runs counterexamples with. Its
          # qemu-riscv64 is a static binary; the -static name is the one oss-verify check looks for.
          mkdir "$RUNNER_TEMP/qemu" && cd "$RUNNER_TEMP/qemu"
          deb=qemu-user_10.0.11+ds-0+deb13u1_amd64.deb
          if curl -fsSL --retry 3 -o "$deb" https://snapshot.debian.org/file/a0eaa62f815efb2361d43b1e3f8011c17ad9123a \
              && echo "6b6fea55551fbcc1eb30e146ad5abdfbb49f8fa8c5998016242126de4d7f80df  $deb" | sha256sum -c --quiet \
              && dpkg-deb -x "$deb" . && ln -s qemu-riscv64 usr/bin/qemu-riscv64-static \
              && usr/bin/qemu-riscv64-static --version | grep -q 'version 10\.0\.11'; then
            echo "$RUNNER_TEMP/qemu/usr/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::No qemu-riscv64-static 10.0.11: oss-verify check --checks cannot run the fuzz targets."
          fi

      - name: Pull the pinned toolchain image
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
        run: |
          set -euo pipefail
          # Until the token is printed again, the runner reads none of oss-verify check's output about the project as a
          # workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          image=$(python3 -P -m oss_verify check --print-toolchain "projects/$NAME" < /dev/null)
          echo "::$resume::"
          [[ $image == *@sha256:* ]] || { echo "::error::Unpinned toolchain image: $image"; exit 1; }
          docker pull "$image"

      - name: Build the project twice with oss-verify check, and measure its checks
        id: build
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
          SHA: ${{ steps.project.outputs.sha }}
        run: |
          # Until the token is printed again, the runner reads none of the build's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          summary="$RUNNER_TEMP/binaries.md"
          checks="$RUNNER_TEMP/checks.md"
          # The path, as in the pull step, never the bare name: oss-verify check reads a bare name as a directory of the
          # checkout's root when that directory has a project.yaml, as templates/ does. Its table shows a target name,
          # which the pull request chooses, in code with every unusual byte as %XX. --checks changes no exit status.
          python3 -P -m oss_verify check --no-shell --twice --summary "$summary" --checks "$checks" --checks-budget 45 \
            "projects/$NAME" < /dev/null \
            || code=$?
          echo "::$resume::"

          case $code in
            0) result="builds, and a second build from scratch has the same bytes" ;;
            1) result="does not build (the log says which step failed)" ;;
            2) result="breaks the enrollment rules (the log lists them)" ;;
            3) result="builds, but a second build from scratch has different bytes (the log says which)" ;;
            *) result="could not be checked: oss-verify check exited $code" ;;
          esac
          echo "\`projects/$NAME/\` at \`${SHA:0:7}\` $result." >> "$GITHUB_STEP_SUMMARY"
          for file in "$summary" "$checks"; do
            if [ -f "$file" ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # For the review: the commit the build fetched, from the manifest oss-verify check wrote, and the three texts.
          # -P keeps the top of the checkout off sys.path, so no file or directory there shadows yaml.
          commit=$(python3 -P -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["commit"])' \
            ~/.cache/oss-verify-check/"$NAME"/manifest.yaml 2> /dev/null || true)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || commit=""
          # For the record job and the results job: each binary's .text bytes and executable bytes
          # (.github/scripts/binary-sizes), as one line of JSON {target: {build: {text, exec}}}, with null for a size
          # that could not be read. A run of binary-sizes that fails gives no sizes, and sizes_code keeps its exit
          # status. When oss-verify check passed, a warning and the step summary then give that exit status, and no
          # other text: after ::$resume:: the runner reads workflow commands again, and an error of the script can hold
          # a target name, which the pull request chooses. So the standard error of each run goes to /dev/null.
          sizes_code=0
          sizes=$(python3 .github/scripts/binary-sizes ~/.cache/oss-verify-check/"$NAME" 2> /dev/null < /dev/null) \
            || { sizes_code=$?; sizes=""; }
          [[ $sizes == "{"*"}" && $sizes != *$'\n'* ]] || sizes=""
          # For the results job: sizes in at most 100,000 bytes of JSON. The job gets them in one environment variable,
          # and Linux starts no process with a variable over 131,072 bytes: with all the builds of a large project, the
          # job could not start, and the review would get no result of the build. binary-sizes --cut keeps all the
          # builds, else the plain build of each target, else nothing, as take-build-results does, so the record of the
          # review keeps the plain builds of a large project. An error leaves it empty. When it prints nothing, the step
          # logs its own line that says why.
          results_sizes=""
          if [ -n "$sizes" ]; then
            results_sizes=$(python3 .github/scripts/binary-sizes --cut 100000 <<< "$sizes" 2> /dev/null) \
              || { sizes_code=$?; results_sizes=""; }
            if [ "$sizes_code" = 0 ] && [ -z "$results_sizes" ]; then
              echo "binary-sizes --cut gave no sizes: those of the plain builds are over 100,000 bytes of JSON."
            fi
          fi
          [[ $results_sizes == "{"*"}" && $results_sizes != *$'\n'* ]] || results_sizes=""
          if [ "$code" = 0 ] && [ "$sizes_code" != 0 ]; then
            echo "::warning::binary-sizes exited $sizes_code: the sizes are missing."
            { echo; echo "binary-sizes exited $sizes_code: the sizes are missing."; } >> "$GITHUB_STEP_SUMMARY"
          fi
          # A random delimiter, so that no text can end an output early.
          delimiter="output-$(openssl rand -hex 16)"
          {
            echo "commit=$commit"
            echo "sizes=$sizes"
            echo "results_sizes=$results_sizes"
            echo "code=$code"
            echo "result=\`projects/$NAME/\` at \`${SHA:0:7}\` $result"
            for output in binaries checks; do
              file=$summary
              [ "$output" = binaries ] || file=$checks
              echo "$output<<$delimiter"
              if [ -f "$file" ]; then
                head -c 60000 "$file"; echo
                if [ "$(wc -c < "$file")" -gt 60000 ]; then
                  echo "(Cut at 60,000 bytes: the rest is in the Build check's step summary.)"
                fi
              fi
              echo "$delimiter"
            done
          } >> "$GITHUB_OUTPUT"

          [ "$code" = 0 ] || echo "::error::projects/$NAME/ $result."
          exit "$code"

  record:
    # The build's record, for enroll-dispatch.yml: the pull request, the project, the head commit project-builds built,
    # and each binary's .text and executable bytes. A workflow that another run starts cannot read this run's job
    # outputs, so this job writes them, as text that this repository's tools wrote, into the artifact
    # enrollment-record. It runs no code of the pull request or the project, checks out nothing, and holds no
    # permission: the artifact goes up with the runner's own artifact token, which every job has. A run by hand of
    # review.yml (gh workflow run review.yml -f pr=<n>) has enroll-dispatch.yml look again at a pull request, with the
    # record of the Build run of its head.
    needs: project-builds
    if: ${{ !cancelled() && needs.project-builds.result == 'success' && needs.project-builds.outputs.name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the record
        env:
          PR: ${{ github.event.pull_request.number }}
          NAME: ${{ needs.project-builds.outputs.name }}
          SHA: ${{ needs.project-builds.outputs.sha }}
          SIZES: ${{ needs.project-builds.outputs.sizes }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/record"
          jq -n --argjson pr "$PR" --arg project "$NAME" --arg sha "$SHA" --argjson sizes "${SIZES:-null}" \
            '{schema: "oss-verify enrollment record v1", pr: $pr, project: $project, sha: $sha, sizes: $sizes}' \
            > "$RUNNER_TEMP/record/record.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        with:
          name: enrollment-record
          path: ${{ runner.temp }}/record/record.json
          if-no-files-found: error
          retention-days: 30
          # A re-run of the job replaces the record of its run, so that the run keeps one.
          overwrite: true

  results:
    # The build's results, for review.yml, as the artifact build-results (one file, results.json): the pull request,
    # the project, the head commit, the commit of the project's repository that the build fetched, the exit status of
    # oss-verify check, its result, the binaries table, the checks' report, and each binary's .text and executable
    # bytes (sizes, null when the build step gave none). It runs when the build took a project, whether the build
    # passed or failed. review.yml's gather job reads it, as data, through .github/scripts/take-build-results, only
    # for a pull request that changes no steering file (.github/scripts/steering.py): for such a pull request the
    # merge commit's workflow and scripts are main's. A workflow that another run starts cannot read this run's job
    # outputs, so this job writes them into the artifact. It runs no code of the pull request or the project, checks
    # out nothing, and holds no permission: the artifact goes up with the runner's own artifact token, which every job
    # has. The sizes are the build step's output results_sizes: the sizes cut at 100,000 bytes.
    needs: project-builds
    if: ${{ !cancelled() && needs.project-builds.outputs.name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the results
        env:
          PR: ${{ github.event.pull_request.number }}
          NAME: ${{ needs.project-builds.outputs.name }}
          SHA: ${{ needs.project-builds.outputs.sha }}
          COMMIT: ${{ needs.project-builds.outputs.commit }}
          CODE: ${{ needs.project-builds.outputs.code }}
          RESULT: ${{ needs.project-builds.outputs.result }}
          BINARIES: ${{ needs.project-builds.outputs.binaries }}
          CHECKS: ${{ needs.project-builds.outputs.checks }}
          SIZES: ${{ needs.project-builds.outputs.results_sizes }}
        run: |
          set -euo pipefail
          # The build step writes the exit status only when oss-verify check ended. With none, there is no result.
          [[ $CODE =~ ^[0-9]+$ ]] || { echo "::error::The build step gave no exit status of oss-verify check."; exit 1; }
          mkdir "$RUNNER_TEMP/results"
          jq -n --argjson pr "$PR" --arg project "$NAME" --arg sha "$SHA" --arg commit "$COMMIT" --argjson code "$CODE" \
            --arg result "$RESULT" --arg binaries "$BINARIES" --arg checks "$CHECKS" --argjson sizes "${SIZES:-null}" \
            '{schema: "oss-verify build results v1", pr: $pr, project: $project, sha: $sha, commit: $commit,
              code: $code, result: $result, binaries: $binaries, checks: $checks, sizes: $sizes}' \
            > "$RUNNER_TEMP/results/results.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        with:
          name: build-results
          path: ${{ runner.temp }}/results/results.json
          if-no-files-found: error
          retention-days: 30
          # A re-run of the job replaces the results of its run, so that the run keeps one.
          overwrite: true

  required:
    # The required check project-builds (the top of this file), with .github/scripts/collect. A static name: GitHub
    # reports the check under it on every run.
    name: project-builds
    needs: [route, project-builds, record, results]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Only for the checkout of .github/scripts.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Every job route asked for passed, and no other ran
        env:
          ROUTE: ${{ needs.route.result }}
          BUILD: ${{ needs.project-builds.result }}
          ASKED_BUILD: ${{ needs.route.outputs.build == 'true' }}
          # Each of the others is asked for on its own job's condition: the record when the build passed and took a
          # project, and the results when the build took a project, whether it passed or failed.
          RECORD: ${{ needs.record.result }}
          ASKED_RECORD: ${{ needs.project-builds.result == 'success' && needs.project-builds.outputs.name != '' }}
          RESULTS: ${{ needs.results.result }}
          ASKED_RESULTS: ${{ needs.project-builds.outputs.name != '' }}
        run: >-
          .github/scripts/collect "$ROUTE" "build:$BUILD:$ASKED_BUILD" "record:$RECORD:$ASKED_RECORD"
          "results:$RESULTS:$ASKED_RESULTS"
