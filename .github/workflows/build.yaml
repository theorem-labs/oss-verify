# Adapted from OSS Scanner's .github/workflows/build.yaml (https://github.com/anthropics/oss-scanner), Copyright 2026
# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: builds twice with OSS Verify's tools/check, maps its
# exit codes, accepts OSS Verify's file names, measures the fuzz targets' checks, and adds the review and its comment.
name: "Build"
# Builds the project an enrollment pull request adds or changes with tools/check --twice: everything is built a second
# time from scratch, and the two builds must have the same bytes, as they must before we pin a binary. The output is in
# the run's log; the step summary also has one row for each binary: its target, build, file size, .text size and whether
# it is statically linked. With --checks, tools/check also measures what the fuzz targets' checks catch on their seed
# inputs (docs/build-contract.md, "The checks of a fuzz target"), and the step summary has that report too.
#
# Then two more jobs:
#   review   Claude Code follows .claude/skills/review-enrollment/SKILL.md on what the workflow gathered: the pull
#            request, the project's source at the built commit, and the build's results. It writes a comment that asks
#            the maintainer for each fix.
#   comment  posts that comment, with the checks' report folded under it, or replaces the one already there. The
#            comment starts with <!-- oss-verify-review -->, as the triage comment starts with its own marker.
#
# project-builds is a required check: it runs on every pull request (.github/scripts/take-project says which project
# it takes):
#   - A pull request from a fork is judged on the files GitHub lists for it: it fails if it changes anything but one
#     project, which is built as it is at the fork's head. A pull request from a branch of this repository is judged
#     on what merging it into the base branch changes (git merge-tree): it fails if the merge conflicts, and the one
#     project the merge changes is built as the merge has it, whatever else the pull request changes; those other
#     files are not taken. So a stacked branch whose parent is merged, a renamed project, or a project the base branch
#     renamed since the branch left it, still has its one project built.
#   - It passes with "nothing to build" in the summary for a pull request that changes no file or removes its project,
#     and for one from a branch of this repository whose merge changes no project or several ("Not an enrollment").
#     The merge decides for a branch of this repository however many files it changes; a fork that changes more than
#     the 3000 files the API lists fails, because that list is the fork's only rule.
#   - It fails for a pull request into any branch but the default one. The ruleset that requires the check guards only
#     the default branch, so this failure blocks nothing, and it keeps a result judged against another branch from
#     ever standing as a pass on the head commit if the base is then changed to the default branch.
#   - It fails if the pull request's head or base moves while the step reads it; the run for the newest commit or
#     base checks it again.
# It runs on edited too, so that changing the base runs it again against the new base. edited is also sent when the
# title or description is edited, and the project is then built again in full: a run that skipped its build would
# replace an earlier result with a pass.
# A failure is usually the project's, but it can be the runner's: GitHub's runner may run out of disk or time on a
# build that works on a larger machine. A maintainer then reruns the failed job (gh run rerun <run> --failed). If it
# fails again for the runner's reason, the maintainer builds the project with `tools/check --no-shell --twice <name>` on
# a larger machine and says so in the pull request; the check stays red until a rerun passes, so merging before then
# needs a bypass of the ruleset that requires it.
#
# pull_request_target, not pull_request, so the pull request cannot edit this workflow or tools/check:
#   - The checkout is the base branch, never the pull request, so a project is built with the base branch's tools.
#   - Only the files directly inside the one projects/<name>/ are taken from it, as regular files written from git's
#     object store.
#   - Its Dockerfile runs only inside `docker build`, and its build.sh and the fuzz targets only inside
#     `docker run --network=none` or qemu-riscv64 (tools/check --checks), never as a step of their own on the runner.
#
# project-builds builds code from anyone. The toolchain images in infra/toolchains.tsv are public, so the job pulls the
# one image tools/check will build FROM without signing in, for every pull request, before the pull request's
# Dockerfile or build.sh runs. Never add a secret, a cache, an artifact, an identity token or a write permission to that
# job. Its results reach the other jobs only as job outputs, which this repository's tools write: text, never code.
# The review job runs no code of the pull request or the project. It holds the only identity token (id-token: write),
# which it trades for a short-lived Anthropic token by workload identity federation: no API key is stored. Claude gets
# three tools only, Read, Glob and Grep, inside the checkout (.github/scripts/review-run), and an environment without
# the runner's tokens. The comment job alone writes: it posts text, refused if it holds what looks like a credential
# (.github/scripts/review-comment), as the oss-verify GitHub App (oss-verify[bot]), with an installation token that
# can write pull requests in this repository only. It makes that token from the App's client id below and its
# private key, the repository secret OSS_VERIFY_APP_PRIVATE_KEY, and runs no code of the pull request or the project.
# Runs do not wait for a maintainer's approval. To build only on request, remove pull_request_target below.
#
# The review reaches Claude by workload identity federation, with no stored key: the review job's GitHub identity token
# is traded for an Anthropic token, by the federation rule whose ids the Review step gives (ids, not secrets). Two rules,
# made in the Claude Console of Anthropic's organization "Theorem - HDO", grant Claude calls only:
#   issuer   fdis_01JvJ1UhZ8X2HHgcmXqjkJbc: https://token.actions.githubusercontent.com, keys by discovery
#   main     fdrl_019restxFx3PhpLhbziQoQKf: subject_prefix "repo:theorem-labs@212152656/oss-verify@1429568498:*",
#            audience "https://api.anthropic.com", claims {"repository_id": "1429568498",
#            "ref": "refs/heads/main", "workflow": "Build"}
#   test     fdrl_019NVessgKqckm7owmasqfm7: subject_prefix
#            "repo:theorem-labs@212152656/oss-verify@1429568498:ref:refs/heads/ci-test/*", audience
#            "https://api.anthropic.com", claims {"repository_id": "1429568498", "workflow": "Build"}
#   target   the service account oss-verify-ci (svac_01WdHTLcJPEfiPttcuLK1hGT), with the developer role
#   scope    workspace:inference, in the workspace Default+CVP, with a token lifetime of 3600 seconds
# The numbers are the immutable ids of theorem-labs and of this repository. The Review step takes the test rule when
# the run's ref is a ci-test/ branch, and the main rule otherwise. Each rule's `workflow: "Build"` claim is this
# workflow's `name:` at the ref the run reads: pull_request_target always reads main (GITHUB_REF=refs/heads/main),
# and workflow_dispatch reads the ref it was started on. The test rule is reachable only through
# `gh workflow run build.yaml --ref ci-test/<name> -f pr=<n>`, which needs write access on this repository, and only
# as long as this file on that branch keeps `name: "Build"`. A ci-test run posts its comment on that pull request,
# so point it at a test pull request (one opened by this repository, not a maintainer's open enrollment). Renaming
# this file or this workflow on main needs the main rule changed. Only the review job asks for an identity token.
#
# On the first run for a pull request, and on each run started by hand, the comment job also sends the build's facts
# (the project, its language, the build's result, and the size and linkage of each binary) to the Slack channel
# #proving-oss-fuzz, through the incoming webhook in the repository secret SLACK_WEBHOOK_URL, which can post to that
# one channel only. Without the secret it sends nothing, and says so in a warning.
#
# The review's Claude Code exports its usage by OpenTelemetry to Theorem's cost collector when the repository variable
# OTEL_EXPORTER_OTLP_ENDPOINT (the collector's public URL) and the repository secret OTEL_COLLECTOR_TOKEN (its bearer
# token) are both set, tagged theorem.project=oss-verify, theorem.subproject=<name> and theorem.lane=enroll-review-ci.
# Without them it exports nothing, and the review runs as before.
#
# To build a pull request by number:
#   gh workflow run build.yaml -f pr=123
# Such a run reports a check named project-builds too, but a check from a workflow_dispatch run never satisfies a
# ruleset's required check (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated).

run-name: ${{ github.event.pull_request.title || format('Pull request {0}', inputs.pr) }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request to build"
        required: true
        type: number

permissions: {}

concurrency:
  # By event too, so that a run started by hand never cancels the pull request's own run of the required check.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  project-builds:
    # A static name: GitHub reports the check under it on every run, and a required job has no job-level if:.
    name: project-builds
    # 24.04, not ubuntu-latest: Ubuntu 26.04 has no qemu-user-static package, which --checks takes qemu from.
    runs-on: ubuntu-24.04
    # tools/check has no time limit of its own: this one is the runner's, the most it allows, for two builds and
    # --checks (at most 2 x 20 minutes of seed runs on the unchanged code, and the 45-minute budget of the breakages).
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    # Text that this repository's tools wrote, for the review and comment jobs.
    outputs:
      name: ${{ steps.project.outputs.name }}
      sha: ${{ steps.project.outputs.sha }}
      commit: ${{ steps.build.outputs.commit }}
      result: ${{ steps.build.outputs.result }}
      binaries: ${{ steps.build.outputs.binaries }}
      checks: ${{ steps.build.outputs.checks }}
      language: ${{ steps.build.outputs.language }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      - name: Take projects/<name>/ from the pull request, and nothing else
        id: project
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Empty on a run started by hand, which builds the pull request's head as the API gives it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/take-project build

      - name: Make room, and install PyYAML and qemu
        if: steps.project.outputs.name != ''
        run: |
          # Unused toolchains, removed to free disk for the build: the toolchain image alone is about 6 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          # qemu-riscv64-static runs the fuzz targets for tools/check --checks, inside a container of the project image.
          # It is taken out of its package, not installed: the package registers qemu with the kernel for riscv64
          # programs (binfmt_misc), and a build.sh could then run the riscv64 programs that it makes. (From #24.)
          # Without it, --checks says that it could not measure, and the build is checked as before.
          mkdir "$RUNNER_TEMP/qemu" && cd "$RUNNER_TEMP/qemu"
          if { apt-get download -q qemu-user-static || { sudo apt-get update -qq && apt-get download -q qemu-user-static; }; } \
              && dpkg-deb -x qemu-user-static_*.deb . && test -x usr/bin/qemu-riscv64-static; then
            echo "$RUNNER_TEMP/qemu/usr/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::No qemu-riscv64-static: tools/check --checks cannot run the fuzz targets."
          fi

      - name: Pull the pinned toolchain image
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
        run: |
          set -euo pipefail
          # Until the token is printed again, the runner reads none of tools/check's output about the project as a
          # workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          image=$(python3 tools/check --print-toolchain "projects/$NAME" < /dev/null)
          echo "::$resume::"
          [[ $image == *@sha256:* ]] || { echo "::error::Unpinned toolchain image: $image"; exit 1; }
          docker pull "$image"

      - name: Build the project twice with tools/check, and measure its checks
        id: build
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
          SHA: ${{ steps.project.outputs.sha }}
        run: |
          # Until the token is printed again, the runner reads none of the build's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          summary="$RUNNER_TEMP/binaries.md"
          checks="$RUNNER_TEMP/checks.md"
          # The path, as in the pull step, never the bare name: tools/check reads a bare name as a directory of the
          # checkout's root when that directory has a project.yaml, as templates/ does. Its table shows a target name,
          # which the pull request chooses, in code with every unusual byte as %XX. --checks changes no exit status.
          python3 tools/check --no-shell --twice --summary "$summary" --checks "$checks" --checks-budget 45 \
            "projects/$NAME" < /dev/null \
            || code=$?
          echo "::$resume::"

          case $code in
            0) result="builds, and a second build from scratch has the same bytes" ;;
            1) result="does not build (the log says which step failed)" ;;
            2) result="breaks the enrollment rules (the log lists them)" ;;
            3) result="builds, but a second build from scratch has different bytes (the log says which)" ;;
            *) result="could not be checked: tools/check exited $code" ;;
          esac
          echo "\`projects/$NAME/\` at \`${SHA:0:7}\` $result." >> "$GITHUB_STEP_SUMMARY"
          for file in "$summary" "$checks"; do
            if [ -f "$file" ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # For the review: the commit the build fetched, from the manifest tools/check wrote, and the three texts.
          commit=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["commit"])' \
            ~/.cache/oss-verify-check/"$NAME"/manifest.yaml 2> /dev/null || true)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || commit=""
          # For the Slack notice: the language project.yaml gives, only if it is one of tools/validate.py's names.
          language=$(python3 -c 'import sys, yaml; sys.path.insert(0, "tools"); import validate
          value = yaml.safe_load(open(sys.argv[1])).get("language")
          print(value if isinstance(value, str) and value in validate.LANGUAGES else "")' \
            "projects/$NAME/project.yaml" 2> /dev/null || true)
          # A random delimiter, so that no text can end an output early.
          delimiter="output-$(openssl rand -hex 16)"
          {
            echo "commit=$commit"
            echo "language=$language"
            echo "result=\`projects/$NAME/\` at \`${SHA:0:7}\` $result"
            for output in binaries checks; do
              file=$summary
              [ "$output" = binaries ] || file=$checks
              echo "$output<<$delimiter"
              if [ -f "$file" ]; then
                head -c 60000 "$file"; echo
                if [ "$(wc -c < "$file")" -gt 60000 ]; then
                  echo "(Cut at 60,000 bytes: the rest is in the Build check's step summary.)"
                fi
              fi
              echo "$delimiter"
            done
          } >> "$GITHUB_OUTPUT"

          [ "$code" = 0 ] || echo "::error::projects/$NAME/ $result."
          exit "$code"

  review:
    # Claude reviews the enrollment with .claude/skills/review-enrollment/SKILL.md. It runs after the build, whatever
    # its result, so that the review can ask for the build's fixes too. It runs no code of the pull request.
    needs: project-builds
    if: ${{ !cancelled() && needs.project-builds.outputs.name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      # For the pull request's checks, which the review reads.
      checks: read
      statuses: read
      actions: read
      # Only for the GitHub identity token that workload identity federation trades for an Anthropic token.
      id-token: write
    outputs:
      comment: ${{ steps.review.outputs.comment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          # The history of .github/PULL_REQUEST_TEMPLATE.md, for check B of the skill.
          fetch-depth: 0

      - name: Take projects/<name>/ from the pull request, as the build did
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # The head that the build took, also on a run started by hand.
          HEAD_SHA: ${{ needs.project-builds.outputs.sha }}
        run: GITHUB_STEP_SUMMARY=/dev/null .github/scripts/take-project build

      - name: Gather what the review reads
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          COMMIT: ${{ needs.project-builds.outputs.commit }}
          RESULT: ${{ needs.project-builds.outputs.result }}
          BINARIES: ${{ needs.project-builds.outputs.binaries }}
          CHECKS: ${{ needs.project-builds.outputs.checks }}
          BUILD_CONCLUSION: ${{ needs.project-builds.result }}
        run: |
          dpkg -s python3-yaml unzip > /dev/null 2>&1 \
            || sudo apt-get install -y -qq python3-yaml unzip \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml unzip; }
          mkdir -p .review/build
          printf 'The Build check %s: %s.\n' "$BUILD_CONCLUSION" "${RESULT:-no result}" > .review/build/result.md
          printf '%s\n' "$BINARIES" > .review/build/binaries.md
          printf '%s\n' "$CHECKS" > .review/build/checks.md
          # Until the token is printed again, the runner reads none of the gathered text as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          .github/scripts/review-gather .review
          echo "::$resume::"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.310

      - name: Get the GitHub identity token for Anthropic
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/oidc"
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$RUNNER_TEMP/oidc/jwt"
          echo "::add-mask::$(cat "$RUNNER_TEMP/oidc/jwt")"

      - name: Review
        id: review
        timeout-minutes: 45
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          # Claude Code trades the identity token for an Anthropic token on its first request. The token lives as
          # long as the rule says (an hour), longer than this step.
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc/jwt
          # The federation rule above, in Anthropic's organization "Theorem - HDO": the test rule for a ci-test/ branch.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ startsWith(github.ref, 'refs/heads/ci-test/') && 'fdrl_019NVessgKqckm7owmasqfm7' || 'fdrl_019restxFx3PhpLhbziQoQKf' }}
          ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01WdHTLcJPEfiPttcuLK1hGT
          ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
          # Usage, to Theorem's cost collector, if its secrets are set (review-run exports only with an endpoint).
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_COLLECTOR_TOKEN: ${{ secrets.OTEL_COLLECTOR_TOKEN }}
        run: |
          # Until the token is printed again, the runner reads none of the review's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          .github/scripts/review-run .review || code=$?
          rm -f "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          echo "::$resume::"
          [ "$code" = 0 ] || exit "$code"
          # The collector's token never leaves this job (review-comment refuses the other credentials).
          if [ -n "$OTEL_COLLECTOR_TOKEN" ] && grep -qF -- "$OTEL_COLLECTOR_TOKEN" .review/comment.md; then
            echo "::error::The review's comment holds the collector's token; it is not posted."
            exit 1
          fi
          delimiter="review-$(openssl rand -hex 16)"
          { echo "comment<<$delimiter"; head -c 60000 .review/comment.md; echo; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  comment:
    needs: [project-builds, review]
    # Only when the review ran and wrote a comment: a failed review leaves the last comment in place.
    if: ${{ !cancelled() && needs.project-builds.outputs.name != '' && needs.review.result == 'success' && needs.review.outputs.comment != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # contents: read only for the checkout of .github/scripts, which a job with no contents permission cannot make.
      # It writes with the oss-verify App's token, not this job's.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Get the oss-verify App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ secrets.OSS_VERIFY_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post the comment, or update the one already there
        id: post
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REVIEW: ${{ needs.review.outputs.comment }}
          CHECKS: ${{ needs.project-builds.outputs.checks }}
        run: |
          set -euo pipefail
          printf '%s' "$REVIEW" > "$RUNNER_TEMP/review.md"
          printf '%s' "$CHECKS" > "$RUNNER_TEMP/checks.md"
          python3 .github/scripts/review-comment --review "$RUNNER_TEMP/review.md" \
            --checks "$RUNNER_TEMP/checks.md" > "$RUNNER_TEMP/comment.md"
          # Ours is the oss-verify App's comment that starts with the marker.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "oss-verify[bot]" and (.body | startswith("<!-- oss-verify-review -->"))) | .id')
          existing=${existing%%$'\n'*}
          if [ -n "$existing" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' \
              | gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input - > /dev/null
            echo "posted=updated" >> "$GITHUB_OUTPUT"
          else
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' \
              | gh api --method POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null
            echo "posted=new" >> "$GITHUB_OUTPUT"
          fi

      - name: "Send the build's facts to #proving-oss-fuzz"
        # Once for each pull request, when its comment is first posted, and again on each run started by hand.
        if: ${{ steps.post.outputs.posted == 'new' || github.event_name == 'workflow_dispatch' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr }}
          NAME: ${{ needs.project-builds.outputs.name }}
          LANGUAGE: ${{ needs.project-builds.outputs.language }}
          RESULT: ${{ needs.project-builds.outputs.result }}
          BINARIES: ${{ needs.project-builds.outputs.binaries }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::The repository secret SLACK_WEBHOOK_URL is not set, so the facts were not sent to #proving-oss-fuzz."
            exit 0
          fi
          printf '%s' "$BINARIES" > "$RUNNER_TEMP/binaries.md"
          python3 .github/scripts/slack-notice --name "$NAME" --language "$LANGUAGE" --url "$URL" --result "$RESULT" \
            --binaries "$RUNNER_TEMP/binaries.md" > "$RUNNER_TEMP/slack.json"
          curl -sSf --retry 2 -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/slack.json" \
            "$SLACK_WEBHOOK_URL" > /dev/null
