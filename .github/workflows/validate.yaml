# Adapted from OSS Scanner's .github/workflows/build.yaml (https://github.com/anthropics/oss-scanner), Copyright 2026
# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: a new workflow that runs tools/validate.py on the
# projects/<name>/ of an enrollment pull request, taken from it as build.yaml takes it.
name: "Validate"
# enrollment checks the projects/<name>/ a pull request adds or changes against the enrollment rules, with the base
# branch's tools/validate.py. It is a required check: it runs on every pull request, and takes the project as
# build.yaml does (.github/scripts/take-project): the one project a fork's file list names, or the one project that
# merging a branch of this repository into the base branch changes. A fork fails if it changes anything else, and a
# branch of this repository fails if its merge conflicts. It passes with "nothing to validate" in the summary for a
# pull request that changes no file or removes its project, and for one from a branch of this repository whose merge
# changes no project or several ("Not an enrollment"). The merge decides for a branch of this repository however many
# files it changes; a fork that changes more than the 3000 files the API lists fails. It fails for a pull request into
# any branch but the default one, and if the pull request's head or base moves while the step reads it. It runs on
# edited too, so that changing the base runs it again. An edit of the title or description alone changes no commit: it
# validates nothing, and its collector reports under the name "title or description edited", not enrollment, so the
# head commit's own result stands, a failure as well as a pass; such a run has a concurrency group of its own, so it
# cancels nothing. This repository's own tests are tests.yaml.
#
# The jobs: route asks for validate unless the event is an edit of the title or description alone; validate takes the
# project with take-project and runs tools/validate.py on it, or passes with nothing to validate; required always runs,
# after both, and reports the required check enrollment. It passes only if route passed and validate passed when route
# asked for it, or was skipped when route did not. A skipped job counts as a pass where a check is required, so validate
# is never the required check.
#
# As in build.yaml: pull_request_target, so the pull request cannot edit this workflow or the validator; the checkout
# is the base branch; only the files directly inside the one projects/<name>/ are taken from the pull request, as
# regular files written from git's object store, and they are read as data, never run. No job gets a secret, cache,
# artifact or write permission. Never add one.
#
# To validate a pull request's project by number:
#   gh workflow run validate.yaml -f pr=123
# Such a run reports a check named enrollment too, but a check from a workflow_dispatch run never satisfies a
# ruleset's required check (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated).

run-name: ${{ github.event.pull_request.title || format('Pull request {0}', inputs.pr) }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request whose project to validate"
        required: true
        type: number

permissions: {}

concurrency:
  # By event too, so that a run started by hand never cancels the pull request's own run of the required check. An edit
  # of the title or description alone has a group of its own, the run's, so it cancels nothing.
  group: ${{ github.event.action == 'edited' && !github.event.changes.base && format('validate-edited-{0}', github.run_id) || format('validate-{0}-{1}', github.event_name, github.event.pull_request.number || inputs.pr) }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      # The same test as the concurrency group's and the required job's name.
      EDIT_ONLY: ${{ github.event.action == 'edited' && !github.event.changes.base }}
    outputs:
      validate: ${{ steps.decide.outputs.validate }}
    steps:
      - name: Whether the event changes what is validated
        id: decide
        run: |
          if [ "$EDIT_ONLY" = true ]; then
            message="Nothing to validate: this run is for an edit of the pull request's title or description, which changes no commit. The check enrollment of the head commit's own run stands."
          else
            echo "validate=true" >> "$GITHUB_OUTPUT"
            message="validate runs: it takes the pull request's project, if it has one (.github/scripts/take-project)."
          fi
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: route
    if: needs.route.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      - name: Take projects/<name>/ from the pull request, and nothing else
        id: project
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Empty on a run started by hand, which validates the pull request's head as the API gives it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/take-project validate

      - name: Check projects/<name>/ with tools/validate.py
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
          SHA: ${{ steps.project.outputs.sha }}
        run: |
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          # Until the token is printed again, the runner reads none of the validator's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          python3 tools/validate.py "projects/$NAME" < /dev/null || code=$?
          echo "::$resume::"

          case $code in
            0) result="passes tools/validate.py" ;;
            1) result="breaks the enrollment rules (the log lists them)" ;;
            *) result="could not be checked: tools/validate.py exited $code" ;;
          esac
          echo "\`projects/$NAME/\` at \`${SHA:0:7}\` $result." >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 0 ] || echo "::error::projects/$NAME/ $result."
          exit "$code"

  required:
    # The required check enrollment (the top of this file), with .github/scripts/collect. GitHub evaluates the name of a
    # job that runs, and this one always runs.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'title or description edited' || 'enrollment' }}
    needs: [route, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only for the checkout of .github/scripts.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Every job route asked for passed, and no other ran
        env:
          ROUTE: ${{ needs.route.result }}
          ASKED: ${{ needs.route.outputs.validate == 'true' }}
          VALIDATE: ${{ needs.validate.result }}
        run: .github/scripts/collect "$ROUTE" "validate:$VALIDATE:$ASKED"
