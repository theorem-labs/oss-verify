# Adapted from OSS Scanner's .github/workflows/build.yaml (https://github.com/anthropics/oss-scanner), Copyright 2026
# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: a new workflow that runs oss-verify validate on the
# projects/<name>/ of an enrollment pull request, taken from it as build.yaml takes it.
name: "Validate"
# enrollment checks the projects/<name>/ a pull request adds or changes against the enrollment rules, with the base
# branch's oss-verify validate. It is a required check: it runs on every pull request, and takes the project as
# build.yaml does (.github/scripts/take-project): the one project a fork's file list names, or the one project that
# merging a branch of this repository into the base branch changes. A fork that changes a file under projects/ fails if
# it changes anything but one project, or if docs/seeded-projects.tsv marks that project seeded, even when it removes
# the project: a maintainer carries a change to a seeded project on a branch of this repository. A branch of this
# repository fails if its merge conflicts. It passes with "nothing to validate" in the summary for a pull request that
# changes no file or removes its project, for one from a fork that changes no file under projects/, and for one from a
# branch of this repository whose merge changes no project or several ("Not an enrollment"). The merge decides for a
# branch of this repository however many files it changes; a fork that changes more than the 3000 files the API lists
# fails. It fails for a pull request into any branch but the default one, and if the pull request's head or base moves
# while take-project reads it. It does not run on edited, which GitHub sends for an edit of the title or description
# (nothing this judges changes) and for a change of base. After a change of base, push a commit to run it again. Until
# then a pull request into another branch keeps its failed check. A reopen can start a run on GitHub's merge into the
# earlier base, and the validate job refuses a merge whose first parent is not a commit of the base branch (below).
# This repository's own tests are tests.yaml.
#
# One job, validate, reports the required check enrollment: it takes the project with take-project and runs oss-verify
# validate on it, or passes with nothing to validate. It has no if:, so it runs on every event this workflow takes, each
# a commit to judge, and the check is never a skipped job, which GitHub counts as a pass where a check is required.
#
# pull_request: the workflow file comes from the merge commit, so a pull request that changes it controls this run and
# its check. .github/CODEOWNERS owns this file: enroll-dispatch.yml acts on its check for an enrollment, whose run is
# main's copy, so a change to it needs a code owner.
# enroll-dispatch.yml sends no pull request for its theorem statements unless all its files are under one
# projects/<name>/ (the_project() of .github/scripts/enroll-dispatch), and none that changes a steering file
# (.github/scripts/steering.py) until a person approves its head. The validate job checks out the first parent of the
# merge commit: the base branch's commit on which GitHub built the merge. So take-project judges the pull request
# against that commit, and the validator is the base branch's. When the pull request does not change this file, this
# file and those tools come from one commit of the base branch: a tool of another commit can lack an option that this
# file gives it. GitHub, not the pull request, chooses the first parent, and the step after the checkout fails unless
# that parent is a commit of the base branch. So the pull request controls neither tool. Until that step ends, the
# checkout holds the merge commit's files, so the step is inline and runs only git and gh. Only the files directly
# inside the one projects/<name>/ are taken from the pull request, as regular files written from git's object store,
# and they are read as data, never run. No job gets a secret, cache, artifact or write permission. Never add one.
#
# To validate a pull request's project by number (a run by hand stays: it reads a project as data, builds nothing,
# and holds no secret and only a read-only token):
#   gh workflow run validate.yaml -f pr=123
# Such a run reports a check named enrollment too, but a check from a workflow_dispatch run never satisfies a
# ruleset's required check (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated).

run-name: ${{ github.event.pull_request.title || format('Pull request {0}', inputs.pr) }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request whose project to validate"
        required: true
        type: number

permissions: {}

# No job reads or writes the Actions cache (the top of this file).
cache-mode: none

# No concurrency group: no run of this file cancels another, a run by hand included. Here a push and a reopen can start
# two runs at one head, and in a group that cancels, two runs that start in the same second can end with the newer
# cancelled, and .github/scripts/required-check, which posts the job of the newest run at the head, then posts
# enrollment cancelled (Terms on #317: terms.yaml's comment on concurrency). The run is one job, of 7 to 12 seconds in
# each of the last 20 runs on pull_request (created 2026-11-25 11:47Z to 2026-11-26 12:40Z). So the run of a replaced
# push ends within seconds, and required-check, which reads only the runs at the pull request's head, posts nothing
# from it.

jobs:
  validate:
    # The required check enrollment (the top of this file). A static name: GitHub reports the check under it on every
    # run.
    name: enrollment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # On pull_request, the merge commit that GitHub built and its two parents. The next step checks out the first
      # parent: the base branch's commit on which GitHub built the merge (the top of this file says why). A run by hand
      # checks out its own branch, and the next step does not run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the first parent of the merge commit
        id: parent
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Inline, and it runs only git and gh: until this step ends, the checkout is the merge commit, whose files are
          # the pull request's.
          merge=$(git rev-parse HEAD)
          read -r -a commits <<< "$(git rev-list --parents -n 1 HEAD)"
          if (( ${#commits[@]} != 3 )); then
            echo "::error::The commit $merge of this run has $(( ${#commits[@]} - 1 )) parents in its checkout, not the two of GitHub's merge commit of a pull request: this job takes no tools from it."
            exit 1
          fi
          parent=${commits[1]}
          # The head of the base branch, by its name, with no encoding of the name in a URL. ls-remote matches the end
          # of each ref name, so refs/heads/a/refs/heads/$BASE matches too: only the line of refs/heads/$BASE counts.
          remote=$(git ls-remote origin "refs/heads/$BASE") || remote=""
          head=""
          while read -r sha ref; do
            if [ "$ref" = "refs/heads/$BASE" ]; then head=$sha; fi
          done <<< "$remote"
          [ -n "$head" ] || { echo "::error::The base branch $BASE could not be read from the repository."; exit 1; }
          status=$(gh api "repos/$REPO/compare/$parent...$head" --jq .status) \
            || { echo "::error::GitHub could not compare $parent with the head of $BASE."; exit 1; }
          case $status in
            identical|ahead) ;;
            *) echo "::error::GitHub built this run's merge commit $merge on $parent, which is not in the history of $BASE (compare: $status): a merge into an earlier base. Push a commit to the branch to run this check again: a rerun checks out the same merge commit."
               exit 1 ;;
          esac
          git checkout --quiet --detach "$parent"
          echo "sha=$parent" >> "$GITHUB_OUTPUT"
          echo "Checked out $parent, the first parent of the merge commit $merge: this job runs the tools of $BASE at that commit."

      - name: Take projects/<name>/ from the pull request, and nothing else
        id: project
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Empty on a run started by hand, which validates the pull request's head as the API gives it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/take-project validate

      - name: Check projects/<name>/ with oss-verify validate
        if: steps.project.outputs.name != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
          SHA: ${{ steps.project.outputs.sha }}
          # This repository's package: -P keeps the top of the checkout off sys.path, and PYTHONPATH names src/ alone.
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          # Until the token is printed again, the runner reads none of the validator's output as a workflow command.
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          python3 -P -m oss_verify validate "projects/$NAME" < /dev/null || code=$?
          echo "::$resume::"

          case $code in
            0) result="passes oss-verify validate" ;;
            1) result="breaks the enrollment rules (the log lists them)" ;;
            *) result="could not be checked: oss-verify validate exited $code" ;;
          esac
          echo "\`projects/$NAME/\` at \`${SHA:0:7}\` $result." >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 0 ] || echo "::error::projects/$NAME/ $result."
          exit "$code"
