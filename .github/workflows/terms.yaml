# Adapted from OSS Scanner's .github/workflows/terms.yaml (https://github.com/anthropics/oss-scanner), Copyright 2026
# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: the OSS Verify terms, the repository's maintainers
# recognised by their association with it rather than by a list of logins, no box for a pull request that enrolls
# nothing, and the record of the terms that a branch names when it adopts a seeded project.
name: "Terms"
# An enrollment pull request must accept the OSS Verify terms: the box in the pull request template, ticked in the
# description. This check fails until it is, and runs again whenever the description is edited. A branch of this
# repository needs no box of its own: only an account with write access, including a GitHub App, can push one.
#
# But a branch can adopt a seeded project: docs/seeded-projects.tsv of the base marks <name> yes, and with
# projects/<name>/project.yaml the branch gives findings to an address that the base's file does not give them to.
# The addresses that get findings are primary_contact, unless it is n/a, and each address of auto_ccs. So a change
# from one contact to another is an adoption too, and so is an added auto_ccs address: the new address needs a record
# of its own. enrollment refuses a pull request from a fork that changes a seeded project, so a maintainer of this
# repository carries the adopter's change on a branch. The adopter's own pull request from their fork, which
# enrollment refuses, ticks the box: it is their record that they accept the terms. The branch's description names it
# on a line "Adoption: #<number>" (or with its URL). The check passes only when that pull request comes from a fork,
# was not opened by a bot, ticks the box, and names projects/<name> in its description, and no other project
# (docs/project-yaml.md, "Seeded projects"). The record need not change projects/<name>/: the check reads none of its
# files. A branch names one record, so when the branch adopts several projects, that record names each of them, and
# no other. The files of a branch are read on each run, every page of them. A read that fails, a list over the API's
# 3000 files, or a head that moves while they are read, fails the check. .github/scripts/terms-accepted tells how the
# check reads the addresses: with the reader of oss-verify validate.
#
# A pull request that changes no file under projects/ (a change to src/ or docs/, say) enrolls nothing, and needs no
# box either: the terms govern the enrollment of a project. They say so in their first paragraph: "This OSS Verify
# Agreement (the "Agreement") governs your ("Participant") enrollment of a project in OSS Verify", accepted "by ticking
# "I accept the OSS Verify terms" in an enrollment pull request" (https://theorem.dev/oss-verify/terms/). Any other
# contribution is under the Apache License 2.0, as CONTRIBUTING.md says. From a fork, the files are read from the API
# only when the box is not ticked, every page of them, renames under both names, as build.yaml's route reads them. A
# pull request that changes more files than the 3000 the API lists, or whose head moves while they are read, needs the
# box.
#
# What runs, and from where. On pull_request, the workflow file comes from the merge commit, so the run: block of the
# step below is the merge commit's. A pull request that changes this file runs its own copy, and so controls this run
# and its check: a contributor could edit this check away in their own pull request. The code-owner rule on /.github/
# of .github/CODEOWNERS guards the merge of such a pull request. enroll-dispatch.yml sends no pull request for its
# theorem statements unless all its files are under one projects/<name>/ (the_project() of
# .github/scripts/enroll-dispatch), and none that changes a steering file (.github/scripts/steering.py) until a person
# approves its head. The job checks out the first parent of the merge commit: the base branch's commit on which GitHub
# built the merge. The run: block runs the program .github/scripts/terms-accepted from that checkout, with the rules of
# oss-verify validate beside it (.github/scripts/validate_rules/, never src/, which has no code owner), and gives the
# program that commit as BASE_SHA. So the program and the files of the base that the program reads come from one
# commit of the base branch. When the pull request does not change this file, this file comes from that commit too:
# the program of another commit can read a variable that this file does not give it. GitHub, not the pull request,
# chooses the first parent, and the step after the checkout fails unless that parent is a commit of the base branch.
# Until that step ends, the checkout holds the merge commit's files, so the step is inline and runs only git and gh.
# This workflow runs on edited, which GitHub sends for a change of base too. Such a run can get GitHub's merge into the
# earlier base. The step then fails, and a push to the branch runs the check again. Only while the first parent has no
# .github/scripts/terms-accepted does the job also check out the merge commit, into merge/, and run the program from
# there (the checkout into merge/ below tells why).
#
# The program reads the event's description and the list of the files the pull request changes. For a branch that
# changes the project.yaml of a seeded project, it also reads docs/seeded-projects.tsv at BASE_SHA, the text of that
# project.yaml at the head and at BASE_SHA, and the pull request that the description names. BASE_SHA is the first
# parent of the merge commit, the commit that the job checks out. The program reads each through the API. Its token
# has no permission (permissions: {} below): the API gives a public repository's pull requests, their files and its
# contents to any token ("This endpoint can be used without authentication or the aforementioned permissions if only
# public resources are requested",
# https://docs.github.com/en/rest/pulls/pulls#list-pull-requests-files), and a token is used, not none, for the
# authenticated rate limit. The description reaches the program through an environment variable, never by ${{ }}
# substitution into the run: block, so its text cannot become shell. Each value that the API gives (a description, a
# file name, the text of a file, a login) is data too: the program only compares it and prints it, gives no shell any
# of it, and loads the text of a file only with yaml.safe_load, which makes only plain data and runs no code.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  # One run per pull request: an edit or a push while a run is going supersedes it, so the newest description is
  # the one this check reports on. By event too, so that the runs of this file's copy from before the move to
  # pull_request (on pull_request_target) and the runs of this copy never cancel each other.
  group: terms-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terms-accepted:
    name: terms-accepted
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The merge commit that GitHub built and its two parents. The next step checks out the first parent: the base
      # branch's commit on which GitHub built the merge (the top of this file says why).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the first parent of the merge commit
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Inline, and it runs only git and gh: until this step ends, the checkout is the merge commit, whose files are
          # the pull request's.
          merge=$(git rev-parse HEAD)
          read -r -a commits <<< "$(git rev-list --parents -n 1 HEAD)"
          if (( ${#commits[@]} != 3 )); then
            echo "::error::The commit $merge of this run has $(( ${#commits[@]} - 1 )) parents in its checkout, not the two of GitHub's merge commit of a pull request: this job takes no tools from it."
            exit 1
          fi
          parent=${commits[1]}
          # The head of the base branch, by its name, with no encoding of the name in a URL. ls-remote matches the end
          # of each ref name, so refs/heads/a/refs/heads/$BASE matches too: only the line of refs/heads/$BASE counts.
          remote=$(git ls-remote origin "refs/heads/$BASE") || remote=""
          head=""
          while read -r sha ref; do
            if [ "$ref" = "refs/heads/$BASE" ]; then head=$sha; fi
          done <<< "$remote"
          [ -n "$head" ] || { echo "::error::The base branch $BASE could not be read from the repository."; exit 1; }
          status=$(gh api "repos/$REPO/compare/$parent...$head" --jq .status) \
            || { echo "::error::GitHub could not compare $parent with the head of $BASE."; exit 1; }
          case $status in
            identical|ahead) ;;
            *) echo "::error::GitHub built this run's merge commit $merge on $parent, which is not in the history of $BASE (compare: $status): a merge into an earlier base. Push a commit to the branch to run this check again: a rerun checks out the same merge commit."
               exit 1 ;;
          esac
          git checkout --quiet --detach "$parent"
          echo "sha=$parent" >> "$GITHUB_OUTPUT"
          echo "Checked out $parent, the first parent of the merge commit $merge: this job runs the tools of $BASE at that commit."

      # Only while the first parent has no .github/scripts/terms-accepted: the merge commit, which actions/checkout
      # takes by default on pull_request, into merge/. terms.yaml runs on a pull request into each branch, and a branch
      # that #227 did not reach has no terms-accepted (toolchain/frame-pointers, the base of #155, has none). So this
      # checkout serves a pull request whose merge brings main's terms.yaml into such a branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        if: hashFiles('.github/scripts/terms-accepted') == ''
        with:
          path: merge
          persist-credentials: false
      - name: The description accepts the OSS Verify terms
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          # No permission (the top of this file): it reads only what the API gives anyone.
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The first parent of the merge commit, the commit of the checkout (the top of this file).
          BASE_SHA: ${{ steps.parent.outputs.sha }}
        run: |
          # The program of the checkout, the first parent of the merge commit, with the rules of oss-verify validate
          # beside it. The first parent has no program only on a branch that #227 did not reach (the checkout into
          # merge/ above). Only then does the merge commit's copy in merge/ run. That adds no trust: on pull_request,
          # this run: block is the merge commit's already.
          dir=.
          [ -f .github/scripts/terms-accepted ] || dir=merge
          python3 "$dir/.github/scripts/terms-accepted"
