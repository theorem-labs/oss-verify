name: Enrollment merged
# Runs when a pull request is closed. Its only work is to complete: enroll-dispatch.yml runs on its completion
# (workflow_run), so that enroll-dispatch.yml keeps one event, as it does for maintainer-confirmed.yml's label. Its job
# runs for a merge or a replay alone. The run's title names the pull request, and .github/scripts/enroll-dispatch
# (decide_merged) reads it: when the pull request is an enrollment merged into main whose required checks passed at its
# head commit, that commit is sent for its theorem statements. A pull request closed without a merge sends nothing:
# this job is skipped, and decide_merged still reads the pull request and takes review-passed off it when it carries it.
#
# workflow_dispatch replays a merge made before this file existed:
#   gh workflow run enroll-merged.yml -R theorem-labs/oss-verify -f pr=<n>
# With the repository's default setting, GitHub holds the closed run of a first-time contributor's pull request until
# someone with write access approves it. Held runs (.github/workflows/held-runs.yml) then starts review.yml for the
# pull request, and review.yml replays the merge with this workflow_dispatch, with the oss-verify App's token. Held
# runs does not replay it with its own token: a run that a job's GITHUB_TOKEN starts starts no workflow_run when it
# completes, so enroll-dispatch.yml would not run.
#
# This workflow holds no permission, checks out nothing, and runs no code of the pull request.
# pull_request: the workflow file comes from the merge commit, so a pull request that changes it controls this run.
# The code-owner rule on /.github/ of .github/CODEOWNERS guards the merge of such a pull request. enroll-dispatch.yml
# sends no pull request for its theorem statements unless all its files are under one projects/<name>/ (the_project()
# of .github/scripts/enroll-dispatch), and none that changes a steering file (.github/scripts/steering.py) until a
# person approves its head.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
run-name: "merged #${{ github.event.pull_request.number || inputs.pr }}"
permissions: {}
jobs:
  merged:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "enroll-dispatch.yml decides on this run's end"
