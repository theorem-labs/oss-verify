name: "Review re-run"
# When a Build run of an enrollment pull request fails because its review job failed, runs the run's failed jobs again,
# up to the run's third attempt, so that a review that fails for a short fault (a 401 of the model's API on 2026-10-26,
# a 429 of its rate limit) runs again with no person or agent. A failed review fails the required check
# project-builds, so enroll-dispatch's decide stops at "required checks not passed" and puts no label on the pull
# request: no label can select these runs, and until this re-run a person had to start it.
#
# enroll-dispatch.yml calls this file (workflow_call) on the completion of each Build run, from its job review-rerun,
# with the same guard as the decide job below. Why there: the re-run uses the oss-verify App's token, so that the
# re-run's completion starts enroll-dispatch.yml again; the App's key is read through Google's provider github-ossv,
# which admits, on workflow_run, enroll-dispatch.yml on main alone (Theorem's infrastructure code), and a workflow
# that a workflow calls signs in under its caller's workflow_ref.
#
#   decide  runs only for a failed run of this repository's Build (build.yaml), of a pull request's own event
#           (pull_request_target), on main: a run started by hand or for an issue, and a run that a newer push
#           cancelled, are left alone. It reads only the run's id and attempt and the jobs of that attempt (the jobs
#           API), with a GITHUB_TOKEN that reads Actions and writes nothing. It asks for the re-run when the review job
#           ended failure, cancelled or timed_out, the build job (project-builds) passed, and the run is at attempt 1
#           or 2. A build that failed is the project's or the runner's, and a maintainer re-runs it (build.yaml): a
#           re-run here would build it again for up to six hours. At attempt 3 or more it asks for nothing and says so
#           in the step summary: a review that fails each time runs at most three times in one Build run. A new Build
#           run of the same head commit (a person reopens the pull request, or marks it ready for review) starts again
#           at attempt 1. It reads no pull request: a change has no build job that passed, and a re-run of a stale
#           head's review is accepted. It decides nothing new (enroll-dispatch's decide refuses a pull request whose
#           head moved), and Build's concurrency group for the pull request orders it with the pull request's other
#           runs.
#   rerun   in the GitHub Environment comment, whose deployments are main's alone, reads the App's key from Secret
#           Manager as enroll-dispatch's dispatch job does, makes the App's installation token for this repository
#           alone with actions: write alone (actions/create-github-app-token, which revokes it when the job ends), and
#           gives it, in GH_TOKEN, to the one step that runs `gh run rerun <id> --failed`. The job's GITHUB_TOKEN has no
#           permission but the identity token.
# The re-run runs again the failed and cancelled jobs and the jobs that need them, with the run's own event and head
# commit, and with the workflow file of the run's first attempt, the build.yaml of that event's GITHUB_SHA, not main's
# of now. It keeps the privileges of the actor of the run's first attempt (github.actor); GitHub shows the App as the
# actor that started it (github.triggering_actor;
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts).
# The cost in GitHub Actions: one job of a few seconds for each failed Build run of a pull request, and for each re-run
# one more review and the jobs after it, at most two for one Build run. Nothing runs on a schedule.
# No job checks out anything or runs code of a pull request. Only the run's id and attempt reach a shell.
on:
  workflow_call:

permissions: {}

jobs:
  decide:
    if: >-
      github.event_name == 'workflow_run' && github.ref == 'refs/heads/main'
      && github.event.workflow_run.repository.full_name == github.repository
      && github.event.workflow_run.path == '.github/workflows/build.yaml'
      && github.event.workflow_run.event == 'pull_request_target'
      && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read   # the jobs of the attempt that completed
    outputs:
      rerun: ${{ steps.decide.outputs.rerun }}
    steps:
      - name: Whether the review job alone failed, below the third attempt
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[0-9]+$ && $RUN_ATTEMPT =~ ^[0-9]+$ ]] \
            || { echo "::error::The completed run's id or attempt is not a number."; exit 1; }
          # The jobs of the attempt that completed: GitHub lists each job of the run, a job this attempt did not run
          # again with its earlier result. The review job has no name of its own; project-builds' job is named build.
          conclusions=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | {(.name): .conclusion}] | add // {} | "\(.review // "none") \(.build // "none")"')
          read -r review build <<< "$conclusions"
          case $review in
            failure | cancelled | timed_out) ;;
            *) echo "Build run $RUN_ID: its review job is $review at attempt $RUN_ATTEMPT: nothing to re-run."
               exit 0 ;;
          esac
          if [ "$build" != success ]; then
            echo "Build run $RUN_ID: its build job is $build, so the failure is not the review's alone: no re-run."
            exit 0
          fi
          ended="Build run $RUN_ID: its review job ended $review at attempt $RUN_ATTEMPT"
          if (( RUN_ATTEMPT >= 3 )); then
            echo "$ended. At most two re-runs for one Build run: it is not run again." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$ended: the rerun job re-runs its failed jobs."
          echo "rerun=true" >> "$GITHUB_OUTPUT"

  rerun:
    needs: decide
    if: needs.decide.outputs.rerun == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Gets this job, and no other of this file, the App's key: only a token with this environment's claim may act as
    # the account that reads it, as for enroll-dispatch's dispatch job. deployment: false, so that a run posts no
    # deployment; the claim is in the token either way.
    environment:
      name: comment
      deployment: false
    permissions:
      # Only for the GitHub identity token that Google's federation trades for an access token of the account that
      # reads the App's key. The re-run itself is the App's token's.
      id-token: write
    env:
      # Public identifiers, not credentials, as in enroll-dispatch's dispatch job.
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-app-comment@theorem-agent-infra.iam.gserviceaccount.com
    steps:
      - name: Sign in to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          # Nothing is written to the workspace and nothing is exported: the token is this step's output alone.
          create_credentials_file: false
          export_environment_variables: false

      # The App's private key, from Secret Manager, as enroll-dispatch's dispatch job reads it. Each non-blank line of
      # the key is masked, and so is its base64 form. It reaches only the next step's private-key input.
      - name: Read the oss-verify App's key
        id: key
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          payload=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-github-app-key/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)')
          builtin printf '::add-mask::%s\n' "$payload"
          key=$(builtin printf '%s' "$payload" | base64 -d)
          while IFS= read -r line; do
            if [[ $line == *[![:space:]]* ]]; then builtin printf '::add-mask::%s\n' "$line"; fi
          done <<< "$key"
          delimiter="key-$(openssl rand -hex 16)"
          { echo "key<<$delimiter"; builtin printf '%s\n' "$key"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      # actions: write is the narrowest permission that re-runs a run. In this repository it also allows deleting runs,
      # logs, artifacts and caches, cancelling runs, disabling workflows and approving a fork's held run (GitHub's
      # "Permissions required for GitHub Apps", Actions); the token reaches only the next step, which runs no code of a
      # pull request, and the action revokes it when the job ends.
      - name: Get the App's token to re-run this repository's runs
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ steps.key.outputs.key }}
          owner: theorem-labs
          repositories: oss-verify
          permission-actions: write

      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[0-9]+$ && $RUN_ATTEMPT =~ ^[0-9]+$ ]] \
            || { echo "::error::The completed run's id or attempt is not a number."; exit 1; }
          gh run rerun "$RUN_ID" --failed -R "$REPO"
          echo "Build run $RUN_ID: its review job failed at attempt $RUN_ATTEMPT; its failed jobs run again, with the" \
            "oss-verify App's token." | tee -a "$GITHUB_STEP_SUMMARY"
