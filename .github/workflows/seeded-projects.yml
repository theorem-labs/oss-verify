name: "Seeded projects table"
# seeded-projects checks, on each push to main, that docs/seeded-projects.tsv is what src/oss_verify/seeded_projects.py
# writes. The table also depends on the port of each seeded project (projects/<name>/, or else seeds/<name>/). A fork's
# enrollment changes one projects/<name>/ and nothing else, so it cannot commit the table. So tests runs its test of
# the table (tests/test_seeded_projects.py::Committed) only for a change to a file the table depends on in code, to the
# table, or to its test (the top of tests.yaml lists them). This workflow finds a table that any other change leaves
# stale.
#
# The job copies the committed table, runs the generator, and compares the two files with diff. When they differ, the
# run fails. Its summary shows the diff and the command that writes the table. Run that command on a branch, then
# commit docs/seeded-projects.tsv in a pull request. When the generator fails, the run fails with its message.
#
# No job gets a secret, cache, artifact or write permission. Never add one. The job runs the generator in its checkout
# and compares two files, and it needs nothing more. It also reads port files that a fork wrote, so it holds nothing
# that a fork could use. It writes nothing to the repository and does nothing on GitHub: a pull request commits the new
# table, and a maintainer reviews it. The contents: read token goes to actions/checkout alone.
#
# This workflow sends no notice of a failure. A failed run is a red run on main's commit and in the Actions tab. The
# next pull request that changes the generator, seeds/ or the table meets the same failure in Committed.
#
# To run it by hand:
#   gh workflow run seeded-projects.yml --ref main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # One group for each commit: a later push never cancels the run of an earlier one.
  group: seeded-projects-${{ github.sha }}

jobs:
  table:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only for the checkout.
      contents: read
    # This repository's package, for python3 -P -m: -P keeps the top of the checkout off sys.path, and PYTHONPATH
    # names its src/ alone.
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      # The generator reads each series with oss_verify.validate, which needs PyYAML.
      - name: Install PyYAML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml

      # The step uses no git, so it runs the same way in a plain copy of the repository, as
      # tests/test_routed_workflows.py runs it.
      - name: docs/seeded-projects.tsv is what the generator writes
        run: |
          set -euo pipefail
          committed="$RUNNER_TEMP/committed.tsv"
          cp docs/seeded-projects.tsv "$committed"
          # The generator writes docs/seeded-projects.tsv. When it fails, its message is in the log and the step fails.
          python3 -P -m oss_verify.seeded_projects
          status=0
          diff -u --label docs/seeded-projects.tsv --label "src/oss_verify/seeded_projects.py's output" \
            "$committed" docs/seeded-projects.tsv > "$RUNNER_TEMP/table.diff" || status=$?
          # diff exits with 1 when the files differ, and with 2 when it cannot compare them.
          if (( status > 1 )); then
            exit "$status"
          fi
          if (( status )); then
            lines=$(wc -l < "$RUNNER_TEMP/table.diff")
            {
              echo "### docs/seeded-projects.tsv is not what src/oss_verify/seeded_projects.py writes"
              echo
              echo "Run this command on a branch, then commit docs/seeded-projects.tsv in a pull request:"
              echo
              echo '```'
              echo "uv run python3 -m oss_verify.seeded_projects"
              echo '```'
              echo
              if (( lines > 200 )); then
                echo "The diff has $lines lines. These are the first 200:"
              else
                echo "The diff:"
              fi
              echo
              echo '```diff'
              head -n 200 "$RUNNER_TEMP/table.diff"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::docs/seeded-projects.tsv is not what src/oss_verify/seeded_projects.py writes. Run uv run python3 -m oss_verify.seeded_projects on a branch, then commit docs/seeded-projects.tsv in a pull request. The run's summary shows the diff."
            exit 1
          fi
