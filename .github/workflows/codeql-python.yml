name: "CodeQL: Python"
# CodeQL's analysis of this repository's Python (.github/workflows/codeql.yml says how, and why each language has a file
# of its own). It runs on each push to main, and on a pull request into main that changes a file of the paths below:
# a Python file outside seeds/, projects/, tests/fixtures/ and .github/scripts/frame-pointers/, which no analysis reads,
# or a file of the analysis.
#
# A Python file: a name that ends in .py or .pyw, or a script with no suffix whose first line runs python3, which
# CodeQL's Python extractor reads too. Those scripts are listed by name. A new one goes into the list: until then a pull
# request that changes it alone gets no Python analysis, and the push to main analyses it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.pyw'
      # The scripts with no suffix whose first line is #!/usr/bin/env python3.
      - .github/scripts/binary-sizes
      - .github/scripts/copy-validate-rules
      - .github/scripts/enroll-dispatch
      - .github/scripts/review-neutralize
      - .github/scripts/review-verdict
      - .github/scripts/take-build-results
      - .github/scripts/terms-accepted
      - .github/scripts/workflow-credentials
      - infra/base-builder/lay-out-sources
      # The analysis.
      - .github/codeql/codeql-config.yml
      - .github/workflows/codeql.yml
      - .github/workflows/codeql-python.yml
      # Never analysed (.github/codeql/codeql-config.yml).
      - '!seeds/**'
      - '!projects/**'
      - '!tests/fixtures/**'
      - '!.github/scripts/frame-pointers/**'

permissions: {}

concurrency:
  # A pull request's newer run cancels its older one. Each push run has its own group and is never cancelled.
  group: >-
    ${{ github.event_name == 'push' && format('codeql-python-push-{0}', github.run_id)
        || format('codeql-python-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read          # codeql-action lists the Actions cache for main's database
      contents: read
      security-events: read
    uses: ./.github/workflows/codeql.yml
    with:
      language: python
      build-mode: none

  push:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write # to record main's results
    uses: ./.github/workflows/codeql.yml
    with:
      language: python
      build-mode: none
