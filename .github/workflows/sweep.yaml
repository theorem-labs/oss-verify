name: "Sweep"
# Every hour, starts the draft reply to each open issue of this repository that waits for us
# (gh workflow run build.yaml -f issue=<n>, on main), at most CAP (3) for each sweep. An issue waits when its last
# message, its text or its last comment, is not ours, and no Build run titled "Issue <n>" (build.yaml's run-name) was
# made after that message. Ours: oss-verify[bot], sjawhar-agent[bot], and an author that GitHub relates to this
# repository as MEMBER or OWNER. Pull requests are not swept: their own events run Build.
# A Build run for an issue only drafts the reply, into its artifact enroll-review-draft and its summary, and posts
# nothing: a person approves the exact text of each reply first.
# The cost in GitHub Actions: each run that a sweep starts is one Build run (route and review, on ubuntu-latest, then
# hold and required, a few seconds each), and that run's completion starts enroll-dispatch.yml once, which ends at once
# with no record. The sweep itself is one short job each hour.
# The job holds no secret, checks out nothing and runs no code of a pull request. It starts the runs with GITHUB_TOKEN,
# whose events start no workflow run, except workflow_dispatch and repository_dispatch, which always do
# (https://docs.github.com/en/actions/concepts/security/github_token).
on:
  schedule:
    - cron: "17 * * * *"

permissions: {}

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To start Build runs, and to read the recent ones.
      actions: write
      issues: read
      pull-requests: read
    steps:
      - name: Start the draft reply to each issue that waits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CAP: 3
        run: |
          set -euo pipefail
          started=0
          issues=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .number')
          for number in $issues; do
            [[ $number =~ ^[0-9]+$ ]] || continue
            if (( started >= CAP )); then echo "The cap of $CAP runs for each sweep is reached."; break; fi
            # The last message: the last comment, or the issue's text when it has none. Time, author, association.
            message=$(gh api --paginate "repos/$REPO/issues/$number/comments?per_page=100" \
              --jq '.[] | "\(.created_at)\t\(.user.login)\t\(.author_association)"' | tail -n 1)
            [ -n "$message" ] || message=$(gh api "repos/$REPO/issues/$number" \
              --jq '"\(.created_at)\t\(.user.login)\t\(.author_association)"')
            IFS=$'\t' read -r at login association <<< "$message"
            case "$login:$association" in
              "oss-verify[bot]:"* | "sjawhar-agent[bot]:"* | *:MEMBER | *:OWNER)
                echo "Issue $number: the last message is ours."; continue ;;
            esac
            [[ $at =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              || { echo "Issue $number: no time."; continue; }
            runs=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/build.yaml/runs" \
              -f event=workflow_dispatch -f created=">=$at" -F per_page=100 \
              --jq ".workflow_runs[] | select(.display_title == \"Issue $number\" and .created_at > \"$at\") | .id")
            if [ -n "$runs" ]; then echo "Issue $number: a Build run was made after its last message."; continue; fi
            gh workflow run build.yaml --repo "$REPO" --ref main -f issue="$number"
            started=$((started + 1))
            echo "Issue $number: started a Build run." | tee -a "$GITHUB_STEP_SUMMARY"
          done
