# Adapted from OSS Scanner's .github/workflows/build.yaml and .github/workflows/triage.yaml
# (https://github.com/anthropics/oss-scanner), Copyright 2026 Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs,
# PBC: adds the review and its comment to build.yaml, and OSS Verify's comment (its marker and checks) to triage.yaml,
# and then moves those jobs of the two files to this file, on the triggers workflow_run, issues and workflow_dispatch.
name: "Review"
# Reviews the pull requests and the issues of this repository with Claude Code. It screens the text of accounts
# without write access first, posts the review comment and the triage comment as the oss-verify App, and records the
# review of an enrollment in the check run Enrollment review. Each run is of main's copy of this file, on one of three
# events:
#   workflow_run       a run of build.yaml (Build) or triage.yaml (Triage) of a pull request completed. After a Build
#                      run, it reviews the head that the run built: an enrollment with the Build run's results, or a
#                      change. After a Triage run that ended success, it writes the triage comment of a pull request
#                      that touches projects/. After a run of review-approvals.yml (Review approvals: a review of the
#                      pull request was submitted as an approval or a request for changes, or dismissed), it posts the
#                      check run review of that head again, with the approvals read then (the comment job, below).
#   issues             an issue was opened, edited or reopened: it drafts the reply to the issue.
#   workflow_dispatch  a run by hand, on main (below): of a pull request, of an issue, or a measurement of the screen.
#
# The jobs, each run:
#   route    decides the kind of the run, its output `kind`: enrollment, change or issue, or nothing. It reads the item
#            from the API, by its number. On workflow_run it reads only a run of .github/workflows/build.yaml or
#            .github/workflows/triage.yaml on the event pull_request (a pull request can give a workflow file of its
#            own the name Build), a Build run that ended success or failure, and a Triage run that ended success, or a
#            run of .github/workflows/review-approvals.yml on the event pull_request_review that ended success, started
#            by a User with write access or by an App, for which it asks for the comment job's refresh alone (its
#            output refresh) and gives no kind. Its
#            pull request is the open one into the default branch whose head repository, branch and head commit are
#            the run's. With none, nothing runs: the head moved, or the pull request is closed, and the run of the new
#            head reviews it. After a Build run, a pull request into the default branch that changes at least one file
#            and none under projects/ is a change: the review checks it against review-change.md. Any other pull
#            request is an enrollment, and so is a change that an App the review's action refuses started
#            (Copilot's, say): .github/scripts/actor-kind decides that as the action does, by the account's type,
#            with the one list of admitted Apps, ALLOWED_BOTS below. An enrollment is reviewed with the results of
#            that Build run (route's output build_run). After a Triage run, route asks for the triage comment alone
#            (its output triage), when the pull request touches projects/. triage.yaml's paths filter starts Triage
#            only for such a pull request, with limits that triage.yaml tells (renames, which route counts under both
#            names, the 3,000-file limit, a diff that times out, a pull request that changes triage.yaml), so route
#            still reads the pull request's files and decides. An issue of this repository is an issue, which asks
#            for the review alone: on its own event (opened, edited, reopened) when the issue waits for us, and on a
#            run started for it (gh workflow run review.yml -f issue=<n>), once route has read that the
#            number is an issue and not a pull request. An issue's event is ours, and route asks for nothing, when
#            someone who is not the issue's author sent it (only a person with access to this repository can: GitHub
#            lets no one else edit or reopen another person's issue), when an owner or a member of the organization
#            sent it (GitHub's author_association OWNER or MEMBER), or when any App sent it (actor-kind). A run by
#            hand of a pull request is decided as the table below says. No path reviews a closed pull request: for a
#            merged one whose run of enroll-merged.yml GitHub holds, a run by hand gives no kind but the output
#            `replay`.
#            Its trust step then decides who goes first, its output `trust`. Write access is what GitHub's
#            collaborator permission API answers, admin or write; membership of the organisation alone is not, and the
#            Apps in WRITER_BOTS count as having it. `writer` when the author of the pull request or issue and the
#            account that started the run (the one that pushed, opened, edited or reopened, or started it by hand)
#            both have write access: the review runs as it comes, unless the gather job finds comments of others in
#            it (below). So a run started by hand is trusted as the item's author, as an event's run is. `screen`
#            otherwise: the screen job reads the pull request or issue first, and only a clean verdict lets the
#            review run, with no person. Before that, the daily cap (REVIEW_CAP and REVIEW_CAP_AUTHOR, below) counts
#            this file's runs of the last 24 hours that route let screen for an account without write access, from
#            the moment route did (its step "Mark this run for the daily cap"), unless they ended before their screen
#            job's sign-ins (.github/scripts/screened-review-cap). The count started again at the merge that moved the
#            review to this file. Over it the trust is `cap`, the item gets no screen and no review, and route's output
#            `free` gives the time the cap lets it run. `measure` for a run started by hand with -f measure=true and no
#            pr or issue: the screen job alone runs, and measures its rules (below).
#   gather   gathers what the review reads, once, with .github/scripts/review-gather (below), and keeps it as the
#            artifact review-data, which the screen and the review take only by its SHA-256
#            (.github/scripts/take-review-data): the review reads exactly what the screen passed. It holds no model, no
#            identity token and no write permission. It checks out main, never the pull request. Its first step reads
#            the pull request again: when its head is no longer the head that route read, the job keeps nothing, because
#            the push started a run of its own. For an enrollment it takes projects/<name>/ with
#            .github/scripts/take-project, as the build does, and reads the Build run's results as data, with
#            .github/scripts/take-build-results (below). When take-project takes no project (a pull request that changes
#            several projects, or only removes one, a fork's too), the job gathers the pull request as a change, its
#            output kind, which the later jobs read in place of route's: it gets a change review and its check run
#            review. When the build took a project from a branch that changes other files too, its output outside counts
#            them, and the enrollment review judges them by review-change.md as well. Its output `screen` is true for
#            route's trust `screen`, and for a writer's item whose comments, reviews or review comments include one by
#            an account without write access (or one GitHub cannot name; an App's own comment is told by the REST API's
#            account type for that comment, and a writer App's review by the login the REST API gives that review).
#            Every item keeps the session of its last review, screened or not: the review job takes it,
#            and the screen job does not. For every enrollment it gathers the project's repository at the built commit,
#            and a fetch that fails fails this job (below).
#   screen   when the gather job's output `screen` is true (.github/scripts/screen.py): independent checks, which
#            SCREEN_CHECKS lists, read the text that the pull request or the issue carries (for a writer's item, its
#            comments, reviews and review comments alone, SCREEN_SCOPE comments): Google Cloud Model Armor's prompt
#            injection and jailbreak filter; Azure AI Content Safety's Prompt Shields, which reads the text as
#            documents; and a small Claude model with no tools whose answer a schema holds to the words clean and
#            suspicious, each through the screen's own identity (its env below). The two detectors read all the
#            text joined. The model is asked two questions, each three times, each word the majority of its three
#            answers: one about the text, and one about a projects/<name>/patch_style.md the enrollment adds,
#            which a project writes for us and the review reads, and which the first question would answer about
#            for being what it is. Either question's word suspicious is the model's word.
#            SCREEN_RULE makes the verdict of their words: claude_or_both_detectors, held when the model answers
#            suspicious or Model Armor and Prompt Shields both do (.github/scripts/screen.py, RULES, and the
#            measurement that chose it). Under every rule, a check that cannot answer or runs out of time, a file
#            the review reads that is not text or that the diff shows as binary, text with characters that hide it
#            (bidirectional overrides and isolates, tag characters, and zero-width characters, but a joiner between
#            two letters of a script that
#            uses joiners or inside an emoji, a byte order mark at the start of a file, and a word joiner where
#            .github/scripts/review-neutralize puts one in this App's own comments), or more text than the screen
#            reads, holds it. A screen that cannot sign in or cannot get a model token (GitHub's identity token,
#            Microsoft Entra's token, Anthropic's token exchange) is the one exception: screen.py fails the screen
#            job, with no verdict. The comment job then records the hold as for a screen that failed, and Held runs
#            (.github/workflows/held-runs.yml) starts the screen of a held head again, at most once an hour. A screen
#            that fails, and a screened review that fails, fail the check review jobs
#            (collect, below), which a re-run of the failed jobs clears. The daily cap stops an item before the screen
#            (route, above). It runs in the environment
#            review-screen, whose jobs alone reach the screen's Google, Azure and Anthropic identities. Why it held an
#            item goes to the private bucket theorem-agent-infra-review-screen-reasons, as
#            theorem-labs/oss-verify/<run>-<attempt>.json, never to this public log, an output or a comment: its
#            outputs are the verdict and the names of the checks that ran.
#            A measurement (gh workflow run review.yml -f measure=true [-f measure_set=measure/set-v<n>.json]
#            [-f measure_repeats=<1-5>]) reviews nothing: the screen job runs every listed check that many times
#            (3 by default) on each text of a labelled set kept in the private bucket (measure/set-v1.json by
#            default; the screen's account can read only measure/set-* of it), and puts the false holds and missed
#            injections of each rule in the run's summary. The texts, and each check's words for them, stay in the
#            bucket, as measure/runs/theorem-labs/oss-verify/<run>-<attempt>.json. On such a run the check review
#            jobs passes when route and the screen job passed and every other job was skipped.
#            What it reads: the text an outside account decides, by its author and its source, never by what it
#            says. The item's title and body; its comments, reviews and review comments, but this App's own; the
#            commit messages; the diff; for an enrollment the seed corpora's bytes, the facts of the project's
#            repository and the report of the fuzz targets' checks, which quote that repository; and any other
#            file the gather job writes that .github/scripts/screen.py's GENERATED does not name. Each changed
#            file, and each file of projects/<name>/ but a seed corpus, must be text, whose new lines the diff
#            holds. What it does not read: the files main's own scripts write (GENERATED, with the reason for
#            each) -- the triage comment and triage's own report, the validator's and the checklist's output, the
#            template's history, the checks' names, the line that stands in for the project's repository, the
#            build's result and binaries table -- which are addressed to a reviewer or to the review's model, so
#            a check that reads them answers about main and not about the account; the project's repository at
#            the built commit (.review/source/), far more text than a screen reads, which the review of every
#            enrollment reads as data, whoever wrote the pull request; and the last review's session that the review
#            resumes, the model's own earlier context.
#   review   Claude Code, through anthropics/claude-code-action, in one Review step for every kind: what it reads and
#            what it gives come from .github/scripts/review-prompt, run before it for route's kind. For an
#            enrollment it checks what review.md says (main's copy, at the root of the checkout) on what
#            .github/scripts/review-gather gathered: the pull request, the project's source at the built commit, and
#            the build's results, with .claude/skills/review-enrollment/SKILL.md for where those are. It gives a
#            structured output: the comment that asks the maintainer for each fix, any finding held back (review.md,
#            rule 6), and a verdict for each check of review.md (pass, fail, person, or optional for a weak F5 or F8)
#            with the reason of each one that is not pass. The comment, the verdicts and the reasons
#            are the job's outputs, from which the comment job writes the review comment and the check run Enrollment
#            review (below); no file and no artifact holds them. When the Review step fails or runs out of its 45
#            minutes, the step "Review again" runs once more with the same inputs; no step counts the attempts.
#            On a later push it resumes the same Claude Code session as the last review, whoever wrote the pull
#            request (the screen still reads the new text first), so it knows what it asked
#            for and why, and reviews only the diff since the commit it reviewed then, with one exception: check D3 of
#            review.md answers each failing result of the Build run's report of the new head. For a change it checks
#            what review-change.md says, on the pull request's diff and files read as data; on a later push it
#            resumes the last change review's session for context (key review-<number>), with the head that review
#            reviewed taken from its review comment only, and judges checks 4 and 5 on the whole diff again. For
#            an issue it drafts the reply as review-issue.md says, from the issue's title, body and comments, read as
#            data, with no session kept. No job posts the draft, and it is never the public artifact or job summary:
#            it and what a person decides on it go to the private held-findings bucket
#            (.github/scripts/store-issue-draft), and the job summary says how a person at Theorem reads them. This
#            repository is public, so anyone with a GitHub account can open an issue and start that path: on an
#            issue's own event the step "Hold the draft at the hourly cap" (.github/scripts/issue-draft-cap) runs
#            first, and at 6 drafts that ran the model in the last hour, or when it cannot read the runs, it fails the
#            job with `::error::HELD: ...`: no draft is made and the run is red, and the CI/CD lane's inbound watch
#            pages for each such run (ISSUE CAP HELD). A person re-runs the job to make the draft. The draft can be
#            stored only when Google's identity provider for this repository admits the run's event: when the sign-in
#            before the model is refused for an issue, the step "Stop before the model when the draft cannot be
#            stored" fails the job with `::error::NOT STORED: ...` before the model runs, and the cap does not count
#            that run. The review does not run on a run by hand for a held head (below).
#   session  saves the review's session in the Actions cache, for the review of the next push (below). It runs no
#            script and reads nothing of the pull request: it moves the artifact the review job kept into the cache.
#   hold     sends each real bug in a project's own code that a review held back from its comment (review.md, rule 6)
#            to the disclosure route as a private issue (.github/scripts/review-hold): the review job stores it in a
#            private bucket that only this job can read, and this job sends every finding stored there, a cancelled
#            run's too. A finding never reaches a log, an output or an artifact. Its title and text go through
#            .github/scripts/review-neutralize before they are posted, as the comment's do (below).
#   comment  writes, as the oss-verify App, what the run decided. For an enrollment pull request, on every run whose
#            gather job took the project, or that route held at the daily cap, its step "Post the comment and record
#            the verdict" records one check run Enrollment review on the run's head (.github/scripts/review-verdict):
#            the one record of the review's verdict, which enroll-dispatch.yml reads. It names its pull request (its
#            external_id is the pull request's number), so a second pull request at the same commit has its own. Its
#            conclusion is failure when one check is fail; success when each is pass or optional; and action_required
#            when one is person, or when the screen held the pull request, the daily cap stopped it, or the gather,
#            screen, review or hold job failed. Its summary lists each check that is not pass with the review's
#            reason, or says why the review gave no verdicts. Its output.text keeps the record of the review for
#            programs, in an HTML comment that GitHub does not show: the verdicts or the hold, and the criticality
#            score, OSS-Fuzz and binary sizes that the gather job gave (review-verdict's docstring defines it). It is
#            no check that the ruleset requires, so action_required never stops a person's merge. When the review gave
#            its verdicts and the pull request is still at the run's head, the same step posts the review comment,
#            with the checks' report folded under it, or replaces the one already there; any other outcome posts
#            nothing, and the comment of an earlier head stays. Its step "Take the label review-held off" then deletes
#            the App's hold comments from before and takes the label review-held off, so the review comment stays the
#            App's only comment on an enrollment pull request. For a change pull request it posts the review comment
#            the same way, with no check run Enrollment review. The comment starts with <!-- oss-verify-review -->, as
#            the triage comment starts with its own marker; an enrollment's comment then gives the fixed first
#            sentence of the check run's conclusion, and a change's the title of its check run review
#            (.github/scripts/review-body).
#            For every pull request it reviews or holds, the same step, or the hold's step, also posts the check run
#            review on the head the run reviewed (.github/scripts/review-check), which R14 of
#            dispatch://INFRA-5359/spec has main's ruleset require from this App, once agent-infra's github/ program
#            lists it: success when the review has no
#            blocking item, failure otherwise, with a fixed title and a link to the review comment. A change passes
#            when each of review-change.md's five checks is pass, each ordinary choice the review lists has its basis,
#            and each choice reserved for a person has a person's approval of that head (.github/scripts/approval.py).
#            An enrollment passes once its review ran without error, when it changes only files directly inside
#            projects/<name>/: Enrollment review keeps the review's own conclusion. One that changes other files too
#            (only a branch of this repository can) passes only as a change does, on the verdicts and choices that the
#            same review gives those files. A hold fails it, unless a person approved that head: a User with write
#            access who is not the author, whose newest deciding review is that approval (.github/scripts/approval.py;
#            dispatch://INFRA-5359/ask/605104e3-b85c-4c22-9a54-b254ba0e3c10). Then it passes, and its summary names that
#            person and nothing of the pull request's text. A review that fails on a path that records no hold posts no
#            check run review, so the head stays without one, and GitHub holds its merge. A newer head has no check run
#            until its own review posts one.
#            The review's text and the checks' report, which a pull request can steer, reach the comment only through
#            .github/scripts/review-neutralize: with no mention, no reference to an issue or pull request, no unclosed
#            HTML comment that hides what follows it, and no line that holds a marker of this comment, so no one else
#            is notified as oss-verify[bot] and the comment's markers are the job's own. The reasons in the check
#            run's summary go through it too. It never posts an issue's draft: a person approves the exact text of
#            each reply to an issue before anyone posts it.
#            It also holds a change pull request or an issue: for one that the screen held, that could not be
#            gathered or screened, whose screened review did not finish, or that route held at the daily cap, it puts
#            the label review-held on it and posts one comment in fixed words (marker <!-- oss-verify-held -->) that
#            says it was held, how a person with write access starts the review, and for a pull request that such a
#            person's approval of the head passes the check run review, and nothing of why; a hold at the
#            cap says from when a push (for an issue, an edit of it) or a run by hand reviews it. A review it posts
#            later, or for an issue a later review that made its draft, takes the label off and deletes that comment,
#            unless a newer hold came after that review's run started.
#            On a run by hand for a held head (below), its step "Approve the held runs" approves every held run of
#            that head (.github/scripts/approve-held) when the screen's verdict is clean. Such a run posts no review,
#            no comment and no check run. A hold of it is recorded by the rules above, except when the newest check
#            run Enrollment review of the oss-verify App for that pull request at that head is a verdict of the review:
#            that verdict stands. A hold replaces an earlier hold.
#            On a run by hand for a merged pull request whose run of enroll-merged.yml GitHub holds (route's replay,
#            below), its step "Replay the merge for Enroll dispatch" starts enroll-merged.yml for that pull request with
#            the App's token, so that enroll-dispatch.yml runs on its completion. Such a run does nothing else.
#            After a Review approvals run (route's refresh), its step "Post the check run review again, with the
#            approvals read now" posts the check run review of route's head again from the record of the newest
#            one, with the approvals read then (.github/scripts/review-check --refresh), so a choice reserved for a
#            person, or a hold, passes once a person approves the head, and fails again once no person's approval of
#            that head stands. No model runs. Such a run does nothing else.
#   triage-gather
#            after a Triage run, or on a run by hand that a person starts, for a pull request that touches projects/
#            (the paths GitHub lists for it, renames under both names): writes the triage comment with main's
#            .github/scripts/triage.py, which reads the pull request through the GitHub API, as data, with a read-only
#            token. The comment on the pull request is public and carries only whether the repository is a fork, the
#            license, whether whoever opened it looks like an active maintainer, the pull request's scope, oss-verify
#            validate and the checklist. The full table, for Theorem's reviewers, is this job's summary: it adds the
#            project's standing, stars and forks, outside participants, criticality score, OSS-Fuzz, .oss-verify/ in
#            its repository and its status in the proofs index. Both inform the review and decide nothing.
#   triage   does nothing but post the text triage-gather produced, or update the one already there, as the oss-verify
#            App, with an installation token that can write pull requests in this repository only.
#   collect  always runs, last, and reports the check review jobs (below).
#
# collect, the check review jobs, runs .github/scripts/collect on every run, after all the other jobs whatever their
# results. It passes only if route passed and every job route asked for passed: the gather, screen, review, session,
# hold, comment, triage-gather and triage jobs when their own conditions call for them (the screen and the review on
# the gather job's outputs screen and digest). Every other job must be skipped. A held item passes it when the comment
# job recorded the hold: for an enrollment in the check run Enrollment review (the screen's hold or the daily cap),
# for a change or an issue with the label review-held. On a run by hand for a held head whose verdict of the review
# stands (above), the comment job records nothing and passes. A gather, screen, review (after its second
# attempt), hold or comment job that failed fails it, held or not, which a re-run of the failed jobs clears. It is no
# check that the ruleset requires: a check of a job of a workflow_run or workflow_dispatch run never satisfies a
# required check
# (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated),
# which is why the comment job posts the required check review itself, as the oss-verify App, through the API.
# An open enrollment's statements start only when its check run Enrollment review is success (enroll-dispatch.yml).
# The review is of a commit: build.yaml does not run on edited, so an edit of the description alone is reviewed with
# the next push.
#
# workflow_run, issues and workflow_dispatch, not pull_request: each runs main's copy of this file and of
# .github/scripts, whatever a pull request changes. The jobs that hold a key (screen, review, hold, comment and
# triage) are safe on these events for these reasons:
#   - A pull request that changes the workflow or the scripts of its own Build and Triage runs (on pull_request)
#     controls those runs, their checks and their artifacts. So this file reads only this of such a run: its file,
#     event, conclusion, head repository, head branch and head commit, which GitHub gives, and for an enrollment its
#     artifact build-results, as data.
#   - The item is read from the API, never from a checkout of the pull request. route finds the open pull request of
#     the run's head repository, branch and head commit, and the gather job reads its text, its diff and its files
#     through the API, with main's .github/scripts. No job checks out the pull request, and no job runs code of the
#     pull request or of the project.
#   - The gather job reads the Build run's results (.github/scripts/take-build-results) only for a pull request that
#     changes no steering file (.github/scripts/steering.py). For such a pull request the merge commit's workflow and
#     scripts are main's, so main's code wrote the artifact. For any other pull request the review reads a fixed line
#     in their place. The artifact must name the pull request, the head and the project that this run read itself,
#     and it never gives the number, the head, the diff or the files that a job of this run reads or posts to.
#   - A run by hand on another branch than main does nothing: route stops, and each job that signs in checks the ref
#     too. Google's provider, the tailnet identity and the environments below admit refs/heads/main alone.
#
# The review job runs no code of the pull request or the project. It, the screen job, the hold job, the comment job and
# the triage job hold identity tokens (id-token: write), which they trade for short-lived tokens: the review's for an
# ephemeral tailnet node, which reaches Theorem's model gateway and exports the review's usage (below), and for the
# gateway's sign-in, a Google identity token, so no API key is stored; the screen's for the screen's own Google, Azure
# and Anthropic tokens (the screen job); and the review's, hold job's, comment job's and triage job's for a Google
# access token by Google workload identity federation (Theorem's infrastructure code). Claude gets three tools only,
# Read, Glob and Grep (`--tools`), in the default permission mode (`--permission-mode default`, which refuses a read
# outside the checkout): no shell, no network and no tool that writes, so the text of the pull request, which it reads
# as data (review.md, rule 1), cannot make it run anything or reach the job's tokens. The action keeps the GitHub
# identity token's request variables out of Claude Code's environment, and with allowed_non_write_users it keeps the
# GitHub token out of the checkout's git config. Never re-run the review job with debug logging (ACTIONS_STEP_DEBUG):
# the action then prints the whole conversation, a held finding too, to the public log. The comment job and the triage
# job alone write to this repository: they post as the oss-verify GitHub App (oss-verify[bot]), with an installation
# token that can write pull requests in this repository only. The comment job's token can also write its checks and
# issues (the check run, the label and the hold comment). For the approval of held runs and the replay of a merge alone,
# the comment job makes a second token, which can write the runs of this repository and nothing else. Each job makes its
# tokens from the App's client id below and its private key, which it reads at run time from Secret Manager
# (oss-verify-github-app-key), and runs no code of the pull request or the project.
#
# This repository stores no long-lived credential for any of that. dispatch://INFRA-3746 (a part of
# dispatch://INFRA-3369) makes Theorem's identities admit this file, on refs/heads/main and only from its own events
# (here workflow_run, issues and workflow_dispatch, as Theorem's infrastructure code lists them): Google's provider
# github-ossv for the accounts ossv-ci, ossv-app-comment and oss-verify-ci, the screen's Google pool review-screen and
# its Anthropic rule oss-verify-screen, and a second tailnet identity, ossv-review-yml-github, for the review job. The
# three applies of dispatch://INFRA-3746 (bootstrap/, anthropic-org/ and root/ in agent-infra) ran on 2026-11-17.
# So each job that signs in (screen, review, hold, comment and triage) can sign in once this file is on main. A
# token carries no job name, so what keeps each Google account to the job that needs it is the job's GitHub Environment,
# which the token carries a claim for: `ossv-ci`, which the review job uses only to store a held finding or an issue's
# draft, can be acted as only from the environment `enroll-review`, which the review job declares; `ossv-app-comment`,
# the account these jobs read the App's key as, only from `comment`, which the hold, comment and triage jobs
# declare; the screen's account, only from `review-screen`, which the screen job declares. A job that declares no
# environment, gather and triage-gather among them, reaches no account.
# A pull request from a fork gets the same identity tokens in the review and comment jobs: workflow_run runs this file
# from main, never the fork's copy, so the fork's code never holds them.
#
# The review reaches Claude through Theorem's model gateway (INFRA-481), a proxy of Anthropic's API on Theorem's
# tailnet alone, at the URL in the repository variable MODEL_GATEWAY_URL (ANTHROPIC_BASE_URL below). The step
# "Check the model gateway's URL" stops the job before the sign-in unless that value is exactly https://<host>: with
# no base URL, Claude Code would send the gateway's token to Anthropic's own API. The review job signs in with no
# stored key: Google's workload identity provider (Theorem's infrastructure code) trades the job's GitHub identity
# token for a Google identity token of the service account oss-verify-ci, audience model-gateway-gce, which the gateway
# serves as its team oss-verify-ci with model calls only, and which the Review step gives Claude Code as its API key.
# Google's identity token lives one hour, longer than the Review step's 45 minutes, and the sign-in runs just before it;
# "Review again" signs in again before it runs.
# The provider admits this file, on refs/heads/main, from its own events. The review, screen, hold, comment and
# triage jobs of this file ask for an identity token; no other job of it does. The screen job's Anthropic token comes
# from its own federation rule, oss-verify-screen, which admits the environment review-screen alone.
# A review runs only on main: Google's provider and the tailnet identity below admit refs/heads/main alone, so a run on
# another branch gets no Google token and no tailnet node. So a change to
# the review is tried for real only once it is on main: run `gh workflow run review.yml -f pr=<n>`, which reviews the
# pull request's head as its own runs do (screened first, and counted by the daily cap, when its author has no write
# access), posts the comment and, for an enrollment, records the check run Enrollment review, or `-f issue=<n>`
# for the reply to an issue, which posts nothing and stores the draft in the private bucket.
# Before a change to this file merges, tests runs the review's own steps with stand-ins.
#
# The review's Claude Code exports its usage by OpenTelemetry to Theorem's cost collector, over Theorem's tailnet, at
# the collector's tailnet address on port 80 (SPEND_COLLECTOR_URL below; an address, not a secret). The collector
# keeps a public endpoint with a bearer token until INFRA-832 deletes it; this job uses neither. The review job joins
# the tailnet as an ephemeral node with the tag tag:ossv-review, and holds no token for the collector: Tailscale
# makes the node from this job's GitHub identity token, and WireGuard authenticates and encrypts each connection.
# The tag, the grant that gives the tag the collector's Tailscale Service svc:spend on tcp:80 and nothing else beyond
# the two read-only pages every node of the tailnet may read (Dispatch and the results dashboard, on tcp:443), and the
# policy test that fails if the tag reaches anything else, are declared by INFRA-832 S1a in agent-infra, merged on
# 2026-10-30 as 99d1b5d. Its bootstrap apply ran on 2026-10-31 at agent-infra c96f3d672, and the address below is an
# output of that apply. The federated identity that trades this file's token for the node is ossv-review-yml-github
# (dispatch://INFRA-3746), and its client id below comes from the apply of root/ for that issue on 2026-11-17. The
# export is tagged theorem.project=oss-verify, theorem.subproject=<name> (or _change, or _issue: a project name never
# starts with `_`), theorem.lane=enroll-review-ci and theorem.credential=oss-verify-ci. The export is a measurement and
# never decides whether a review runs: if the job cannot join the tailnet, or the collector does not answer at its
# address, the run's page carries a warning saying that this review's usage is not exported, and the review runs
# without it.
#
# The review's session goes from one push to the next in the Actions cache, under the key
# enroll-review/<pull request>/<project>/<run id>-<attempt>: ~/.claude/projects, where Claude Code keeps its sessions,
# and ~/.claude/ossv-last-review, one line `session=<id> head=<commit>`. The gather job restores the newest entry of
# the pull request and project; when the head descends from the commit that session reviewed, review-gather writes the
# diff since then and the review resumes that session (claude --resume <id>, which keeps its id) to review only that
# diff. When a session is kept, the log of the gather step says which: "the review resumes the session <id>", or "the
# review is fresh"; it says neither on a first review. It does so for every enrollment, whoever wrote it: the screen job
# reads the new text of a push first, and never takes the session (.github/scripts/take-review-data).
# On workflow_run and issues GitHub gives a job read-only access to main's cache unless the job declares a
# write-capable cache-mode, and such a job must process no untrusted input before it writes, or a run that later
# restores the entry could act on what the pull request put there (GitHub's dependency caching reference,
# "Bypassing the default untrusted-trigger cache restriction"). So the gather job, which reads the pull request, only
# restores (cache-mode: read), and keeps the session in the file the review job takes; the review job, which runs the
# model, does not touch the cache. After the review it keeps the two paths as the artifact
# enroll-review-session, for one day, and the session job saves that artifact, by its id, in the cache (cache-mode:
# write): that job checks out nothing, runs no script, holds no permission and no identity token, and runs two pinned
# actions that move the files. Both are main's copy of this file, whatever the pull request changes. A run on main
# restores only entries that a run on main saved: a pull request's own runs (pull_request, or a push to its branch)
# save only in the scope of refs/pull/<n>/merge or of their branch, which a run on main does not restore. So the code
# of a pull request cannot write the session that its review resumes. Every other job has cache-mode: none (below).
# What the gather job restores is still text that the pull request steered, the session of its own earlier review:
# it is the model's context, read as data as the pull request itself is, and no step runs it.
# A session holds the public inputs the review read and the review's own reasoning. As with every cache entry of main,
# a pull request's own run can read it, and so can anyone signed in to GitHub, for a day, as the artifact. GitHub
# drops an entry that no run has read for 7 days, and the next review is then fresh. A save that fails is a warning,
# never a failure, and the next review is then fresh too. A review that holds back a finding (review.md, rule 6) keeps
# no session, because the session would hold the finding: the next push resumes the last session kept before it, or
# starts fresh.
# A change review keeps its session the same way under review-<number>-<run id>-<attempt>, for context only:
# review-gather takes the commit its last review reviewed from the review comment of that review, never from
# ossv-last-review, and the review judges checks 4 and 5 on the whole diff again (.github/scripts/review-gather). Of
# the cached file it takes the session's id, and resumes that session only when the head the file names is the commit
# the review comment gave.
# Only the review job can act as ossv-ci: that comes with the environment enroll-review. Its deployment branch rule,
# declared in Theorem's infrastructure code, allows main alone; GitHub checks it against the run's ref, which is main
# for workflow_run and issues, the branch a run by hand was started on, and refs/pull/<n>/merge for a pull request's
# own run. That rule is the second lock beside Google's provider, which admits refs/heads/main alone. The environment
# and its rule are declared in the organisation's infrastructure code, and made by its apply: do not make them by hand.
#
# A run by hand, on main only:
#   gh workflow run review.yml -R theorem-labs/oss-verify -f pr=123
# reviews pull request 123 as this table says, by the head of the pull request when route reads it:
#   - Merged into the default branch, with a run of .github/workflows/enroll-merged.yml that GitHub holds (status
#     action_required, event pull_request) at the head commit or the merge commit, from the pull request's head
#     repository and branch: no kind, so no gather, screen, review, hold or triage. The comment job replays the merge
#     with the App's token (gh workflow run enroll-merged.yml -f pr=123), so that enroll-dispatch.yml runs on the
#     completion of that run. A run that a job's GITHUB_TOKEN starts starts no workflow_run when it completes, and a
#     run that an App's token starts does: so Held runs, whose token is its job's, has this file start the replay.
#   - Closed, with no such run: nothing. route says that the pull request is closed, or that GitHub holds no such run.
#   - Held: GitHub holds runs of that head (status action_required), which it does for each push of a first-time
#     contributor. A held run of a label that the oss-verify App put on does not count, as in Held runs (route). The
#     kind comes from the paths alone: a file under projects/ makes it an enrollment, else a change,
#     whoever started the run (the review job does not run on this path, so actor-kind's refusal of an App does not
#     apply). The gather job reads it from the API, with no results of a build, and the screen reads it. When
#     take-project takes no project (a fork that changes more than one project, say), the gather job gathers it as a
#     change, and the screen reads the text, the diff and each changed file. A clean verdict: the comment job
#     approves every held run of that head, and posts no review, no comment and no check run. A screen that held it,
#     a job that failed, or the daily cap: the comment job records the hold by one rule. An enrollment at the cap, or
#     one whose project the gather job took, gets the check run Enrollment review with the hold. But when the newest
#     check run Enrollment review of the oss-verify App for that pull request at that head is a verdict of the review,
#     that verdict stands. The comment job then records nothing and posts nothing. When that check run is a hold, the
#     new hold replaces it. Any other item gets the label review-held and the hold comment.
#   - Not held, an enrollment with a completed Build run of that head that wrote build-results: the review, with the
#     results of the newest such run, and the comment.
#   - Not held, an enrollment with no such Build run: nothing. route says "No Build run of this head wrote results: a
#     push, or a close and a reopen, builds it."
#   - Not held, a change: the review, and the comment.
#   - Not held, and the run's actor is github-actions[bot] (Held runs started it): nothing. route says "Held runs
#     started this run for a held head, and the head is no longer held." The review's action refuses a run that an App
#     outside ALLOWED_BOTS started.
# A run by hand that a person starts also writes the triage comment of a pull request that touches projects/, whatever
# the review does. A run that Held runs starts writes none: the Triage run that its approval lets complete has this
# file write it.
# To draft the reply to an issue of this repository (its own events start such runs too):
#   gh workflow run review.yml -R theorem-labs/oss-verify -f issue=45
# To measure the screen: gh workflow run review.yml -R theorem-labs/oss-verify -f measure=true (the screen job, above).
# Started on any branch but main, a run by hand does nothing: route stops, and each job that signs in checks the ref
# too.
# No person has to start the run for a held head: Held runs (.github/workflows/held-runs.yml) starts it, as
# github-actions[bot], for each open pull request whose head has held runs that no run by hand screened after them. The
# comment job then approves the held runs of a head that the screen passed, and the completion of its approved Build run
# starts the review of that head in this file (workflow_run). Held runs starts it also for a merged pull request whose
# run of enroll-merged.yml GitHub holds, and the comment job of that run replays the merge.

run-name: ${{ inputs.measure && 'Measure the screen' || (github.event_name == 'workflow_run' && format('Review of run {0}', github.event.workflow_run.id)) || ((inputs.issue || github.event.issue.number) && format('Issue {0}', inputs.issue || github.event.issue.number)) || format('Pull request {0}', inputs.pr) }}

on:
  workflow_run:
    # By the workflows' names: route reads each run's file, and reviews a run of build.yaml or triage.yaml, or
    # refreshes the check run review after a run of review-approvals.yml, alone.
    workflows: [Build, Triage, Review approvals]
    types: [completed]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request to review (give pr or issue, not both)"
        required: false
        type: number
      issue:
        description: "Number of the issue of this repository to draft a reply to (give pr or issue, not both)"
        required: false
        type: number
      measure:
        description: "Measure the screen's rules on its private labelled set, and review nothing (give no pr or issue)"
        type: boolean
        default: false
      measure_set:
        description: "The labelled set to measure on, an object of the private bucket (measure/set-v<n>.json)"
        type: string
        default: measure/set-v1.json
      measure_repeats:
        description: "How many times each check answers each text of the set (1 to 5)"
        type: number
        default: 3

permissions: {}
# No job reads or writes the Actions cache unless it says so: the gather job restores the review's session, and the
# session job saves it.
cache-mode: none

env:
  # The Apps whose runs the review's action admits (its allowed_bots): our automation's, which opens enrollments and
  # starts this file by hand, the oss-verify App's, Legion's implementer App, which opens the pull requests of Legion's
  # workers, Legion's reviewer App, which reviews them (and opens some), and Dependabot's, whose pull requests bump the
  # pinned actions and so need the check run review to merge. The one list: route reads it through
  # .github/scripts/actor-kind, which decides as the action does, and the Review step gives it to the action.
  ALLOWED_BOTS: sjawhar-agent[bot],oss-verify[bot],legion-implementer[bot],legion-reviewer[bot],dependabot[bot]
  # The Apps of ALLOWED_BOTS that count as accounts with write access: route's and the gather job's trusted,
  # .github/scripts/screened-review-cap and enroll-dispatch's trusted read this list. Each one's installation holds
  # write permissions on this repository, the criterion the collaborator API answers for a person: by gh api
  # apps/<slug> on 2026-11-27, each of the four holds contents, pull_requests, issues and actions write, and
  # legion-reviewer[bot], legion-implementer[bot] and oss-verify[bot] checks and statuses write as well. Their
  # comments and reviews are this project's own text, so the screen does not read them, and their review comments
  # only when every review comment of the item is a writer's (the gather job's step "Whether the review reads text
  # of an account without write access", and all_review_comments_are_ours of .github/scripts/screen.py). An App
  # never counts as a
  # person's approval (.github/scripts/approval.py). Dependabot is not one of them: the text of its pull requests is
  # screened, and its runs are capped, as an account's without write access.
  WRITER_BOTS: sjawhar-agent[bot],oss-verify[bot],legion-implementer[bot],legion-reviewer[bot]
  # The daily cap on the screens and model reviews of accounts without write access: at most REVIEW_CAP runs in any 24
  # hours over all pull requests and issues, and at most REVIEW_CAP_AUTHOR of them charged to one account. route's
  # trust step counts them with .github/scripts/screened-review-cap for every item whose trust is screen, before the
  # screen: the runs that route let screen (its step "Mark this run for the daily cap"), from that moment, unless they
  # ended before their screen job's sign-ins. A run started by an event is charged to the account that opened, pushed,
  # edited or reopened the item, and a run started by hand to the item's author. An item over the cap gets trust cap:
  # no screen and no model call, and route's output free gives the time the cap lets it run. A count that cannot read
  # GitHub fails route.
  REVIEW_CAP: "24"
  REVIEW_CAP_AUTHOR: "12"
  # The label a held issue or change pull request gets, and the marker of the comment that says so.
  HELD_LABEL: review-held

concurrency:
  # A run after a Build run: a group of its own, by the id of that run, so that nothing cancels it across pull
  # requests. A group by the head repository and branch would be shared by a second open pull request from the same
  # branch into another base, and the run of one would cancel the review of the other. So a newer Build run of a pull
  # request does not cancel the review of its older head: that review runs on, and the gather job's first step reads
  # the head again and keeps nothing when it moved (the top of this file). A run after a Triage run that ended success:
  # one group for the head repository and branch of that run. route triages only the pull request into the default
  # branch, so a second pull request from the same branch into another base gets no triage, and the shared group
  # cancels no triage of it. Of two Triage runs of one pull request (an edit of the description, and then one more),
  # the run after the newer cancels the run after the older, so the triage comment is of the newest description. A run
  # after a Triage run that did not end success writes no triage comment: route stops it. It has a group of its own, by
  # the id of that run, so that it cancels no run that writes the comment of an earlier edit. triage.yaml gives an edit
  # of the title alone (its Triage run skips the one job) a group of its own for the same reason. A re-run of the same
  # Build run has the same group, and cancels the run that its earlier attempt started. By event too, so that a run
  # started by hand never cancels the run of an event. For an issue's events, one run at a time for each issue,
  # and the newest waiting run replaces an older waiting one: an edit while a draft runs waits for it. Only the events
  # that the issue's author sent share that group: route skips every other (the top of this file), and each of those
  # gets a group of its own run, so it never replaces a waiting run of the author's own edit. An event that the author
  # sent and route still skips (an owner, a member or an App wrote the issue) is of an issue that never gets a draft.
  group: review-${{ github.event_name }}-${{ (github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'Triage' && github.event.workflow_run.conclusion == 'success' && format('Triage-{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || github.event.workflow_run.id)) || inputs.pr || inputs.issue || (github.event.sender.login == github.event.issue.user.login && github.event.issue.number || format('{0}-run-{1}', github.event.issue.number, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name != 'issues' }}

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # contents: read only for the checkout of .github/scripts, main's (actor-kind, screened-review-cap). actions: read
    # for the held runs and the Build runs of a head, the held runs of enroll-merged.yml of a merge, and for the daily
    # cap, which reads this workflow's runs and the artifacts that mark them for it.
    permissions: {contents: read, pull-requests: read, issues: read, actions: read}
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      # The pull request or the issue, as route read it from the API.
      pr: ${{ steps.decide.outputs.pr }}
      issue: ${{ steps.decide.outputs.issue }}
      # The pull request's head commit, and its author.
      sha: ${{ steps.decide.outputs.sha }}
      author: ${{ steps.decide.outputs.author }}
      # writer, screen, cap or measure (the trust step below); empty when kind is and no measurement was asked.
      trust: ${{ steps.trust.outputs.trust }}
      # For trust cap: the time the daily cap lets the item run, as 2026-11-09T12:00:00Z (.github/scripts/screened-review-cap).
      free: ${{ steps.trust.outputs.free }}
      # When the trust step decided, which the comment job compares with the time of a hold.
      started: ${{ steps.trust.outputs.started }}
      # true when a run by hand found held runs at the head (the top of this file).
      held: ${{ steps.decide.outputs.held }}
      # true when a run by hand replays the merge of a merged pull request whose run of enroll-merged.yml GitHub holds
      # (the top of this file). Such a run has no kind.
      replay: ${{ steps.decide.outputs.replay }}
      # The Build run whose artifact build-results the gather job reads, for an enrollment that is not held.
      build_run: ${{ steps.decide.outputs.build_run }}
      # true when the triage comment is written (the jobs triage-gather and triage).
      triage: ${{ steps.decide.outputs.triage }}
      # true when the review's action refuses the run, because an App outside ALLOWED_BOTS started it: such a change
      # is an enrollment, and the gather job gives it no kind when take-project takes no project, so nothing reviews
      # or holds it.
      refused: ${{ steps.decide.outputs.refused }}
      # true after a run of .github/workflows/review-approvals.yml: a review of the pull request was submitted or
      # dismissed, and the comment job posts its check run review again with the approvals read now. Such a run has
      # no kind.
      refresh: ${{ steps.decide.outputs.refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: An enrollment, a change or an issue
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          # The account the review's action judges (its GITHUB_ACTOR). For a workflow_run run, the actor of the Build
          # run that started it.
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          # A run by hand runs on the branch it was started on.
          REF: ${{ github.ref }}
          # An issue's own event: who sent it, the issue's author, and how GitHub relates the author to this repository.
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ASSOCIATION: ${{ github.event.issue.author_association }}
          MEASURE: ${{ inputs.measure }}
          # A workflow_run run: the Build or Triage run that completed, as GitHub gives it, and the default branch.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # The account whose action started that run, as GitHub gives it: for a Review approvals run, the one who
          # submitted or dismissed the review.
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          RUN_ACTOR_TYPE: ${{ github.event.workflow_run.triggering_actor.type }}
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          stop() { say "$1"; exit 0; }
          # A run by hand on another branch than main runs nothing (the top of this file).
          if [[ ${EVENT:-} == workflow_dispatch && ${REF:-} != refs/heads/main ]]; then
            stop "Started by hand on ${REF:-no branch}, not on main: nothing runs."
          fi
          # A measurement of the screen, by hand, reviews nothing: no kind, and the trust step routes it alone.
          if [[ ${EVENT:-} == workflow_dispatch && ${MEASURE:-} == true ]]; then
            [[ -z ${PR:-} && -z ${ISSUE:-} ]] \
              || { echo "::error::A measurement of the screen reviews nothing: give no pr or issue."; exit 1; }
            echo "measure=true" >> "$GITHUB_OUTPUT"
            say "measurement of the screen: nothing is built or reviewed; the screen job measures its rules."
            exit 0
          fi
          # An issue's event that is ours (the top of this file) asks for nothing: the issue does not wait for us.
          if [ "${EVENT:-}" = issues ]; then
            if [[ $SENDER != "$AUTHOR" || $ASSOCIATION == OWNER || $ASSOCIATION == MEMBER ]]; then
              say "issue $ISSUE: the event is ours (sent by $SENDER), so nothing runs."
              exit 0
            fi
            # Its own assignment, so that a failed read fails route (set -e) instead of reading as a person.
            who=$(.github/scripts/actor-kind "$ACTOR")
            if [ "$who" != person ]; then
              say "issue $ISSUE: an App sent the event ($ACTOR), so nothing runs."
              exit 0
            fi
          fi
          if [ -n "${ISSUE:-}" ]; then
            # An issue of this repository, not a pull request (GitHub lists both as issues), and never both inputs.
            [[ $ISSUE =~ ^[0-9]+$ && -z ${PR:-} ]] \
              || { echo "::error::Give the number of a pull request or of an issue, not both."; exit 1; }
            [ "$(gh api "repos/$REPO/issues/$ISSUE" --jq '.pull_request == null')" = true ] \
              || { echo "::error::$ISSUE is not an issue of $REPO."; exit 1; }
            { echo "kind=issue"; echo "issue=$ISSUE"; } >> "$GITHUB_OUTPUT"
            say "issue reply: nothing is built; the review drafts the reply, which no job posts (review-issue.md)."
            exit 0
          fi
          # A run after a Build, Triage or Review approvals run: only a run of one of the three files, on its own event,
          # that ended so that its pull request is reviewed, triaged or refreshed. Its pull request is the open one
          # into the default branch from the run's head repository and branch, at the run's head commit, as
          # enroll-dispatch's pull_of_head finds it: a fork's pull request is not in the event.
          if [ "${EVENT:-}" = workflow_run ]; then
            [[ ${RUN_ID:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::The event names no run that completed."; exit 1; }
            if [ "${RUN_PATH:-}" = .github/workflows/review-approvals.yml ]; then
              [ "${RUN_EVENT:-}" = pull_request_review ] \
                || stop "Run $RUN_ID ran on ${RUN_EVENT:-no event}, not on pull_request_review: nothing runs."
              [ "${RUN_CONCLUSION:-}" = success ] \
                || stop "Review approvals run $RUN_ID ended ${RUN_CONCLUSION:-with no conclusion}, not success: nothing runs."
              # Only a review that can change a person's approval (.github/scripts/approval.py) refreshes, so that no
              # other account's review starts a job that reads the App's key: one by a User with write access, or by
              # an App (an account of type Bot, which can review or dismiss here only through its installation on this
              # repository). Every dismissal is made by one of the two. The event does not say whether the review was
              # a dismissal, and the run's own text would come from the pull request's copy of review-approvals.yml.
              case ${RUN_ACTOR_TYPE:-} in
                Bot) ;;
                User)
                  [[ ${RUN_ACTOR:-} =~ ^[A-Za-z0-9-]+$ ]] || stop "Review approvals run $RUN_ID names no account: nothing runs."
                  permission=$(gh api "repos/$REPO/collaborators/$RUN_ACTOR/permission" --jq .permission) || permission=""
                  [[ $permission == admin || $permission == write ]] \
                    || stop "Review approvals run $RUN_ID: $RUN_ACTOR has ${permission:-no readable} access, not write, so their review changes no approval: nothing runs." ;;
                *) stop "Review approvals run $RUN_ID was started by ${RUN_ACTOR_TYPE:-no} account type, neither a User nor an App: nothing runs." ;;
              esac
            else
              [ "${RUN_EVENT:-}" = pull_request ] || stop "Run $RUN_ID ran on ${RUN_EVENT:-no event}, not on pull_request: nothing runs."
            fi
            case ${RUN_PATH:-} in
              .github/workflows/build.yaml)
                [[ ${RUN_CONCLUSION:-} == success || ${RUN_CONCLUSION:-} == failure ]] \
                  || stop "Build run $RUN_ID ended ${RUN_CONCLUSION:-with no conclusion}, not success or failure: nothing runs." ;;
              .github/workflows/triage.yaml)
                [ "${RUN_CONCLUSION:-}" = success ] \
                  || stop "Triage run $RUN_ID ended ${RUN_CONCLUSION:-with no conclusion}, not success: nothing runs." ;;
              .github/workflows/review-approvals.yml) ;;
              *) stop "Run $RUN_ID is a run of neither .github/workflows/build.yaml, .github/workflows/triage.yaml nor .github/workflows/review-approvals.yml: nothing runs." ;;
            esac
            [[ ${DEFAULT_BRANCH:-} =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::The event names no default branch."; exit 1; }
            gone="No open pull request into $DEFAULT_BRANCH is at the head commit of run $RUN_ID, from its repository and branch: the head moved, or the pull request is closed: the run of the new head reviews it."
            # A deleted fork gives no head repository.
            [[ ${RUN_HEAD_SHA:-} =~ ^[0-9a-f]{40}$ && ${RUN_HEAD_REPOSITORY:-} =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
              && -n ${RUN_HEAD_BRANCH:-} ]] || stop "$gone"
            of="${RUN_HEAD_REPOSITORY%%/*}:$(jq -rn --arg b "$RUN_HEAD_BRANCH" '$b | @uri')"
            PR=$(gh api "repos/$REPO/pulls?state=open&base=$(jq -rn --arg b "$DEFAULT_BRANCH" '$b | @uri')&head=$of&per_page=100" \
              | jq -r --arg repo "$REPO" --arg base "$DEFAULT_BRANCH" --arg sha "$RUN_HEAD_SHA" \
                  --arg from "$RUN_HEAD_REPOSITORY" --arg ref "$RUN_HEAD_BRANCH" \
                  'first(.[] | select(.state == "open" and .base.ref == $base and .base.repo.full_name == $repo
                    and .head.sha == $sha and .head.repo.full_name == $from and .head.ref == $ref) | .number) // empty')
            [[ $PR =~ ^[1-9][0-9]*$ ]] || stop "$gone"
          fi
          [[ ${PR:-} =~ ^[0-9]+$ ]] || { echo "::error::Give the number of a pull request or of an issue."; exit 1; }
          pull=$(gh api "repos/$REPO/pulls/$PR")
          # The head that the Build or Triage run ran on, or for a run by hand the head the API gives now.
          sha=$(jq -r .head.sha <<< "$pull")
          [ "${EVENT:-}" != workflow_run ] || sha=$RUN_HEAD_SHA
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not read the pull request's head commit."; exit 1; }
          opener=$(jq -r '.user.login // ""' <<< "$pull")
          from=$(jq -r '.head.repo.full_name // ""' <<< "$pull") ref=$(jq -r '.head.ref // ""' <<< "$pull")
          # No path reviews a closed pull request. A run by hand replays the merge of one merged into the default
          # branch when GitHub holds a run of enroll-merged.yml at its head commit or its merge commit, from its head
          # repository and branch (the table at the top of this file), and asks for nothing else.
          if [ "$(jq -r '.state // ""' <<< "$pull")" != open ]; then
            [ "${EVENT:-}" != workflow_run ] || stop "$gone"
            [ "$(jq -r '.merged == true and .base.ref == .base.repo.default_branch' <<< "$pull")" = true ] \
              || stop "Pull request $PR is closed, and not merged into the default branch: nothing runs."
            merge=$(jq -r '.merge_commit_sha // ""' <<< "$pull") replay=""
            for commit in "$sha" "$merge"; do
              [[ $commit =~ ^[0-9a-f]{40}$ && -z $replay ]] || continue
              # id, file, event, status, conclusion, head commit, head repository and head branch, split at U+001F.
              # GitHub lists a held run with the status completed and the conclusion action_required. The API's
              # filter status=action_required gives the runs with that conclusion.
              runs=$(gh api --paginate \
                "repos/$REPO/actions/workflows/enroll-merged.yml/runs?event=pull_request&status=action_required&head_sha=$commit&per_page=100" \
                --jq '.workflow_runs[] | [(.id | tostring), .path // "", .event // "", .status // "",
                                          .conclusion // "", .head_sha // "", .head_repository.full_name // "",
                                          .head_branch // ""] | join("\u001f")')
              while IFS=$'\x1f' read -r id path event status conclusion head repository branch; do
                if [[ ${id:-} =~ ^[0-9]+$ && $path == .github/workflows/enroll-merged.yml && $event == pull_request
                      && $status == completed && $conclusion == action_required && $head == "$commit" && -n $from
                      && $repository == "$from" && $branch == "$ref" ]]; then
                  replay="GitHub holds run $id of enroll-merged.yml at $commit"
                  break
                fi
              done <<< "$runs"
            done
            [ -n "$replay" ] \
              || stop "Pull request $PR is merged, and GitHub holds no run of enroll-merged.yml at its head commit or its merge commit from its head repository and branch: nothing runs."
            { echo "pr=$PR"; echo "sha=$sha"; echo "author=$opener"; echo "replay=true"; } >> "$GITHUB_OUTPUT"
            stop "merge replay: pull request $PR is merged, and $replay. The comment job replays the merge with the App's token, so that Enroll dispatch runs on its completion. Nothing is reviewed."
          fi
          # After a review of it was submitted or dismissed: the comment job's refresh alone, at the run's head.
          if [ "${EVENT:-}" = workflow_run ] && [ "$RUN_PATH" = .github/workflows/review-approvals.yml ]; then
            { echo "pr=$PR"; echo "sha=$sha"; echo "author=$opener"; echo "refresh=true"; } >> "$GITHUB_OUTPUT"
            stop "refresh: a review of pull request $PR was submitted or dismissed. The comment job posts the check run review of $sha again from its newest record, with the approvals read now. Nothing is reviewed."
          fi
          # Every path, a renamed file under both names. Over the 3000 files the API lists, the list decides nothing.
          paths=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          projects=false
          if grep -q '^projects/' <<< "$paths"; then projects=true; fi
          # The kind by build.yaml's rule, with the refusal of the review's action: enrollment or change.
          decide() {
            kind=enrollment
            message="enrollment review: it takes the pull request's project, if it has one (.github/scripts/take-project)."
            # The action refuses a run that an App outside ALLOWED_BOTS started, whatever the pull request changes
            # (route's refused, which the gather job reads when take-project takes no project). Its own assignment, so
            # that a failed read fails route (set -e).
            who=$(.github/scripts/actor-kind "$ACTOR")
            [ "$who" != refused ] || refused=true
            # A change only into the default branch: take-project refuses a pull request into any other. A refused
            # App's change is an enrollment, as before.
            if [ -n "$paths" ] && [ "$projects" = false ] && (( $(jq .changed_files <<< "$pull") <= 3000 )) \
                && [ "$(jq -r .base.ref <<< "$pull")" = "$(jq -r .base.repo.default_branch <<< "$pull")" ] \
                && [ "$refused" != true ]; then
              kind=change
              message="change review: the pull request changes no file under projects/ (review-change.md)."
            fi
          }
          kind="" build_run="" held=false triage=false refused=false
          if [ "${EVENT:-}" = workflow_run ]; then
            if [ "$RUN_PATH" = .github/workflows/triage.yaml ]; then
              [ "$projects" = true ] || stop "Nothing runs: pull request $PR touches nothing under projects/, so it gets no triage comment."
              triage=true
              message="triage comment: pull request $PR touches projects/."
            else
              decide
              if [ "$kind" = enrollment ]; then
                build_run=$RUN_ID
                message+=" The review reads the results of Build run $build_run."
              fi
            fi
          else
            # A run by hand: GitHub holds the runs of this head (status action_required) when they are of a first-time
            # contributor's pull request. A held run of .github/workflows/maintainer-confirmed.yml whose actor is
            # oss-verify[bot] does not make the head held: the oss-verify App put on the label that started it, and that
            # label is no new event at the head. Held runs (.github/workflows/held-runs.yml) has the same rule. Keep the
            # two rules equal. id, file, head commit, head repository, head branch and the actor's login, split at
            # U+001F.
            held_runs=$(gh api --paginate \
              "repos/$REPO/actions/runs?event=pull_request&status=action_required&head_sha=$sha&per_page=100" \
              --jq '.workflow_runs[] | [(.id | tostring), .path // "", .head_sha // "", .head_repository.full_name // "",
                                        .head_branch // "", .actor.login // ""] | join("\u001f")')
            while IFS=$'\x1f' read -r id path head repository branch login; do
              if [[ $path == .github/workflows/maintainer-confirmed.yml && $login == "oss-verify[bot]" ]]; then continue; fi
              if [[ -n ${id:-} && $head == "$sha" && -n $from && $repository == "$from" && $branch == "$ref" ]]; then
                held=true
              fi
            done <<< "$held_runs"
            if [ "$held" = true ]; then
              # From the paths alone, whoever started the run: the review job does not run on this path.
              kind=change
              [ "$projects" = false ] || kind=enrollment
              message="held head: GitHub holds runs of $sha. The gather job reads the pull request, the screen reads it, and a clean verdict approves the held runs."
            elif [ "$ACTOR" = 'github-actions[bot]' ]; then
              stop "Held runs started this run for a held head, and the head is no longer held."
            else
              decide
              if [ "$kind" = enrollment ]; then
                # The newest completed Build run of this head, from its repository and branch, that wrote its results.
                runs=$(gh api --paginate \
                  "repos/$REPO/actions/workflows/build.yaml/runs?event=pull_request&status=completed&head_sha=$sha&per_page=100" \
                  --jq '.workflow_runs[] | [(.id | tostring), .path // "", .event // "", .status // "", .head_sha // "",
                                            .head_repository.full_name // "", .head_branch // ""] | join("\u001f")')
                while IFS=$'\x1f' read -r id path event status head repository branch; do
                  [[ ${id:-} =~ ^[0-9]+$ && $path == .github/workflows/build.yaml && $event == pull_request
                    && $status == completed && $head == "$sha" && -n $from && $repository == "$from"
                    && $branch == "$ref" ]] || continue
                  artifacts=$(gh api --paginate "repos/$REPO/actions/runs/$id/artifacts?name=build-results&per_page=100" \
                    --jq '.artifacts[] | select(.name == "build-results" and .expired != true) | .id')
                  if [ "$(grep -c . <<< "$artifacts")" = 1 ]; then build_run=$id; break; fi
                done < <(sort -t $'\x1f' -k1,1nr <<< "$runs")
                if [ -n "$build_run" ]; then
                  message+=" The review reads the results of Build run $build_run."
                else
                  kind=""
                  message="No Build run of this head wrote results: a push, or a close and a reopen, builds it."
                fi
              fi
            fi
            # A person's run by hand writes the triage comment too, whatever the review does. Held runs' runs do not.
            if [ "$ACTOR" != 'github-actions[bot]' ] && [ "$projects" = true ]; then triage=true; fi
          fi
          {
            echo "pr=$PR"
            echo "sha=$sha"
            echo "author=$opener"
            if [ -n "$kind" ]; then echo "kind=$kind"; fi
            if [ "$held" = true ]; then echo "held=true"; fi
            if [ -n "$build_run" ]; then echo "build_run=$build_run"; fi
            if [ "$triage" = true ]; then echo "triage=true"; fi
            if [ "$refused" = true ]; then echo "refused=true"; fi
          } >> "$GITHUB_OUTPUT"
          say "$message"
          if [ "$triage" = true ] && [ "${EVENT:-}" != workflow_run ]; then
            say "triage comment: the pull request touches projects/."
          fi

      # Whether the review may run on its own, or the screen reads the pull request or the issue first (the top of
      # this file). Write access is what GitHub's collaborator permission API answers: admin or write (maintain is
      # write). Membership of the organisation alone is not write access. The Apps in WRITER_BOTS count as having it.
      - name: Whether the author and the account that started the run have write access
        id: trust
        if: steps.decide.outputs.kind != '' || steps.decide.outputs.measure == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # The pull request's author as the decide step read it from the API, or the issue's from its event.
          AUTHOR: ${{ steps.decide.outputs.author || github.event.issue.user.login }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          MEASURE: ${{ steps.decide.outputs.measure }}
          NUMBER: ${{ inputs.pr || inputs.issue }}
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          # trusted
          # trusted <login>: 0 when <login> is one of the WRITER_BOTS, or an account that GitHub's collaborator
          # permission API gives admin or write; 1 when it is neither; 2 when the API could not say.
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$WRITER_BOTS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
            [[ $permission == admin || $permission == write ]]
          }
          # end of trusted
          # known <login>: trusted's answer, 0 or 1; the run stops when GitHub could not say.
          known() {
            local rc=0
            trusted "$1" || rc=$?
            (( rc != 2 )) || { echo "::error::GitHub did not say whether $1 has write access. Re-run this run."; exit 1; }
            return "$rc"
          }
          free=""
          trust() {
            { echo "trust=$1"; echo "free=$free"; echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"
            say "$2"
            exit 0
          }
          [[ $RUN_ID =~ ^[0-9]+$ ]] || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          case $EVENT in
            # The daily cap charges the run to the account that opened, pushed, edited or reopened the item: for a
            # workflow_run run, the actor of the Build run that started it.
            workflow_run|issues) charged=$ACTOR by="Started by $ACTOR" ;;
            # GitHub lets only an account with write access start a run by hand; an App must be one of ALLOWED_BOTS.
            # Such a run is trusted as the item's author, as an event's run is: it is screened unless the author has
            # write access, and the daily cap charges it to the author, so a person's re-runs never use up their own
            # share. The decide step read a pull request's author already. For an issue (-f issue), the author comes
            # from the API here.
            workflow_dispatch)
              if [ "$MEASURE" = true ]; then
                if [[ $ACTOR == *'[bot]' ]] && ! known "$ACTOR"; then
                  say "No measurement: the App that started this run ($ACTOR) is not one of ALLOWED_BOTS."
                  exit 0
                fi
                trust measure "A measurement of the screen, started by hand by $ACTOR: the screen job alone runs."
              fi
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              if [ -z "$AUTHOR" ]; then
                AUTHOR=$(gh api "repos/$REPO/issues/$NUMBER" --jq '.user.login // ""') \
                  || { echo "::error::GitHub did not say who wrote $NUMBER. Re-run this run."; exit 1; }
              fi
              charged=$AUTHOR by="Started by hand by $ACTOR" ;;
            *) echo "::error::not an event of this workflow: $EVENT"; exit 1 ;;
          esac
          author=0 actor=0
          known "$AUTHOR" || author=$?
          known "$ACTOR" || actor=$?
          (( author != 0 || actor != 0 )) || trust writer "$by; the author, $AUTHOR, and $ACTOR have write access: no screen."
          # The daily cap, before the screen (.github/scripts/screened-review-cap). Its failure fails route.
          cap=$(ACCOUNT=$charged .github/scripts/screened-review-cap) || { printf '%s\n' "$cap"; exit 1; }
          count=$(sed -n 's/^count=//p' <<< "$cap") account_count=$(sed -n 's/^account_count=//p' <<< "$cap")
          if [ "$(sed -n 's/^capped=//p' <<< "$cap")" = true ]; then
            free=$(sed -n 's/^free=//p' <<< "$cap")
            [[ $free =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              || { echo "::error::The daily cap gave no time it frees. Re-run this run."; exit 1; }
            trust cap "Held without a screen or a review: the daily cap is reached, $count of $REVIEW_CAP runs of accounts without write access in 24 hours, $account_count of $REVIEW_CAP_AUTHOR charged to $charged. The cap lets it run from $free."
          fi
          echo "$RUN_ID" > "$RUNNER_TEMP/daily-cap"
          trust screen "$by; the author, $AUTHOR, or $ACTOR has no write access: screened first. The daily cap counts $count of $REVIEW_CAP runs in 24 hours, $account_count of $REVIEW_CAP_AUTHOR charged to $charged."

      # The daily cap counts a run from the moment route lets it be screened (.github/scripts/screened-review-cap), so
      # that a burst of items is counted before their screens start. This artifact says that route gave this run trust
      # screen. The screen job keeps daily-cap-screen after its sign-ins.
      - name: Mark this run for the daily cap
        if: steps.trust.outputs.trust == 'screen'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        with: {name: daily-cap-route, path: "${{ runner.temp }}/daily-cap", if-no-files-found: error, retention-days: 2, overwrite: true}

  gather:
    # What the review reads, gathered once, for the screen and the review: .github/scripts/review-gather's .review/,
    # projects/<name>/ as take-project takes it for an enrollment, and the last review's session that the review
    # resumes. It holds no model, no identity token and no write permission, and runs no code of the pull request or
    # the project. It keeps them as one tar file, the artifact review-data, for a day, and gives its SHA-256 as its
    # output `digest`: the screen job and the review job each take the file only by that digest
    # (.github/scripts/take-review-data), so the review reads exactly what the screen passed. One tar file, so that no
    # file name of the pull request can stop the upload. It runs for every review (the review job's condition, in
    # route's kind), whoever wrote the pull request or the issue, except for one that route held at the daily cap
    # (route gives it neither trust writer nor screen, and this condition names it). An enrollment needs a Build run
    # whose results it reads (route's build_run), or a held head, which has none. Never after a failed route: its
    # trust step can have given trust screen before the step that keeps the daily cap's mark failed, and an item
    # gathered then would be screened and reviewed with no count of the cap to see it.
    needs: route
    if: >-
      ${{ !cancelled() && needs.route.result == 'success'
      && ((needs.route.outputs.kind == 'enrollment'
           && (needs.route.outputs.build_run != '' || needs.route.outputs.held == 'true'))
          || needs.route.outputs.kind == 'change' || needs.route.outputs.kind == 'issue')
      && needs.route.outputs.trust != 'cap'
      && (needs.route.outputs.trust == 'writer' || needs.route.outputs.trust == 'screen') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Restores the last review's session and never saves one: the job reads the pull request, and the session job
    # saves (the top of this file).
    cache-mode: read
    # actions: read for the Build run's artifact build-results.
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read, actions: read}
    env:
      KIND: ${{ needs.route.outputs.kind }}
      TRUST: ${{ needs.route.outputs.trust }}
      # true when route found held runs at the head: a run by hand that only screens, and approves on a clean verdict.
      HELD_RUNS: ${{ needs.route.outputs.held }}
      # true when the review's action refuses the App that started the run (route's refused).
      REFUSED: ${{ needs.route.outputs.refused }}
      PR: ${{ needs.route.outputs.pr }}
      ISSUE: ${{ needs.route.outputs.issue }}
      HEAD_SHA: ${{ needs.route.outputs.sha }}
      # A change review's session, by pull request; the last `-` keeps one pull request's key from being the start of
      # another's (pull request 1 and pull request 10), which restore-keys would match.
      CHANGE_KEY: review-${{ needs.route.outputs.pr }}-
    outputs:
      digest: ${{ steps.keep.outputs.digest }}
      # true when the screen reads the item first: route's trust is screen, or the review would read text of an
      # account without write access (the step below).
      screen: ${{ steps.outside.outputs.screen }}
      # The logins of the comments' and reviews' authors that have write access, which the screen does not read:
      # their text is this project's own (the step below).
      writers: ${{ steps.outside.outputs.writers }}
      # The ids of the comments the step below confirmed are this App's own, by the account type the REST API
      # gives for each: gh names an App without its [bot], and a user can take that name.
      app_comments: ${{ steps.outside.outputs.app_comments }}
      # The node ids of the reviews the step below confirmed are an App's of WRITER_BOTS, by the login the REST API
      # gives each review (review-gather's review-authors.txt): gh's reviews in pr.json name an App without its
      # [bot], and give no address by which to ask.
      app_reviews: ${{ steps.outside.outputs.app_reviews }}
      # The session to resume and the commit it reviewed, from review-gather (empty for a fresh review), for every
      # item, screened or not. Only the review job takes the session from the file this job keeps; the screen job
      # takes none (.github/scripts/take-review-data), and reads the new text first.
      session: ${{ steps.gather.outputs.session }}
      last: ${{ steps.gather.outputs.last }}
      # The project that take-project took. Its step gives it at once, so that it is set when a later step fails. It is
      # empty for a change, an issue, and an enrollment whose project take-project did not take.
      name: ${{ steps.project.outputs.name }}
      # For an enrollment whose project take-project took: how many files the pull request changes outside
      # projects/<name>/ (take-project's outside), which the review judges by review-change.md too, and which the
      # comment job's check run review reads. 0 for a fork's enrollment.
      outside: ${{ steps.project.outputs.outside }}
      # The kind this job gathered (its project step): route's, or change when take-project took no project. Every
      # later job reads it in place of route's, when it is set.
      kind: ${{ steps.project.outputs.kind }}
      # The report of the fuzz targets' checks from the Build run's results, for the review comment.
      checks: ${{ steps.build.outputs.checks }}
      # The binaries' sizes from the Build run's results (take-build-results), for the record of the review that the
      # comment job writes. It is empty when the step build did not run or read no sizes.
      sizes: ${{ steps.build.outputs.sizes }}
      # The repository's criticality score and whether it is in OSS-Fuzz, as review-gather gives them from the triage,
      # for the same record. Each is empty when the step gather did not run.
      criticality_score: ${{ steps.gather.outputs.criticality_score }}
      oss_fuzz: ${{ steps.gather.outputs.oss_fuzz }}
    steps:
      # A push after the Build run that started this run: the head is no longer the one route read, and the push
      # started a run of its own, which reviews the new head. This job then keeps nothing. A read that fails decides
      # nothing here: the steps below read the pull request again.
      - name: The pull request is still at the head that route read
        id: start
        if: env.KIND != 'issue'
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}"}
        run: |
          set -uo pipefail
          now=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha 2> /dev/null) || now=""
          if [[ $now =~ ^[0-9a-f]{40}$ && $now != "$HEAD_SHA" ]]; then
            echo "The pull request's head is now $now, not $HEAD_SHA, the head that route read: nothing is kept, and the run of the new head reviews it."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
      # main, never the pull request: take-project reads this HEAD as the base branch's head.
      - if: steps.start.outputs.moved != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, fetch-depth: 0}
      # The kind this job gathers, its output kind, which every later job reads in place of route's: route's, or change
      # when take-project took no project (the top of this file). For an enrollment it takes projects/<name>/ as the
      # build does. When take-project refuses the pull request on a head that is not held, this job fails, as the build
      # does. When it takes no project, a held head or not (a pull request that changes several projects or only removes
      # one, a fork's too, say), the pull request is gathered and reviewed as a change: the screen reads each changed
      # file, the review checks review-change.md, and the check run review is posted from that review, as for any
      # change. A change that an App outside ALLOWED_BOTS opened (route's refused, Copilot's say) is the exception:
      # the review's action refuses its run, so nothing is gathered, reviewed or held, as on main before the check run
      # review.
      - name: Take projects/<name>/ from the pull request, as the build did
        id: project
        if: steps.start.outputs.moved != 'true'
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}"}
        run: |
          set -uo pipefail
          if [ "$KIND" != enrollment ]; then echo "kind=$KIND" >> "$GITHUB_OUTPUT"; exit 0; fi
          taken=$RUNNER_TEMP/take-project
          : > "$taken"
          code=0
          GITHUB_OUTPUT=$taken GITHUB_STEP_SUMMARY=/dev/null .github/scripts/take-project build || code=$?
          name=$(sed -n 's/^name=//p' "$taken")
          if [ "$HELD_RUNS" = true ]; then
            if (( code != 0 )) || [ -z "$name" ]; then
              echo "take-project took no project (exit status $code, its log above): this held head is gathered as a change, and the screen reads each changed file."
              echo "kind=change" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif (( code != 0 )); then
            exit "$code"
          elif [ -z "$name" ] && [ "${REFUSED:-}" = true ]; then
            echo "take-project took no project, and the review's action refuses the App that started the run: nothing is gathered, and nothing reviews or holds the pull request."
            exit 0
          elif [ -z "$name" ]; then
            echo "take-project took no project (its log above): the pull request is gathered and reviewed as a change."
            echo "kind=change" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          outside=$(sed -n 's/^outside=//p' "$taken")
          [[ $outside =~ ^[0-9]+$ ]] || { echo "::error::take-project gave no count of the files outside projects/$name/."; exit 1; }
          { echo "name=$name"; echo "kind=enrollment"; echo "outside=$outside"; } >> "$GITHUB_OUTPUT"
      - name: Restore the last review's session and the head it reviewed
        if: steps.project.outputs.kind == 'enrollment'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (sha-pinned)
        env: {SESSION_KEY: "enroll-review/${{ needs.route.outputs.pr }}/${{ steps.project.outputs.name }}/"}
        with: {path: "~/.claude/projects\n~/.claude/ossv-last-review", key: "${{ env.SESSION_KEY }}${{ github.run_id }}-${{ github.run_attempt }}", restore-keys: "${{ env.SESSION_KEY }}"}
      # A change review resumes its last session for context only: review-gather takes the head that session reviewed
      # from the review comment, never from this cache. The session job writes this cache in main's scope with what the
      # review job kept, and the model of that job read the text of the pull request, an outside one too.
      - name: Restore the last change review's session
        if: steps.project.outputs.kind == 'change'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (sha-pinned)
        with: {path: "~/.claude/projects\n~/.claude/ossv-last-review", key: "${{ env.CHANGE_KEY }}${{ github.run_id }}-${{ github.run_attempt }}", restore-keys: "${{ env.CHANGE_KEY }}"}
      # The Build run's results, as data (.github/scripts/take-build-results, and the top of this file), for an
      # enrollment whose Build run route found. A held head has none. When it reads nothing, the review gets its
      # fixed line in place of the results.
      - name: Take the results of the Build run
        id: build
        if: >-
          steps.project.outputs.kind == 'enrollment' && steps.project.outputs.name != ''
          && needs.route.outputs.build_run != '' && needs.route.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_RUN: ${{ needs.route.outputs.build_run }}
          NAME: ${{ steps.project.outputs.name }}
        run: .github/scripts/take-build-results
      # For an enrollment whose build resolved a commit, review-gather fetches the project's repository at that commit
      # as data (.review/source/), whoever wrote the pull request, and fails when the fetch fails: then this job fails,
      # nothing is kept, and a re-run of the failed jobs fetches again. With no built commit there is no source to read,
      # and .review/source.txt says so.
      - name: Gather what the review reads, and the diff since the last review
        id: gather
        if: steps.project.outputs.kind != ''
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ steps.project.outputs.kind }}
          NAME: ${{ steps.project.outputs.name }}
          OUTSIDE: ${{ steps.project.outputs.outside }}
          COMMIT: ${{ steps.build.outputs.commit }}
          BUILD: ${{ steps.build.outputs.build }}
          BINARIES: ${{ steps.build.outputs.binaries }}
          CHECKS: ${{ steps.build.outputs.checks }}
        run: |
          if [ "$KIND" = enrollment ]; then
            dpkg -s python3-yaml unzip > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml unzip; }
          fi
          LAST_REVIEW=~/.claude/ossv-last-review .github/scripts/review-gather .review || {
            echo "::error::review-gather failed (its log above), so nothing is kept for the screen or the review. A re-run of this run's failed jobs gathers again."
            exit 1
          }
      # The files of projects/<name>/ and of head/ are HEAD_SHA's, and pr.json and pr.diff are what GitHub gave when
      # they were read: the head the pull request had then. When the head moved in between, the diff that the screen
      # reads may not hold every line of the files that the review reads. HEAD_SHA must be the head that pr.json names,
      # read before the diff, and the head GitHub gives after it. When either names another head, this job keeps
      # nothing (its output digest is empty), so no screen, review or hold runs: the push started a run of its own,
      # which reviews the new head. A head that cannot be read fails the job for a screened item, which is held; for
      # a writer's, a read that failed decides nothing, as before: review-gather left the error in the file.
      - name: The pull request's head did not move while it was read
        id: head
        if: steps.project.outputs.kind != '' && env.KIND != 'issue'
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}"}
        run: |
          set -uo pipefail
          # pr.json's last line is the exit status that review-gather's keep() wrote.
          read=$(sed '$d' .review/pr.json | jq -r '.headRefOid // empty' 2> /dev/null) || read=""
          now=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha 2> /dev/null) || now=""
          for head in "$read" "$now"; do
            if [[ -n $head && $head != "$HEAD_SHA" ]]; then
              echo "The pull request's head moved while it was read (read: ${read:-unknown}, now: ${now:-unknown}, gathered: $HEAD_SHA): nothing is kept, and the run of the new head reviews it."
              echo "moved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -z $head && $TRUST == screen ]]; then
              echo "::error::The pull request's head could not be read (read: ${read:-unknown}, now: ${now:-unknown}), so it is not screened."
              exit 1
            fi
          done
          echo "The pull request's head is $HEAD_SHA, before and after the reads."
      # A pull request or an issue can hold the text of several accounts: its comments, its reviews and its review
      # comments, which anyone can write and the review reads. This step asks GitHub which of their accounts have
      # write access, for two decisions. A writer's item whose text is all writers' is not screened at all; one
      # that holds text of another account is screened for those texts (SCREEN_SCOPE comments). And whatever the
      # trust, the screen reads none of the writers' own comments and reviews: they are this project's, not the
      # outside text the screen is for (its output writers, and .github/scripts/screen.py). Their review comments
      # are the exception: one outside author makes review-comments.txt read whole, writers' review comments in it,
      # because a review comment's body can hold newlines and no line of that file can be given back to its author
      # (all_review_comments_are_ours). The accounts come from the files the
      # review reads. A run started by hand is screened as an event's run is: route gives it trust writer only when
      # the item's author and the person who started it both have write access, and then this step still has the
      # screen read the text of any other account.
      - name: Whether the review reads text of an account without write access
        id: outside
        if: steps.head.outputs.moved != 'true' && steps.project.outputs.kind != ''
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}"}
        run: |
          set -uo pipefail
          # trusted
          # trusted <login>: 0 when <login> is one of the WRITER_BOTS, or an account that GitHub's collaborator
          # permission API gives admin or write; 1 when it is neither; 2 when the API could not say.
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$WRITER_BOTS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
            [[ $permission == admin || $permission == write ]]
          }
          # end of trusted
          # writer <login> <url>: whether trusted says 0. gh's pull request and issue JSON names an App without its
          # [bot]: such a name, of one of the WRITER_BOTS, is that App when the comment at <url> is, by the REST API,
          # a Bot's of that name with [bot]. An account's type never changes, so no user named so, or renamed so, is
          # taken for the App.
          writer() {
            local rc=0 id
            trusted "$1" || rc=$?
            (( rc != 0 )) || return 0
            [[ ,$WRITER_BOTS, == *",$1[bot],"* && $2 =~ \#issuecomment-([0-9]+)$ ]] || return 1
            id=${BASH_REMATCH[1]}
            [ "$(gh api "repos/$REPO/issues/comments/$id" --jq '"\(.user.login) \(.user.type)"' 2> /dev/null)" = "$1[bot] Bot" ]
          }
          screen=true writers="" app="" app_reviews=""
          item=.review/pr.json
          [ -f "$item" ] || item=.review/issue.json
          # keep()'s last line is the exit status; an account GitHub no longer names is "-". A read that cannot be
          # parsed, or a pull request with no list of its review comments' authors, names no writer, and leaves
          # screen true: then the screen reads every comment, as it did before any of them was told apart.
          # A review's line carries its node id, which review-gather's review-authors.txt maps to the login the REST
          # API gives its author, with an App's [bot]. The fields are split at U+001F, which read does not merge as
          # it merges two tabs, so an empty url keeps its place.
          if accounts=$(sed '$d' "$item" | jq -r '((.comments // [])[] | [(.author.login // ""), (.url // ""), ""]),
              ((.reviews // [])[] | [(.author.login // ""), "", (.id // "")])
              | (if .[0] == "" then "-" else .[0] end) + "\u001f" + .[1] + "\u001f" + .[2]' 2> /dev/null) \
              && { [ "$item" = .review/issue.json ] || [ -f .review/review-comment-authors.txt ]; }; then
            if [ -f .review/review-comment-authors.txt ]; then
              accounts+=$'\n'$(sed '$d' .review/review-comment-authors.txt | sed 's/^$/-/')
            fi
            outside=0
            # review-authors.txt, when its read passed: each review's node id and its author's login, by the REST API.
            rest=""
            authors=.review/review-authors.txt
            if [ -f "$authors" ] && [ "$(tail -n 1 "$authors")" = "(exit status 0)" ]; then
              rest=$(sed '$d' "$authors")
            fi
            while IFS=$'\x1f' read -r login url id; do
              [ -n "$login$url$id" ] || continue
              rc=0
              trusted "${login:--}" || rc=$?
              if (( rc == 0 )); then
                # A login the collaborator API placed, or an App under the name the REST API gives it, with
                # its [bot]: no other account can hold that name.
                [[ ,$writers, == *",$login,"* ]] || writers+=",$login"
              elif writer "${login:--}" "${url:-}" && [[ $url =~ \#issuecomment-([0-9]+)$ ]]; then
                # gh names an App without its [bot], and a user can take that name: this comment alone is the
                # App's, by the account type the REST API gives for it, so the screen is told its id, not a
                # name.
                app+=",${BASH_REMATCH[1]}"
              elif [[ ${id:-} =~ ^[A-Za-z0-9_-]+$ ]] \
                  && by=$(awk -v id="$id" '$1 == id { print $2; exit }' <<< "$rest") && [[ $by == *'[bot]' ]] \
                  && trusted "$by"; then
                # A review an App of WRITER_BOTS wrote, by the REST API's login of this very review: no other
                # account can hold a login with [bot], so the screen is told the review's node id.
                app_reviews+=",$id"
              else
                outside=1
              fi
            done < <(sort -u <<< "$accounts")
            if [ "$TRUST" = writer ]; then
              if (( outside )); then
                echo "The review reads text of an account without write access, or one GitHub cannot name: the screen reads it first."
              else
                screen=false
              fi
            fi
          fi
          {
            echo "screen=$screen"
            echo "writers=${writers#,}"
            echo "app_comments=${app#,}"
            echo "app_reviews=${app_reviews#,}"
          } >> "$GITHUB_OUTPUT"
      # The session goes with every item, screened or not: the review job takes it, and the screen job does not
      # (.github/scripts/take-review-data).
      - name: Keep it for the screen and the review
        id: keep
        if: steps.head.outputs.moved != 'true' && steps.project.outputs.kind != ''
        env:
          NAME: ${{ steps.project.outputs.name }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/review-data"
          tar=$RUNNER_TEMP/review-data/review.tar
          members=(.review)
          if [ -n "$NAME" ] && [ -d "projects/$NAME" ]; then members+=("projects/$NAME"); fi
          tar -cf "$tar" "${members[@]}"
          session=()
          for path in .claude/projects .claude/ossv-last-review; do
            if [ -e "$HOME/$path" ]; then session+=("$path"); fi
          done
          if (( ${#session[@]} )); then tar -rf "$tar" -C "$HOME" "${session[@]}"; fi
          digest=$(sha256sum "$tar" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Kept ${members[*]} ${session[*]} as review.tar, SHA-256 $digest."
      - if: steps.head.outputs.moved != 'true' && steps.project.outputs.kind != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        with: {name: review-data, path: "${{ runner.temp }}/review-data/review.tar", if-no-files-found: error, retention-days: 1, overwrite: true}

  screen:
    # The screen of a pull request or an issue whose author, or the account that started the run, has no write access
    # (route's trust: screen), or whose comments, reviews or review comments the review reads include one of such an
    # account (the gather job's output screen; the top of this file, and .github/scripts/screen.py). It runs in the
    # environment review-screen, whose jobs alone can exchange their identity token for the screen's tokens: Google
    # Cloud (Model Armor, and adding the reason to its bucket), Azure (Prompt Shields) and Anthropic (the service
    # account review-screen; the review reaches Claude through the model gateway instead). It reaches neither ossv-ci
    # nor the App's key, whose Google bindings name other environments. No other job, the review's included, gets the
    # screen's tokens.
    # Its GitHub token can only read, no key is stored, and it runs only main's .github/scripts. Its outputs are the
    # verdict, clean or held, and the names of the checks that ran; why goes to the private bucket REASON_BUCKET,
    # never to this public log or an output.
    # A screen that cannot sign in or cannot get a model token (GitHub's identity token, Microsoft Entra's token,
    # Anthropic's token exchange) fails this job and gives no verdict. The comment job then records the hold as for a
    # screen that failed, and Held runs starts the screen of a held head again, at most once an hour. The step "Sign in
    # to the screen's services" makes these sign-ins before the mark for the daily cap, so the cap does not count such
    # a run.
    needs: [route, gather]
    # A screen of what the gather job kept, or a measurement, which needs no gather job. Never for an item that route
    # held at the daily cap, and never on a run by hand on another branch than main.
    if: >-
      ${{ !cancelled() && needs.route.outputs.trust != 'cap'
      && ((needs.gather.result == 'success' && needs.gather.outputs.digest != ''
          && needs.gather.outputs.screen != 'false') || needs.route.outputs.trust == 'measure')
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    environment: {name: review-screen, deployment: false}
    runs-on: ubuntu-24.04
    # A job that runs out of its own time ends as cancelled, which neither reviews nor holds the item. So each step
    # has a time of its own, and those of the steps that run add up to less than the job's: a step that runs out of
    # its time fails the job, and the comment job holds the item. The Screen step's 12 minutes are more than
    # screen.py's own DEADLINE_SECONDS, after which it holds the item itself.
    timeout-minutes: ${{ needs.route.outputs.trust == 'measure' && 60 || 25 }}
    permissions: {contents: read, id-token: write}
    outputs:
      verdict: ${{ steps.screen.outputs.verdict }}
      # The names of the checks that ran, which the review's comment names.
      checks: ${{ steps.screen.outputs.checks }}
    env:
      NAME: ${{ needs.gather.outputs.name }}
      # Ids and endpoints, none of them secret. Google Cloud: the pool, its provider and the account that only this
      # environment's jobs reach, Model Armor's template, and the bucket the reason goes to.
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/review-screen/providers/github
      GCP_SERVICE_ACCOUNT: review-screen@theorem-agent-infra.iam.gserviceaccount.com
      MODEL_ARMOR_URL: https://modelarmor.us.rep.googleapis.com
      MODEL_ARMOR_TEMPLATE: projects/theorem-agent-infra/locations/us/templates/review-screen
      STORAGE_URL: https://storage.googleapis.com
      REASON_BUCKET: theorem-agent-infra-review-screen-reasons
      # Azure: Theorem's tenant, the managed identity review-screen (its client id, agent-infra #1428), whose one
      # federated credential admits this repository's jobs in review-screen, and the Content Safety account.
      AZURE_LOGIN_URL: https://login.microsoftonline.com
      AZURE_TENANT_ID: aaa6ad34-51af-41e7-891f-f16f5c53c396
      AZURE_CLIENT_ID: 878cb696-144f-4c60-b04c-3974fad24e96
      CONTENT_SAFETY_URL: https://theorem-review-screen.cognitiveservices.azure.com
      # Anthropic: Theorem's organization, the service account review-screen, its workspace, and the federation rule
      # oss-verify-screen (fdrl_01PJtZrFW7ECzfBk5UVFjhw9), which admits this file's jobs in review-screen on main and
      # nothing else (ids, not secrets).
      ANTHROPIC_URL: https://api.anthropic.com
      ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01JFhEhPizCyTiK2i22mRJ8a
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01PJtZrFW7ECzfBk5UVFjhw9
      SCREEN_MODEL: claude-haiku-5-5
      # The checks that run, which must name model_armor. A listed check whose settings are missing holds every item;
      # a check leaves only by leaving this list.
      SCREEN_CHECKS: model_armor,prompt_shields,claude
      # How the checks' words make the verdict (.github/scripts/screen.py, RULES, with the measurement behind the
      # choice): held when the model answers suspicious, or Model Armor and Prompt Shields both do; and, under every
      # rule, when a check cannot answer.
      SCREEN_RULE: claude_or_both_detectors
    steps:
      # main's .github/scripts, for take-review-data and screen.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        timeout-minutes: 2
        with: {persist-credentials: false, sparse-checkout: .github/scripts}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        if: needs.route.outputs.trust != 'measure'
        timeout-minutes: 2
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      - name: Take what the gather job kept
        if: needs.route.outputs.trust != 'measure'
        timeout-minutes: 1
        env: {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: .github/scripts/take-review-data "$RUNNER_TEMP/review-data/review.tar"
      # A token for 10 minutes (an hour for a measurement, which runs every check many times), which the account can
      # use for Model Armor, for adding an object to the reason bucket and for reading the labelled set, and for
      # nothing else. A sign-in that fails fails this job, and the comment job holds the item.
      - name: Sign in to Google Cloud
        id: google
        timeout-minutes: 2
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: "${{ needs.route.outputs.trust == 'measure' && '3600s' || '600s' }}", create_credentials_file: false, export_environment_variables: false}
      # The sign-ins of the checks in SCREEN_CHECKS that sign in (.github/scripts/screen.py --sign-in): Microsoft
      # Entra's token for Prompt Shields and Anthropic's token exchange for the model, each with GitHub's identity
      # token, as the Screen step makes them later. It reads no text of the item, and it keeps no token. A sign-in
      # that is refused fails this job before the mark below. A setting that is missing does not fail it: the Screen
      # step holds the item for it. A measurement does not run this step: the Measure step records a sign-in that is
      # refused as the error of that check, and does not stop.
      - name: Sign in to the screen's services
        if: needs.route.outputs.trust != 'measure'
        timeout-minutes: 2
        run: python3 .github/scripts/screen.py --sign-in
      # The daily cap counts a run whose screen job signed in to each service it uses, whatever the job does next
      # (.github/scripts/screened-review-cap), so these come right after the sign-ins. A run whose sign-in to Google,
      # Microsoft Entra or Anthropic is refused ends before it marks, and the cap does not count it. Such a run comes,
      # say, before the last of the three applies of dispatch://INFRA-3746, which admit this file at different times.
      # A measurement's mark counts nothing: route kept no daily-cap-route for it.
      - name: Mark this run's screen for the daily cap
        timeout-minutes: 1
        run: echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/daily-cap"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        timeout-minutes: 2
        with: {name: daily-cap-screen, path: "${{ runner.temp }}/daily-cap", if-no-files-found: error, retention-days: 2, overwrite: true}
      - name: Screen
        id: screen
        if: needs.route.outputs.trust != 'measure'
        timeout-minutes: 12
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ needs.route.outputs.pr || needs.route.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON_OBJECT: ${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
          # A writer's item is screened only for the comments, reviews and review comments of others it holds: the
          # rest is a writer's, which the review reads as before.
          SCREEN_SCOPE: ${{ needs.route.outputs.trust == 'writer' && 'comments' || 'all' }}
          # The comments' and reviews' authors that have write access (the gather job): the screen reads none of
          # their comments or reviews, whatever the scope, since they are this project's own and not the outside
          # text it is for; their review comments go with the others when one of those is an outside account's.
          SCREEN_WRITERS: ${{ needs.gather.outputs.writers }}
          SCREEN_APP_COMMENTS: ${{ needs.gather.outputs.app_comments }}
          SCREEN_APP_REVIEWS: ${{ needs.gather.outputs.app_reviews }}
        run: python3 .github/scripts/screen.py .review ${NAME:+"projects/$NAME"}
      # Every listed check, MEASURE_REPEATS times, on each text of the labelled set kept in the private bucket (the
      # screen's account can read only its measure/set-* objects), and the verdict of each rule of SCREEN_RULE's
      # choices. The texts and their words stay in the bucket, under measure/runs/; this log and the run's summary get
      # the counts per rule alone.
      - name: Measure
        if: needs.route.outputs.trust == 'measure'
        timeout-minutes: 50
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MEASURE_SET: ${{ inputs.measure_set }}
          MEASURE_OBJECT: measure/runs/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
          MEASURE_REPEATS: ${{ inputs.measure_repeats }}
        run: |
          set -euo pipefail
          [[ $MEASURE_SET =~ ^measure/set-v[0-9]+\.json$ ]] || { echo "::error::not a labelled set: $MEASURE_SET"; exit 1; }
          [[ $MEASURE_REPEATS =~ ^[1-5]$ ]] || { echo "::error::MEASURE_REPEATS must be 1 to 5"; exit 1; }
          python3 .github/scripts/screen.py --measure

  review:
    # Claude Code, through anthropics/claude-code-action, checks the enrollment against review.md, or a change against
    # review-change.md, or drafts the reply to an issue as review-issue.md says (the top of this file): route's kind.
    # It reads what the gather job kept. An item that the gather job's output screen says is not screened (a writer's
    # with no text of others) is reviewed as it comes; another only when the screen's
    # verdict is clean. A run whose gather job failed or kept nothing, or whose screen held it, failed or was
    # cancelled, has no review, and neither has an item that route held at the daily cap (named here, as the gather
    # job names it). A run by hand for a held head has no review either: its clean screen approves the held runs, and
    # the completion of the approved Build run starts the review (the top of this file).
    needs: [route, gather, screen]
    if: >-
      ${{ !cancelled() && needs.route.outputs.trust != 'cap' && needs.route.outputs.held != 'true'
      && needs.gather.result == 'success' && needs.gather.outputs.digest != ''
      && (needs.gather.outputs.screen == 'false'
          || (needs.screen.result == 'success' && needs.screen.outputs.verdict == 'clean'))
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    # Two attempts of the Review step, 45 minutes each, and the steps around them (the tailnet's join).
    timeout-minutes: 105
    environment: {name: enroll-review, deployment: false}
    # actions: read for the hourly cap of issue drafts (its step below), which reads this workflow's runs. A job's
    # permissions cannot change with route's kind, so the job holds it for every kind, and the Review step's token has
    # it too: read-only, on the runs of a public repository.
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read, actions: read, id-token: write}
    env:
      KIND: ${{ needs.gather.outputs.kind || needs.route.outputs.kind }}
      PR: ${{ needs.route.outputs.pr }}
      ISSUE: ${{ needs.route.outputs.issue }}
      NAME: ${{ needs.gather.outputs.name }}
      HEAD_SHA: ${{ needs.route.outputs.sha }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/844532188053/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-ci@theorem-agent-root.iam.gserviceaccount.com
      # The account the model gateway serves as its team oss-verify-ci (Theorem's infrastructure code).
      GATEWAY_SERVICE_ACCOUNT: oss-verify-ci@theorem-agent-root.iam.gserviceaccount.com
      # Theorem's model gateway on the tailnet (the top of this file), from the repository variable. Claude Code reads
      # it here, from the job's environment, and the action passes it on (its action.yml, ANTHROPIC_BASE_URL:
      # env.ANTHROPIC_BASE_URL).
      ANTHROPIC_BASE_URL: ${{ vars.MODEL_GATEWAY_URL }}
      # The gateway serves Claude Code's small helper model by its bare id alone, and refuses the dated id the tool
      # asks for by default. The action's step inherits this from the job's environment, as Claude Code does.
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
      # The client id Tailscale gives the federated identity ossv-review-yml-github, which dispatch://INFRA-3746 (a part
      # of dispatch://INFRA-3369) makes for this file. The old identity, ossv-review-github, admits build.yaml alone,
      # which joins no tailnet now, and dispatch://INFRA-3755 removes the old admissions after this file is on main.
      # The id comes from the apply of root/ for dispatch://INFRA-3746 on 2026-11-17: it is that apply's output
      # tailnetClientId-ossv-review-yml-github, which dispatch://INFRA-3369 records. The id is public, not a secret, and
      # this is the one place this file names it.
      TAILNET_CLIENT_ID: "TWbBfz7fqc11CNTRL-k41v23iH8F11CNTRL"
      # The cost collector's address on the tailnet, http://<IPv4 address> on port 80. Every sender of spend
      # records takes this one URL, and it holds the address, not the Service's MagicDNS name, because
      # linux28-agents-1 joins the tailnet with --accept-dns=false and resolves no MagicDNS name; tailscaled
      # routes a Tailscale Service by the destination address. The address is the one Tailscale gave the Service
      # svc:spend when that same apply made it: bootstrap/'s stack output spendCollectorTailnetUrl
      # (theorem-labs/agent-infra#1059), copied from `pulumi stack output spendCollectorTailnetUrl --stack prod`.
      SPEND_COLLECTOR_URL: "http://100.116.58.240"
    outputs:
      # The result step writes it for an enrollment or a change, never for an issue: an issue's draft, which no one has
      # approved, is in no output (a re-run with debug logging prints outputs to the public log).
      comment: ${{ steps.result.outputs.comment }}
      held_object: ${{ steps.held.outputs.object }}
      # An enrollment's verdicts and their reasons, each the structured output's object as one line of JSON, which the
      # comment job parses: its step "Post the comment and record the verdict" writes the comment and the check run
      # Enrollment review from them. No file and no artifact holds them.
      verdicts: ${{ steps.result.outputs.verdicts }}
      reasons: ${{ steps.result.outputs.reasons }}
      # The verdicts and choices of review-change.md, as one line of JSON: of a change, and of the files of an
      # enrollment outside its projects/<name>/ (the gather job's outside). The comment job posts the check run review
      # from them (.github/scripts/review-check).
      change: ${{ steps.result.outputs.change }}
      # The id of the artifact enroll-review-session, which the session job saves in the cache; empty when no session
      # is kept.
      session: ${{ steps.session.outputs.artifact-id }}
      # Its kind, which the session job reads to select the cache key; it does not read the event.
      kind: ${{ needs.gather.outputs.kind || needs.route.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, fetch-depth: 0}
      # The cap on the model runs of the issue path: this repository is public, so anyone with a GitHub account can open
      # an issue and start one. At the cap (6 drafts that ran the model in the last hour), or when it cannot read the
      # runs, the step fails with a `::error::HELD: ...` annotation: no draft, a red run, never a pass. The CI/CD lane's
      # inbound watch pages the CI/CD role once for each run and attempt whose step of this name failed (ISSUE CAP
      # HELD); a run stopped by the later step "Stop before the model when the draft cannot be stored" is not paged as
      # held. Keep this step's name: issue-draft-cap's count and the inbound watch both find a held run by it.
      - name: Hold the draft at the hourly cap
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CAP: 6
        run: .github/scripts/issue-draft-cap
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      # .review/, projects/<name>/ and the last review's session, as the gather job kept them, by their SHA-256: for a
      # screened pull request or issue, exactly what the screen passed.
      - name: Take what the gather job kept
        env: {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: .github/scripts/take-review-data "$RUNNER_TEMP/review-data/review.tar" "$HOME"
      # The sign-in an issue's draft needs, and nothing else: the review's usage goes over the tailnet with no
      # Google token (below), so this step runs for the issue path alone.
      - name: Sign in to Google Cloud, to check that an issue's draft can be stored
        if: env.KIND == 'issue'
        id: gcp
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: 300s, create_credentials_file: false, export_environment_variables: false}
      # An issue's draft is stored after the model, with a sign-in that Google's identity provider for this repository
      # must admit for the run's event. The sign-in above asks the same provider for the same account, so when it was
      # refused for an issue, the store would be refused too, and the model's work lost: stop here, before the model
      # runs, with a red run. Its token (300 s) is not the store's: the store signs in again after the model, so its
      # token is never older than that step. issue-draft-cap does not count a run this step stopped, and the inbound
      # watch pages only for the cap step's failure, not for this one. Keep this step's name: issue-draft-cap finds such
      # a run by it.
      - name: Stop before the model when the draft cannot be stored
        if: env.KIND == 'issue'
        env: {SIGN_IN: "${{ steps.gcp.outcome }}", EVENT: "${{ github.event_name }}"}
        run: |
          [ "$SIGN_IN" = success ] && exit 0
          message="Google Cloud refused this run's sign-in, so its draft could not be stored,"
          message+=" and the model was not run."
          if [ "$EVENT" = issues ]; then
            message+=" The usual cause: Theorem's Google identity provider for this repository does not admit runs"
            message+=" that an issue's event starts yet. A person at Theorem applies that setting, then re-runs this"
            message+=" job."
          else
            # A run started by hand: the provider admits this event already, so the cause is another one.
            message+=" The provider admits a run started by hand, so the cause is elsewhere: a person at Theorem checks"
            message+=" Google's identity provider for this repository and its service account, then re-runs this job."
          fi
          echo "::error::NOT STORED: $message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # The node is ephemeral and preauthorized, and it carries tag:ossv-review. Without it the review cannot reach the
      # model gateway, so a join that fails fails the review. INFRA-832 S1a in agent-infra,
      # merged as 99d1b5d, declares that tag, the grant that gives it the cost collector's Tailscale Service
      # svc:spend on tcp:80 and the model gateway's tcp:443 and tcp:4000 (INFRA-481), beyond those
      # nothing else but the two read-only pages every node of the tailnet may read. The federated identity
      # ossv-review-yml-github (dispatch://INFRA-3746) has claims that admit only this workflow of this repository, on
      # refs/heads/main, in the environment enroll-review, on a GitHub-hosted runner. The apply of root/ for
      # dispatch://INFRA-3746 on 2026-11-17 made the client id above. The job joins with its GitHub identity token, so
      # no key is stored. One review
      # job runs in a run attempt, so the run id and the attempt name the node. A Linux device reaches a Tailscale
      # Service's address only with Tailscale 1.94 or later, or with --accept-routes
      # (https://tailscale.com/kb/1552, "Access Tailscale Services from other devices"): this action meets both at
      # the pinned commit. Its action.yml gives the version input the default 1.104.2, and its src/main.ts puts
      # --accept-routes in every `tailscale up`. The test of this step pins the exact set of its settings, so no
      # version input can be given at all. use-cache is off: the action would
      # otherwise keep the tailscale binary in this repository's Actions cache and run it as root from there, and
      # the review job's cache holds its review session alone (above). log-mode is quiet: at the pinned commit
      # src/logging.ts silences the action's commands only when the run is not in debug, so a re-run with debug logging
      # would print to this public log the `tailscale up` command with this job's GitHub identity token, which the
      # action does not mask (src/main.ts), and the output of `tailscale status --json`, the tailnet's nodes. quiet
      # keeps them silent whatever the debug setting, and a command that fails still writes its error output. The
      # job's 105 minutes hold every step's cap: join 3, the Review step's two attempts of 45 each, and logout 2.
      - name: Join Theorem's tailnet, to reach the model gateway and export this review's usage
        id: tailnet
        timeout-minutes: 3
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0 (sha-pinned)
        with:
          oauth-client-id: ${{ env.TAILNET_CLIENT_ID }}
          audience: theorem.dev/tailnet/ossv-review
          tags: tag:ossv-review
          hostname: ossv-review-${{ github.run_id }}-${{ github.run_attempt }}
          use-cache: false
          log-mode: quiet
      # After a join that passed, the step asks the collector's address for a page, for at most 10 seconds. curl takes
      # any HTTP answer, a 404 too, so only a refused or timed-out connection, or an empty address, fails it. The
      # address stays only while the Service svc:spend does (INFRA-832's spec, D9): a Service made again gets new
      # addresses, and a job that joined would then send every record to an address that answers nothing. So when the
      # collector does not answer, the step writes no exporter variables either, and the warning names the address.
      # The step takes continue-on-error, as the logout does: the export never decides whether a review runs.
      - name: Export the review's usage to the cost collector
        continue-on-error: true
        env: {TAILNET: "${{ steps.tailnet.outcome }}"}
        run: |
          if [ "$TAILNET" != success ]; then
            echo "::warning::This job did not join the tailnet: this review's usage is not exported."; exit 0; fi
          if ! curl -q -sS --max-time 10 -o /dev/null "$SPEND_COLLECTOR_URL"; then
            echo "::warning::The cost collector did not answer at '$SPEND_COLLECTOR_URL' on the tailnet: this review's usage is not exported."
            exit 0
          fi
          subproject=${NAME:-_$KIND}
          builtin printf '%s\n' CLAUDE_CODE_ENABLE_TELEMETRY=1 OTEL_LOGS_EXPORTER=otlp OTEL_METRICS_EXPORTER=none \
            OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf "OTEL_EXPORTER_OTLP_ENDPOINT=$SPEND_COLLECTOR_URL" \
            "OTEL_RESOURCE_ATTRIBUTES=theorem.project=oss-verify,theorem.subproject=$subproject,theorem.lane=enroll-review-ci,theorem.credential=oss-verify-ci" \
            >> "$GITHUB_ENV"
      # What the one Review step reads and gives, for route's kind: the rules file, the pull request or issue, the
      # structured output's schema, and for an enrollment or a change the session to resume.
      - name: What the review reads and gives
        id: prompt
        env:
          SESSION: ${{ needs.gather.outputs.session }}
          LAST: ${{ needs.gather.outputs.last }}
          OUTSIDE: ${{ needs.gather.outputs.outside }}
        run: .github/scripts/review-prompt
      # An empty or other value would send the gateway's token elsewhere: Claude Code's default is Anthropic's own API.
      - name: Check the model gateway's URL
        run: |
          [[ $ANTHROPIC_BASE_URL =~ ^https://[A-Za-z0-9.-]+$ ]] \
            || { echo "::error::the repository variable MODEL_GATEWAY_URL is not https://<host>"; exit 1; }
      # The model gateway's sign-in: a Google identity token of oss-verify-ci, audience model-gateway-gce, with the
      # email claim the gateway reads, from Google's workload identity provider. It lives one hour, and this step runs
      # just before the Review step, whose 45 minutes it outlasts.
      - name: Sign in to the model gateway
        id: gateway
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GATEWAY_SERVICE_ACCOUNT }}", token_format: id_token, id_token_audience: model-gateway-gce, id_token_include_email: true, create_credentials_file: false, export_environment_variables: false}
      # The first attempt. When it fails or runs out of its 45 minutes, the job goes on to one more attempt, "Review
      # again", with the same inputs and a token of its own; no step counts or writes the attempts.
      - name: Review
        id: review
        continue-on-error: true
        timeout-minutes: 45
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          # The gateway's identity token, which Claude Code sends to ANTHROPIC_BASE_URL as its key (x-api-key).
          anthropic_api_key: ${{ steps.gateway.outputs.id_token }}
          github_token: ${{ github.token }}
          # The action's own check of the account that started the run is off ("*"): who is reviewed without a
          # person is decided by route's trust step and the screen, in this job's condition. A value is still given,
          # because with none the action writes this job's GitHub token into the checkout's git configuration, which
          # Claude can read.
          allowed_non_write_users: "*"
          # Only these Apps' runs get a review (the action refuses any other App): the one list, at the top.
          allowed_bots: ${{ env.ALLOWED_BOTS }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode default --model claude-opus-5-5 --effort xhigh --max-turns 300
            ${{ steps.prompt.outputs.arguments }}
      # The second and last attempt, only after the first failed. It signs in again: the first token lives one hour,
      # and may not outlast another 45 minutes. A failure here fails the job.
      - name: Sign in to the model gateway again
        id: gateway-again
        if: steps.review.outcome == 'failure'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GATEWAY_SERVICE_ACCOUNT }}", token_format: id_token, id_token_audience: model-gateway-gce, id_token_include_email: true, create_credentials_file: false, export_environment_variables: false}
      - name: Review again
        id: review-again
        if: steps.review.outcome == 'failure'
        timeout-minutes: 45
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          # The same inputs as the Review step's, but the token of the sign-in just before.
          anthropic_api_key: ${{ steps.gateway-again.outputs.id_token }}
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          allowed_bots: ${{ env.ALLOWED_BOTS }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode default --model claude-opus-5-5 --effort xhigh --max-turns 300
            ${{ steps.prompt.outputs.arguments }}
      # The logout deletes the ephemeral node at once, whatever the review did and whatever the join's outcome: at
      # the pinned commit the action stops waiting for `tailscale up` after its 2-minute timeout but does not stop
      # the command (src/main.ts), so a join that failed can still make the node. When the join never installed
      # tailscale, the step has nothing to log out and passes. When the runner itself is lost, Tailscale deletes the
      # node 30 to 60 minutes after its last activity. The step comes after both attempts of the review, and takes
      # continue-on-error, as the join does: this is the measurement's own cleanup, and a failed logout must not skip
      # the steps below it, which keep the draft, the verdicts and a held finding. The action's post step logs out
      # again at the end of the job.
      - name: Leave the tailnet
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if command -v tailscale > /dev/null; then sudo tailscale logout; fi
      # The attempt that ran last: "Review again" when it ran, else the Review step.
      - name: Keep the draft, and the held finding apart from it
        id: result
        env:
          RESULT: ${{ steps.review-again.outputs.execution_file || steps.review.outputs.execution_file }}
          SESSION: ${{ steps.review-again.outputs.session_id || steps.review.outputs.session_id }}
        run: |
          out=$(jq -ce 'map(select(.type == "result")) | last | .structured_output | objects' "$RESULT")
          # An issue's draft, which no one has approved, and what a person decides on it: never the artifact, which any
          # signed-in GitHub account can download from this public repository, nor the public job summary. A file
          # here, which the step "Store the issue draft for a person" puts in the private bucket.
          if [ "$KIND" = issue ]; then
            { echo "The draft reply:"; echo; jq -r .comment <<< "$out"; echo
              echo "What a person at Theorem decides before it is posted:"; echo; jq -r .decide <<< "$out"; } \
              > "$RUNNER_TEMP/issue-draft.md"
            exit 0
          fi
          # The job's outputs that the comment job reads, each in one environment variable of its step: Linux refuses
          # to start a process with one over 128 KiB, so each is cut until it is at most 100,000 bytes. The comment
          # first to the 50,000 characters review-body keeps of it, then to half of that, as often as it takes.
          delimiter="comment_$(openssl rand -hex 16)"
          for limit in 50000 25000 12500 6250 3125 0; do
            jq -r --argjson n "$limit" '.comment[0:$n]' <<< "$out" > "$RUNNER_TEMP/comment.md"
            (( $(wc -c < "$RUNNER_TEMP/comment.md") > 100000 )) || break
          done
          { echo "comment<<$delimiter"; cat "$RUNNER_TEMP/comment.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          # Only an enrollment's schema has reasons and a held finding, and only an enrollment's verdicts are read: the
          # comment job records them in the check run Enrollment review. jq -c writes each on one line. Only a check id's
          # verdict and reason are kept, and only a verdict of a word (review-verdict reads no other; it counts any
          # other as person). Each reason is cut to the 1,500 characters the check run shows (review-verdict's
          # REASON_LIMIT), and all of them to half of that, as often as it takes.
          if [ "$KIND" = enrollment ]; then
            echo "verdicts=$(jq -c '.verdicts | if type == "object" then with_entries(select((.key | test("\\A[A-G][0-9]?\\z"))
              and (.value | type == "string" and length <= 8))) else {} end' <<< "$out")" >> "$GITHUB_OUTPUT"
            for limit in 1500 750 375 187 93 46 0; do
              reasons=$(jq -c --argjson n "$limit" '.reasons | if type == "object" then
                with_entries(select((.key | test("\\A[A-G][0-9]?\\z")) and (.value | type == "string"))
                  | .value |= .[0:$n]) else {} end' <<< "$out")
              (( $(printf '%s' "$reasons" | wc -c) > 100000 )) || break
            done
            echo "reasons=$reasons" >> "$GITHUB_OUTPUT"
          fi
          # The verdicts and choices of review-change.md, for the check run review (.github/scripts/review-check): a
          # change's own, or an enrollment's `change`, of its files outside projects/<name>/; null when there are none.
          # Only the five checks' verdicts of a word, and the four keys of each choice, are kept. Over 20 choices, the
          # choices are kept as a text, which review-check cannot read, so that a cut list never drops a reserved one.
          # The text of each choice and basis is cut to 1,000 characters, and to half of that as often as it takes.
          for limit in 1000 500 250 125 62 0; do
            change=$(jq -c --argjson n "$limit" '(if env.KIND == "change" then {verdicts, choices} else .change end)
              | if type == "object" then
                  {verdicts: (.verdicts | if type == "object" then with_entries(select((.key | test("\\A[1-5]\\z"))
                     and (.value | type == "string" and length <= 8))) else {} end),
                   choices: (.choices | if type == "array" and length <= 20 then
                     map(if type == "object" then {check, reserved,
                       choice: (.choice | if type == "string" then .[0:$n] else null end),
                       basis: (.basis | if type == "string" then .[0:$n] else null end)} else null end)
                     else "not read" end)}
                else null end' <<< "$out")
            (( $(printf '%s' "$change" | wc -c) > 100000 )) || break
          done
          echo "change=$change" >> "$GITHUB_OUTPUT"
          { echo '<!-- held finding -->'; jq -r '.held // ""' <<< "$out"; } > "$RUNNER_TEMP/held-finding.md"
          if jq -e '(.held // "") | test("\\S")' <<< "$out" > /dev/null; then echo "held=yes" >> "$GITHUB_OUTPUT"
          else mkdir -p ~/.claude && printf 'session=%s head=%s\n' "$SESSION" "$HEAD_SHA" > ~/.claude/ossv-last-review; fi
      # A session that holds a held finding is not kept: any run of a pull request can read main's cache. This job only
      # restores the cache, so it keeps the session as an artifact, for a day, and the session job saves it in the cache.
      # The artifact's root is ~/.claude, where both paths are. A failed upload, as a failed save before, is a warning,
      # and the next review is then fresh.
      - name: Keep this review's session for the next push's review
        id: session
        if: ${{ steps.result.outputs.held != 'yes' && (env.KIND == 'enrollment' || env.KIND == 'change') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        with: {name: enroll-review-session, path: "~/.claude/projects\n~/.claude/ossv-last-review", include-hidden-files: true, if-no-files-found: warn, retention-days: 1, overwrite: true}
      # A sign-in of its own, after the model: its 300 s token is minted for the store step that follows, never older.
      - name: Sign in to Google Cloud to store the held finding, or an issue's draft
        id: gcp-held
        if: ${{ steps.result.outputs.held == 'yes' || env.KIND == 'issue' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: 300s, create_credentials_file: false, export_environment_variables: false}
      # An issue's draft, into the private bucket under issue-drafts/, which the hold job does not read; the job
      # summary names the command a person at Theorem reads it with (.github/scripts/store-issue-draft).
      - name: Store the issue draft for a person
        if: env.KIND == 'issue'
        env: {GCP_ACCESS_TOKEN: "${{ steps.gcp-held.outputs.access_token }}", RUN_ID: "${{ github.run_id }}", RUN_ATTEMPT: "${{ github.run_attempt }}", RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: .github/scripts/store-issue-draft "$RUNNER_TEMP/issue-draft.md"
      # Into the private bucket only the hold job reads (the top of this file); never a log, an output or an artifact.
      - name: Store the held finding for the hold job
        id: held
        if: ${{ steps.result.outputs.held == 'yes' }}
        env: {GCP_ACCESS_TOKEN: "${{ steps.gcp-held.outputs.access_token }}", RUN_ID: "${{ github.run_id }}", RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: |
          set -euo pipefail
          name="held/$RUN_ID/$(openssl rand -hex 16)"
          header=$(printf 'oss-verify held finding v1\npr: %s\nhead: %s\nproject: %s\nrun: %s\n---' "$PR" "$HEAD_SHA" "$NAME" "$RUN_URL")
          generation=$(.github/scripts/held-bucket-put "$name" "$header" "$RUNNER_TEMP/held-finding.md")
          echo "object=$name" >> "$GITHUB_OUTPUT" && echo "Stored the held finding as $name, generation $generation."

  session:
    # Saves the session the review job kept in the Actions cache, under the key the gather job restores from, for the
    # review of the next push (the top of this file). The gather job reads the pull request and the review job runs the
    # model, so neither writes the cache. This job writes it, and it processes no input of the pull request before it
    # writes, as GitHub's dependency caching reference asks of a job that declares a write-capable cache-mode on an
    # untrusted trigger: it checks out nothing, runs no script, holds no permission and no identity token, and its two
    # pinned actions move the one artifact the review job uploaded, by that artifact's id, into the cache. A save that fails is
    # a warning, never a failure, as a cache save is in any job: the next review is then fresh.
    needs: [route, gather, review]
    if: ${{ !cancelled() && needs.review.outputs.session != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: write
    permissions: {}
    env:
      # Kind comes from the review job's output. The review job does not write the cache, so this job selects its key
      # without reading any event data.
      KIND: ${{ needs.review.outputs.kind }}
      SESSION_KEY: ${{ needs.review.outputs.kind == 'change' && format('review-{0}-', needs.route.outputs.pr) || format('enroll-review/{0}/{1}/', needs.route.outputs.pr, needs.gather.outputs.name) }}
    steps:
      - name: Take the session the review job kept
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        with: {artifact-ids: "${{ needs.review.outputs.session }}", path: "~/.claude"}
      - name: Keep it for the next push's review
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (sha-pinned)
        with: {path: "~/.claude/projects\n~/.claude/ossv-last-review", key: "${{ env.SESSION_KEY }}${{ github.run_id }}-${{ github.run_attempt }}"}

  hold:
    # Sends every finding stored in the held-findings bucket to the disclosure route as a private issue
    # (.github/scripts/review-hold, .github/scripts/review-held): this run's, if its review held one back from the
    # public comment (review.md, rule 6), and any that an earlier run stored but did not send (that run was cancelled).
    # It reads the findings from the bucket, never from an output, and the App's key and the repository's name from
    # Secret Manager, as the comment job reads the key: so it runs in the environment comment, the only one whose jobs
    # can act as ossv-app-comment. It runs no code of the pull request. Only after an enrollment's review: a change's or
    # an issue's schema has no held finding, so their runs store none, and the next enrollment's run sends what any
    # earlier run left (so a flood of issues cannot fill this job's one queue below).
    needs: [route, gather, review]
    if: >-
      ${{ !cancelled() && needs.review.result != 'skipped' && (needs.gather.outputs.kind || needs.route.outputs.kind) == 'enrollment'
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One hold job at a time in the repository, whatever pull request: two sweeps at once could each send the same
    # stored finding before either filed its issue. Every waiting hold job keeps its place (queue: max, up to 100), so
    # none is cancelled by a later one (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
    concurrency:
      group: review-hold
      cancel-in-progress: false
      queue: max
    environment:
      name: comment
      deployment: false
    permissions:
      # contents: read only for the checkout of .github/scripts. It writes with the oss-verify App's token.
      contents: read
      # Only for the GitHub identity token that Google's federation trades for an access token of
      # ossv-app-comment@theorem-agent-root, which reads the App's key, the repository's name and the held findings.
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/844532188053/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-app-comment@theorem-agent-root.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Every step below fails this job only for this run's own finding (review-hold's own rule): when this review
      # held none, a failure here is about another run's stored finding, which stays in the bucket for the next run,
      # and it must not fail this run's check review jobs (collect collects this job). The step still shows as
      # failed, with its annotation.
      - name: Sign in to Google Cloud
        id: gcp
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      # Whether the bucket holds any finding at all: most runs end here.
      - name: Look for stored held findings
        id: list
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          count=$(curl -q -sSf --max-time 60 -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://storage.googleapis.com/storage/v1/b/theorem-agent-infra-oss-verify-held-findings/o?prefix=held%2F&fields=items(name)' \
            | jq -er '(.items // []) | length')
          echo "The bucket holds $count stored held findings."
          if [ "$count" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi

      # The App's private key, as the comment job reads it (that job's comment says how it is masked).
      - name: Read the oss-verify App's key
        id: key
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        if: ${{ steps.list.outputs.any == 'true' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          payload=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-github-app-key/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)')
          builtin printf '::add-mask::%s\n' "$payload"
          key=$(builtin printf '%s' "$payload" | base64 -d)
          while IFS= read -r line; do
            if [[ $line == *[![:space:]]* ]]; then builtin printf '::add-mask::%s\n' "$line"; fi
          done <<< "$key"
          delimiter="key-$(openssl rand -hex 16)"
          { echo "key<<$delimiter"; builtin printf '%s\n' "$key"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      # The name of the private repository the disclosure route reads, in this repository's organisation: Secret
      # Manager oss-verify-held-findings-repo, which Theorem's infrastructure code declares and only ossv-app-comment can
      # read. It is masked before any step uses it, so no log of this public repository shows it. review-held refuses
      # it unless GitHub says it is private.
      - name: Where the held findings go
        id: where
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        if: ${{ steps.list.outputs.any == 'true' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          name=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-held-findings-repo/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)' | base64 -d) || name=""
          if ! [[ $name =~ ^[A-Za-z0-9_.-]{1,100}$ ]]; then
            echo "::error::Could not read the held findings' repository (Secret Manager oss-verify-held-findings-repo), so no held finding is sent, and a review that holds one is not posted."
            exit 1
          fi
          builtin printf '::add-mask::%s\n' "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Get the oss-verify App's token for the held findings' repository
        id: app
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        # Only with the key and the one repository read: an empty repository list would give a token for every
        # repository of the App's installation.
        if: ${{ steps.list.outputs.any == 'true' && steps.key.outputs.key != '' && steps.where.outputs.name != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ steps.key.outputs.key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.where.outputs.name }}
          permission-issues: write

      # Each stored finding, read, sent and then deleted; one that is not sent stays for the next run.
      - name: Send every stored held finding to the disclosure route
        if: ${{ steps.list.outputs.any == 'true' && steps.app.outputs.token != '' }}
        continue-on-error: ${{ needs.review.outputs.held_object == '' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          HELD_FINDINGS_REPO: ${{ github.repository_owner }}/${{ steps.where.outputs.name }}
          REPO: ${{ github.repository }}
          # This run's own finding, if any: the job fails only if that one is not sent.
          CURRENT_OBJECT: ${{ needs.review.outputs.held_object }}
        run: .github/scripts/review-hold "$RUNNER_TEMP/held"

  comment:
    # Writes, as oss-verify[bot], what the run decided about the pull request or the issue. It runs no code of the
    # pull request.
    # For an enrollment pull request it runs on every run whose gather job took the project, or that route held at the
    # daily cap (RECORD below), whether its head is held or not. Its step "Post the comment and
    # record the verdict" records one check run Enrollment review at the run's head (.github/scripts/review-verdict),
    # which names the pull request by its number (external_id): the review's verdicts, or that the screen held it,
    # that the daily cap stopped it, or which job failed. Its output.text also keeps the record of the review, which
    # GitHub does not show: the verdicts or the hold, with the criticality score, OSS-Fuzz and binary sizes that the
    # gather job gave (review-verdict's docstring defines it). With the review's verdicts and at the pull request's
    # current head, the step also posts the review comment, or updates the one already there
    # (.github/scripts/review-body); when the review held a finding back, only once the hold job sent it, because the
    # comment says that it was sent. Any other outcome posts no comment and leaves the comment of an earlier head as
    # it is: the review comment stays the App's only comment on an enrollment pull request.
    # For a change pull request it posts the review's comment the same way, with no check run Enrollment review. For
    # both kinds it posts the check run review of the reviewed head, and a hold of a pull request fails that check
    # run unless a person approved that head, which passes it (the top of this file, and
    # .github/scripts/review-check). For a change pull
    # request or an issue that the screen held, that could not be gathered or screened, whose screened review failed,
    # or that route held at the daily cap: it puts the label review-held on it and posts one comment that says so, in
    # fixed words, which a later hold replaces. The comment says nothing of why, and this job could not: the screen
    # job's only output is its verdict, and why is in the private bucket. A later review that is posted, or for an
    # issue a later review that made its draft, takes the label off and deletes the hold comment. Never the draft for
    # an issue: a person approves the exact text of each reply to an issue before anyone posts it.
    # On a run by hand for a held head (route's held), a clean verdict of the screen approves the head's held runs
    # (APPROVE below), and nothing is posted or recorded. Any other outcome of such a run is recorded by the rules
    # above: RECORD for an enrollment whose project the gather job took, or one at the daily cap, and else the label
    # and the hold comment. Not a check run when the newest check run Enrollment review of the oss-verify App for this
    # pull request at this head is a verdict of the review: that verdict stands. A hold replaces an earlier hold (the
    # step "Post the comment and record the verdict").
    # On a run by hand that replays a merge (route's replay, REPLAY below), it starts enroll-merged.yml for the pull
    # request with the App's token, and does nothing else: no gather, screen or review ran, and it posts and records
    # nothing. GitHub starts no workflow_run for a run that a job's GITHUB_TOKEN starts, so Held runs cannot start that
    # replay itself: Enroll dispatch would never run on its completion. GitHub starts one for a run that an App's token
    # starts.
    # Its sign-in, key and token steps have no continue-on-error: when one of them fails, this job and the run fail, so
    # Held runs does not count the run as a screen. When the screen gave a verdict, Held runs re-runs the failed jobs of
    # the run, at most once an hour, and the verdict stands (.github/workflows/held-runs.yml).
    needs: [route, gather, screen, review, hold]
    if: >-
      ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
      && (((needs.gather.outputs.kind || needs.route.outputs.kind) == 'enrollment'
           && (needs.gather.outputs.name != '' || needs.route.outputs.trust == 'cap'))
      || ((needs.gather.outputs.kind || needs.route.outputs.kind) == 'change' && needs.review.result == 'success' && needs.review.outputs.comment != '')
      || ((needs.gather.outputs.kind || needs.route.outputs.kind) == 'issue' && needs.review.result == 'success')
      || (needs.route.outputs.held == 'true' && needs.screen.result == 'success' && needs.screen.outputs.verdict == 'clean')
      || needs.route.outputs.replay == 'true'
      || (needs.route.outputs.refresh == 'true' && github.event_name == 'workflow_run')
      || (((needs.gather.outputs.kind || needs.route.outputs.kind) == 'change' || (needs.gather.outputs.kind || needs.route.outputs.kind) == 'issue' || needs.route.outputs.held == 'true')
          && (needs.route.outputs.trust == 'cap'
              || (needs.route.outputs.trust == 'screen' && needs.gather.result == 'failure')
              || (needs.gather.result == 'success' && needs.gather.outputs.digest != '' && needs.gather.outputs.screen != 'false'
                  && (needs.screen.result == 'failure'
                      || (needs.screen.result == 'success'
                          && (needs.screen.outputs.verdict != 'clean' || needs.review.result == 'failure'
                              || needs.review.result == 'cancelled'))))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The GitHub Environment is what gets this job the App's key and keeps it from every other job: its identity
    # token carries an `environment` claim, and only a token with that claim may act as ossv-app-comment, the
    # dedicated reader of the key for these jobs (Theorem's infrastructure code). Its one protection rule is
    # the deployment-branch policy `main` (Theorem's infrastructure code); it has no
    # required reviewer and no wait timer, so it adds no wait and no approval. Removing this line does not weaken the
    # job; it stops it working.
    # deployment: false, so a comment posts no deployment on the pull request; the environment claim, which is what
    # the account needs, is in the token either way (measured on a run of build.yaml).
    environment:
      name: comment
      deployment: false
    # One comment job at a time for a pull request or an issue, whatever event started its run (the run's own group is
    # by event): two at once could each find no comment, each post one, and only the first would ever be updated after.
    # Every waiting job keeps its place (queue: max), so none is cancelled by a later one and fails the check review
    # jobs.
    concurrency:
      group: review-comment-${{ needs.route.outputs.pr || needs.route.outputs.issue }}
      cancel-in-progress: false
      queue: max
    permissions:
      # contents: read only for the checkout of .github/scripts, main's (review-verdict, review-body, review-neutralize,
      # review-check, approval.py, artifact.py, approve-held). The App's token reads the pull request's reviews, which
      # review-check reads for a reserved choice and for a hold (approval.py's person_approval).
      contents: read
      # Only for the GitHub identity token that Google's federation trades for an access token of
      # ossv-app-comment@theorem-agent-root, which reads the App's key. It writes with the oss-verify App's token, not
      # this job's, and runs no code of the pull request.
      id-token: write
    env:
      # The review job's provider, and the account only a job in this environment can act as
      # (Theorem's infrastructure code).
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/844532188053/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-app-comment@theorem-agent-root.iam.gserviceaccount.com
      KIND: ${{ needs.gather.outputs.kind || needs.route.outputs.kind }}
      # true when route found held runs at the head: a run by hand that only screens, and approves on a clean verdict.
      # The step "Post the comment and record the verdict" reads it.
      HELD_RUNS: ${{ needs.route.outputs.held }}
      # Whether this job approves the held runs of the head: a run by hand for a held head whose screen gave the
      # verdict clean. Then it posts and records nothing. route gives a replay no held head, so a replay is no approval.
      APPROVE: ${{ needs.route.outputs.held == 'true' && needs.screen.result == 'success' && needs.screen.outputs.verdict == 'clean' }}
      # Whether this job replays the merge of a merged pull request: route's replay, true or empty. Then it does that
      # alone.
      REPLAY: ${{ needs.route.outputs.replay }}
      # Whether this job posts the check run review again after a Review approvals run (route's refresh), and does
      # that alone.
      REFRESH: ${{ needs.route.outputs.refresh }}
      # Whether this job holds the item (above) rather than post a review: the review job ran only when the item was
      # not held, and this job runs for such a review only when it succeeded. An approval and a replay hold nothing.
      HOLDING: ${{ needs.route.outputs.replay != 'true' && needs.route.outputs.refresh != 'true' && needs.review.result != 'success' && !(needs.route.outputs.held == 'true' && needs.screen.result == 'success' && needs.screen.outputs.verdict == 'clean') }}
      # Whether this job records the check run Enrollment review: an enrollment whose project the gather job took, or
      # one that route held at the daily cap, on every path, held or not.
      RECORD: ${{ needs.route.outputs.kind == 'enrollment' && (needs.gather.outputs.name != '' || needs.route.outputs.trust == 'cap') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Sign in to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      # The App's private key: Secret Manager oss-verify-github-app-key in theorem-agent-infra, which Theorem's
      # infrastructure code declares and versions. This repository stores no copy of it. Each
      # line of the key is masked, and so is its base64 form, because one mask command registers one line: that keeps
      # these two representations out of the log, not every possible re-encoding of the key.
      - name: Read the oss-verify App's key
        id: key
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          payload=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-github-app-key/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)')
          builtin printf '::add-mask::%s\n' "$payload"
          key=$(builtin printf '%s' "$payload" | base64 -d)
          while IFS= read -r line; do
            if [[ $line == *[![:space:]]* ]]; then builtin printf '::add-mask::%s\n' "$line"; fi
          done <<< "$key"
          delimiter="key-$(openssl rand -hex 16)"
          { echo "key<<$delimiter"; builtin printf '%s\n' "$key"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      # One token for every step below but the approval and the replay: checks for the check runs Enrollment review
      # and review, pull requests for the review comment and for the reviews that approve a head (review-check), and
      # issues for the label review-held and its comment, an issue's too. On
      # the approval path (APPROVE) and on a replay (REPLAY) no step uses it: the label step needs HOLDING, the post
      # step does not run on those paths, and the step that takes the label off needs a posted comment, a recorded
      # check run or an issue. So the job makes it on the other paths alone.
      - name: Get the oss-verify App's token
        id: app
        if: env.APPROVE != 'true' && env.REPLAY != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ steps.key.outputs.key }}
          permission-checks: write
          permission-pull-requests: write
          permission-issues: write

      # A token of its own, with actions: write alone, made only when the screen passed a held head (APPROVE) or for
      # the replay of a merge (REPLAY). The App's configuration has actions: write (gh api apps/oss-verify), but
      # whether its installation accepted it is not known before the first approval or replay. A refusal fails this
      # step alone: the other paths of this job use the token above. The cost of actions: write: this token can also
      # cancel, re-run and start the runs of this repository, so it exists only on these two paths, and only the two
      # steps after it use it: the approval, and the replay, which starts a run with it.
      - name: Get the oss-verify App's token to approve the held runs or replay a merge
        id: approve
        if: env.APPROVE == 'true' || env.REPLAY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ steps.key.outputs.key }}
          permission-actions: write

      # Only on a run by hand for a held head whose screen gave the verdict clean (APPROVE): every held run of the
      # head that the screen read, of any workflow, from the pull request's head repository and branch
      # (.github/scripts/approve-held, which refuses unless the verdict is clean). It reads the pull request again
      # first, and approves nothing when the head moved. The steps below then do nothing: the completion of the
      # approved Build run starts the review of this head.
      - name: Approve the held runs
        if: env.APPROVE == 'true'
        env:
          GH_TOKEN: ${{ steps.approve.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.route.outputs.pr }}
          HEAD_SHA: ${{ needs.route.outputs.sha }}
          SCREEN_VERDICT: ${{ needs.screen.outputs.verdict }}
        run: .github/scripts/approve-held

      # Only on a run by hand that replays a merge (REPLAY): main's enroll-merged.yml for the pull request, with the
      # App's token that can write runs (steps.approve), never this job's own token. GitHub starts no workflow_run for
      # a run that a job's GITHUB_TOKEN starts, and starts one for a run that an App's token starts. So
      # enroll-dispatch.yml runs on the completion of this replay, and decides the merge (decide_merged of
      # .github/scripts/enroll-dispatch).
      - name: Replay the merge for Enroll dispatch
        if: env.REPLAY == 'true'
        env:
          GH_TOKEN: ${{ steps.approve.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.route.outputs.pr }}
        run: |
          set -euo pipefail
          [[ $PR =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $PR"; exit 1; }
          gh workflow run enroll-merged.yml -R "$REPO" --ref main -f "pr=$PR"
          said="Started enroll-merged.yml on main for pull request $PR with the oss-verify App's token: enroll-dispatch.yml runs on its completion."
          echo "$said"
          echo "$said" >> "$GITHUB_STEP_SUMMARY"

      # Only after a Review approvals run (REFRESH, route's refresh): the check run review of route's head again, from
      # the record of the newest one, with the approvals read now (.github/scripts/review-check --refresh), so a
      # choice reserved for a person, or a hold, passes once a person approves the head and fails again once no
      # person's approval of that head stands, a dismissal or a later request for changes having taken the last one
      # back. No model runs, and no other step of this job does
      # anything on this path. It posts only when the conclusion, the title or the record (output.text, which names
      # the login whose approval the check run rests on) changes.
      - name: Post the check run review again, with the approvals read now
        if: env.REFRESH == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.route.outputs.pr }}
          HEAD_SHA: ${{ needs.route.outputs.sha }}
        run: |
          set -euo pipefail
          [[ ${PR:-} =~ ^[1-9][0-9]*$ && ${HEAD_SHA:-} =~ ^[0-9a-f]{40}$ ]] || { echo "::error::route gave no pull request and head."; exit 1; }
          # The newest check run review of this pull request at this head that the oss-verify App posted.
          id=$(gh api --paginate --slurp "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=review&filter=all&per_page=100" \
            | jq -r --arg pr "$PR" '[.[].check_runs[] | select(.app.id == 5447700 and .external_id == $pr)] | max_by(.id) | .id // empty')
          if [ -z "$id" ]; then
            echo "No check run review of #$PR at $HEAD_SHA: the review of this head posts one."
            exit 0
          fi
          newest=$(gh api "repos/$REPO/check-runs/$id")
          check=$(RECORD=$(jq -r '.output.text // ""' <<< "$newest") .github/scripts/review-check --refresh)
          if [ -z "$check" ]; then
            echo "Check run $id holds no record that an approval changes: nothing is posted."
            exit 0
          fi
          # The record too (output.text): it names the login whose approval the check run rests on, so one that still
          # credits an approval that was taken back is replaced, even where another person's approval keeps the
          # conclusion and the title. The record is this App's own text, which no text of the pull request reaches,
          # so this compares what the App wrote and never what someone wrote in the pull request.
          fields='[.conclusion, .output.title, .output.text]'
          if [ "$(jq -c "$fields" <<< "$check")" = "$(jq -c "$fields" <<< "$newest")" ]; then
            echo "Check run $id stands: the approvals read now give it the same conclusion, title and record."
            exit 0
          fi
          url=$(jq -r '.details_url // ""' <<< "$newest")
          jq --arg url "$url" 'if $url == "" then . else . + {details_url: $url} end' <<< "$check" \
            | gh api --method POST "repos/$REPO/check-runs" --input - > /dev/null
          echo "Posted the check run review of #$PR at $HEAD_SHA again: $(jq -r .conclusion <<< "$check")."

      # Fixed words: nothing of the pull request, the issue, its account or the screen's reason. Only an item that
      # gets no check run Enrollment review: that check run records the hold of an enrollment that RECORD names. A
      # pull request's hold also posts the check run review of its head (.github/scripts/review-check): failure with
      # the hold's title, because no review of the head gave it a verdict, or success once a person approved that
      # head (approval.py's person_approval), which the hold comment says a person can do.
      - name: Label it review-held and say so
        if: env.HOLDING == 'true' && env.RECORD != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.route.outputs.pr }}
          NUMBER: ${{ needs.route.outputs.pr || needs.route.outputs.issue }}
          TRUST: ${{ needs.route.outputs.trust }}
          REVIEW: ${{ needs.review.result }}
          HEAD_SHA: ${{ needs.route.outputs.sha }}
          # The run that holds it, which the comment names, so that a re-run of this run's failed jobs that posts a
          # review takes its own hold off (route, and so its start time, is not re-run).
          RUN_ID: ${{ github.run_id }}
          # For trust cap: the time the daily cap lets it run (route's output free).
          FREE: ${{ needs.route.outputs.free }}
          # The check run review's link: this run.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          # A pull request's run of an older head holds nothing: the run of its current head decides.
          if [ -n "${PR:-}" ]; then
            current=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            if [ "$current" != "$HEAD_SHA" ]; then
              echo "The pull request's head is now $current, not $HEAD_SHA: the run of $current decides."
              exit 0
            fi
            # A review of this head that is posted already (one a person started by hand) stands: no hold replaces it.
            reviews=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq '.[] | select(.user.login == "oss-verify[bot]" and (.body | startswith("<!-- oss-verify-review -->"))) | .body')
            if grep -qxF "<!-- oss-verify-review-head $HEAD_SHA -->" <<< "$reviews"; then
              echo "A review of $HEAD_SHA is posted: no hold."
              exit 0
            fi
          fi
          input="pr" change="a push"
          [ -n "${PR:-}" ] || input="issue" change="an edit of the issue"
          ask="A person with write access can start the review with \`gh workflow run review.yml -R $REPO -f $input=$NUMBER\`."
          if [ "$TRUST" = cap ]; then
            [[ $FREE =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              || { echo "::error::no time the daily cap frees: $FREE"; exit 1; }
            free=$(date -u -d "$FREE" '+%Y-%m-%d %H:%M UTC')
            why="It comes from an account without write access to this repository, and the automated reviews of such accounts reached their cap of $REVIEW_CAP in 24 hours, $REVIEW_CAP_AUTHOR for one author."
            ask="From $free, $change or \`gh workflow run review.yml -R $REPO -f $input=$NUMBER\` reviews it."
          elif [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then
            # A review that failed or ran out of its time (cancelled). When the whole run is cancelled, this job does
            # not run.
            why="It comes from, or holds the text of, an account without write access to this repository. The automated screen passed it, but the automated review did not finish. Theorem decides the next step."
          else
            why="It comes from, or holds the text of, an account without write access to this repository, so an automated screen reads it before the automated review does, and the screen did not pass it or could not read it. Theorem decides the next step."
          fi
          # A person's approval of this head passes the check run review of a pull request
          # (dispatch://INFRA-5359/ask/605104e3-b85c-4c22-9a54-b254ba0e3c10, .github/scripts/review-check).
          if [ -n "${PR:-}" ]; then
            ask+=" A person with write access who is not its author can also approve this head on GitHub: the check"
            ask+=" review then passes with no review."
          fi
          [[ $RUN_ID =~ ^[0-9]+$ ]] || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          printf '%s\n%s\n\n%s %s\n\n%s\n' '<!-- oss-verify-held -->' "**Automated review held.**" "$why" "$ask" \
            "<!-- oss-verify-held-run $RUN_ID -->" > "$RUNNER_TEMP/held.md"
          # Adding a label that does not exist makes it, so a failed creation (two holds at once) only loses the colour.
          if ! gh api "repos/$REPO/labels/$HELD_LABEL" --jq .name > /dev/null 2>&1; then
            gh api --method POST "repos/$REPO/labels" -f name="$HELD_LABEL" -f color=d93f0b \
              -f description="The automated screen held this for a maintainer" --jq .name \
              || echo "::warning::the label $HELD_LABEL could not be made; adding it makes it."
          fi
          gh api --method POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$HELD_LABEL" --jq '.[].name' > /dev/null
          existing=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "oss-verify[bot]" and (.body | startswith("<!-- oss-verify-held -->"))) | .id')
          existing=${existing%%$'\n'*}
          if [ -n "$existing" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/held.md" '{body: $body}' \
              | gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input - > /dev/null
          else
            jq -n --rawfile body "$RUNNER_TEMP/held.md" '{body: $body}' \
              | gh api --method POST "repos/$REPO/issues/$NUMBER/comments" --input - > /dev/null
          fi
          echo "Held: labelled $HELD_LABEL, and said so."
          [ -n "${PR:-}" ] || exit 0
          # The hold as the comment above tells it, from route's trust and the review's result alone: the daily cap, a
          # review that did not finish, or else the screen, which did not pass it or could not read it.
          job=""
          if [ "$TRUST" = cap ]; then hold=cap
          elif [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then hold=failed job=review
          else hold=screen
          fi
          # failure, or success when a person approved this head (.github/scripts/review-check).
          check=$(HOLD=$hold JOB=$job .github/scripts/review-check)
          jq --arg url "$RUN_URL" '. + {details_url: $url}' <<< "$check" \
            | gh api --method POST "repos/$REPO/check-runs" --input - > /dev/null
          posted=$(jq -r .conclusion <<< "$check")
          echo "Posted the check run review of #$PR at $HEAD_SHA: $posted ($hold${job:+, the $job job})."

      # The review comment of a change pull request; for an enrollment pull request that RECORD names, the check run
      # Enrollment review too, from the same parsed verdicts, on every run this job runs for. The check run also keeps
      # the record of the review in its output.text, which GitHub does not show (.github/scripts/review-verdict's
      # docstring defines it). For both, the check run review of the head this run reviewed, which main's ruleset
      # requires (.github/scripts/review-check): from the hold, or from the review's verdicts and choices, and for an
      # enrollment whose every file is directly inside projects/<name>/, from the review having run. A change's comment
      # opens with its title. Its outputs: posted=true when it posted the review comment, and recorded=true when it
      # recorded the check run Enrollment review (the step after it then takes a hold off). Nothing on an approval or a
      # replay. On a run by hand for a held head, a hold records nothing and posts nothing when the newest check run
      # Enrollment review of the oss-verify App for this pull request at this head is a verdict of the review: that
      # verdict stands. A hold replaces an earlier hold (below).
      - name: Post the comment and record the verdict
        id: post
        if: env.APPROVE != 'true' && (env.RECORD == 'true' || (env.KIND == 'change' && env.HOLDING != 'true'))
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.route.outputs.pr }}
          HEAD_SHA: ${{ needs.route.outputs.sha }}
          # The check run's details_url: this run.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The review's comment, and an enrollment's verdicts and their reasons (the review job's outputs).
          REVIEW: ${{ needs.review.outputs.comment }}
          VERDICTS: ${{ needs.review.outputs.verdicts }}
          REASONS: ${{ needs.review.outputs.reasons }}
          # The verdicts and choices of review-change.md, of a change or of an enrollment's files outside its project,
          # and how many such files the enrollment changes, for the check run review.
          CHANGE: ${{ needs.review.outputs.change }}
          OUTSIDE: ${{ needs.gather.outputs.outside }}
          NAME: ${{ needs.gather.outputs.name }}
          CHECKS: ${{ needs.gather.outputs.checks }}
          # The checks the screen ran, when it screened this pull request first.
          SCREENED: ${{ needs.gather.outputs.screen != 'false' && needs.screen.outputs.checks || '' }}
          # What the run decided, for an enrollment: route's hold (the daily cap and the time it frees), the result of
          # each job, the screen's verdict, and whether the review held a finding back.
          TRUST: ${{ needs.route.outputs.trust }}
          FREE: ${{ needs.route.outputs.free }}
          GATHER_RESULT: ${{ needs.gather.result }}
          SCREEN_RESULT: ${{ needs.screen.result }}
          SCREEN_VERDICT: ${{ needs.screen.outputs.verdict }}
          REVIEW_RESULT: ${{ needs.review.result }}
          HELD: ${{ needs.review.outputs.held_object != '' }}
          HOLD_RESULT: ${{ needs.hold.result }}
          # The values of the record of the review in the check run's output.text: the gather job's criticality score,
          # OSS-Fuzz and binary sizes. Each is empty, so null in the record, when the gather job did not run.
          CRITICALITY_SCORE: ${{ needs.gather.outputs.criticality_score }}
          OSS_FUZZ: ${{ needs.gather.outputs.oss_fuzz }}
          SIZES: ${{ needs.gather.outputs.sizes }}
        run: |
          set -euo pipefail
          # A pull request's comment only: a run for an issue has no pull request, and an issue's draft is never posted.
          [[ ${PR:-} =~ ^[0-9]+$ ]] || { echo "::error::This run has no pull request, so nothing is posted."; exit 1; }
          [[ ${HEAD_SHA:-} =~ ^[0-9a-f]{40}$ ]] || { echo "::error::This run names no head commit, so nothing is posted."; exit 1; }
          # Why an enrollment has no verdicts of its review: the daily cap stopped it, a job failed
          # (the hold job too, when the comment says that it sent the review's held finding), or the screen held it.
          hold="" job=""
          if [ "$RECORD" = true ]; then
            if [ "${TRUST:-}" = cap ]; then hold=cap
            elif [[ $GATHER_RESULT == failure || $GATHER_RESULT == cancelled ]]; then hold=failed job=gather
            elif [[ $SCREEN_RESULT == failure || $SCREEN_RESULT == cancelled ]]; then hold=failed job=screen
            elif [ "$SCREEN_RESULT" = success ] && [ "${SCREEN_VERDICT:-}" != clean ]; then hold=screen
            elif [[ $REVIEW_RESULT == failure || $REVIEW_RESULT == cancelled ]]; then hold=failed job=review
            elif [ "$HELD" = true ] && [ "$HOLD_RESULT" != success ]; then hold=failed job=hold
            elif [ "$REVIEW_RESULT" != success ]; then
              # The gather job kept nothing: the head moved while it read, and the push started a run of its own.
              echo "The gather job kept nothing, because the head moved from $HEAD_SHA: the run of the new head records the verdict."
              exit 0
            fi
          fi
          # On a run by hand for a held head (HELD_RUNS), the screen decides only whether this job approves the held
          # runs. It does not change the review's verdict. So the newest check run Enrollment review of this pull
          # request at this head that the oss-verify App recorded decides. When it is a verdict of the review, that
          # verdict stands: a hold records nothing and posts nothing. When it is a hold, the new hold replaces it. This
          # step finds that check run as enroll-dispatch does. It reads the check runs by their name (the query's
          # check_name), by the App's id (REVIEW_APP) and by their external_id, the pull request's number. Of these,
          # the newest has the largest id. Its title tells a hold from a verdict: review-verdict --holds prints the
          # title of each hold, and a verdict has none of them. Its conclusion cannot tell them: a verdict with a
          # person check is action_required, as a hold is. A read that fails fails this step.
          if [ "${HELD_RUNS:-}" = true ] && [ -n "$hold" ]; then
            holds=$(.github/scripts/review-verdict --holds)
            newest=$(gh api --paginate --slurp "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=Enrollment%20review&filter=all&per_page=100" \
              | jq -r --arg pr "$PR" --arg holds "$holds" '[.[].check_runs[] | select(.app.id == 5447700 and .external_id == $pr)]
                  | max_by(.id) | if . == null then "none" elif IN(.output.title; $holds | split("\n")[]) then "hold" else "verdict" end')
            if [ "$newest" = verdict ]; then
              echo "The newest check run Enrollment review of #$PR at $HEAD_SHA by the oss-verify App is a verdict of the review, and it stands: this hold ($hold${job:+, the $job job}) records nothing and posts nothing."
              exit 0
            fi
          fi
          # The pull request now: only a run of its current head posts, since a run of an older head that finished later
          # would replace the newer head's review.
          pull=$(gh api "repos/$REPO/pulls/$PR")
          current=$(jq -r .head.sha <<< "$pull")
          conclusion=""
          if [ "$RECORD" = true ]; then
            # review-verdict reads the review's VERDICTS and REASONS from this step's env, and none of them with HOLD.
            # It reads HEAD_SHA, CRITICALITY_SCORE, OSS_FUZZ and SIZES for the record, with HOLD too.
            verdict=$(HOLD=$hold JOB=$job .github/scripts/review-verdict)
            conclusion=$(jq -r .conclusion <<< "$verdict")
          fi
          # The check run review, before anything is posted: review-check reads CHANGE, OUTSIDE and NAME, and the
          # pull request's reviews for a choice reserved for a person and, with HOLD, for the hold.
          check=$(HOLD=$hold JOB=$job .github/scripts/review-check)
          url=""
          if [ -n "$hold" ]; then
            echo "No comment: the review gave no verdicts ($hold${job:+, the $job job}), and an earlier comment stays."
          elif [ "$current" != "$HEAD_SHA" ]; then
            echo "The pull request's head is now $current, not $HEAD_SHA: the run of $current posts the comment."
          else
            rules=review-change.md
            [ "$RECORD" != true ] || rules=review.md
            CONCLUSION=$conclusion RULES=$rules TITLE=$(jq -r .output.title <<< "$check") .github/scripts/review-body \
              > "$RUNNER_TEMP/comment.md"
            # Ours is the oss-verify App's comment that starts with the marker.
            existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq '.[] | select(.user.login == "oss-verify[bot]" and (.body | startswith("<!-- oss-verify-review -->"))) | .id')
            existing=${existing%%$'\n'*}
            if [ -n "$existing" ]; then
              answer=$(jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' \
                | gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input -)
            else
              answer=$(jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' \
                | gh api --method POST "repos/$REPO/issues/$PR/comments" --input -)
            fi
            # The comment's address, for the check run review; none when GitHub's answer gives none.
            url=$(jq -r 'if type == "object" then .html_url // "" else "" end' <<< "$answer" 2> /dev/null) || url=""
            [[ $url =~ ^https://github\.com/[A-Za-z0-9_./#-]+$ ]] || url=""
            echo "posted=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$RECORD" = true ]; then
            # The one record of the verdict, at the head this run reviewed. It names its pull request: external_id is
            # the pull request's number, so that a second pull request at the same commit has a check run of its own.
            # enroll-dispatch reads it. Its output.text is the record of the review that review-verdict made. jq reads
            # the verdict on its standard input: as an argument it can be more than the 131,072 bytes Linux takes in
            # one.
            jq --arg head "$HEAD_SHA" --arg pr "$PR" --arg url "$RUN_URL" \
              '{name: "Enrollment review", head_sha: $head, external_id: $pr, status: "completed", conclusion: .conclusion,
                details_url: $url, output: {title: .title, summary: .summary, text: .text}}' <<< "$verdict" \
              | gh api --method POST "repos/$REPO/check-runs" --input - > /dev/null
            echo "recorded=true" >> "$GITHUB_OUTPUT"
            echo "Recorded the check run Enrollment review of #$PR at $HEAD_SHA: $conclusion."
          fi
          # The check run review of the head this run reviewed, whichever head the pull request has now: it links the
          # review comment when this run posted it, else this run.
          links="[This run]($RUN_URL)"
          [ -z "$url" ] || links="[The review comment]($url) · $links"
          jq --arg url "${url:-$RUN_URL}" --arg links "$links" '. + {details_url: $url} | .output.summary += "\n\n" + $links' \
            <<< "$check" | gh api --method POST "repos/$REPO/check-runs" --input - > /dev/null
          echo "Posted the check run review of #$PR at $HEAD_SHA: $(jq -r .conclusion <<< "$check")."

      # A review replaces a hold of a change pull request or an issue: one a maintainer started, or a later push that
      # the screen passed; for an issue, a review that made its draft. The label comes off, and the hold comment goes.
      # Not when another run's hold came after this run started: a newer event of the pull request or the issue was
      # held, in a run of its own. This run's own hold, from an attempt before a re-run of its failed jobs, counts as
      # older whatever its time. For an enrollment pull request, every check run the step above records takes the
      # label and the App's hold comments from before off, so the review comment stays the App's only comment on it:
      # an enrollment gets no new hold comment, so no newer hold is kept.
      # A hold comment or a label already gone is no error.
      - name: Take the label review-held off
        if: >-
          (steps.post.outputs.posted == 'true' && env.KIND == 'change') || (steps.post.outputs.recorded == 'true' && env.KIND == 'enrollment')
          || (env.HOLDING != 'true' && env.KIND == 'issue')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.route.outputs.pr || needs.route.outputs.issue }}
          STARTED: ${{ needs.route.outputs.started }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $RUN_ID =~ ^[0-9]+$ ]] || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run"; exit 1; }
          held=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "oss-verify[bot]" and (.body | startswith("<!-- oss-verify-held -->")))
              | "\(.id) \(.updated_at) \((.body | capture("\n<!-- oss-verify-held-run (?<r>[0-9]+) -->\n?$") | .r) // "-")"') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          if [ "$KIND" != enrollment ]; then
            while read -r _ at run; do
              [ -n "${at:-}" ] && [ "$run" != "$RUN_ID" ] || continue
              if [[ ! $at < $STARTED ]]; then
                echo "#$NUMBER was held at $at by run $run, after this run started at $STARTED: the label and the hold comment stay."
                exit 0
              fi
            done <<< "$held"
          fi
          out=$(gh api --method DELETE "repos/$REPO/issues/$NUMBER/labels/$HELD_LABEL" 2>&1) \
            || [[ $out == *"(HTTP 404)"* ]] || { echo "::error::the label $HELD_LABEL could not be taken off: $out"; exit 1; }
          while read -r id _; do
            [[ $id =~ ^[0-9]+$ ]] || continue
            out=$(gh api --method DELETE "repos/$REPO/issues/comments/$id" 2>&1) \
              || [[ $out == *"(HTTP 404)"* ]] || { echo "::error::the hold comment $id could not be deleted: $out"; exit 1; }
          done <<< "$held"

  triage-gather:
    # Writes the triage comment of a pull request that touches projects/, after a Triage run that ended success, or on
    # a run by hand that a person starts (route's output triage). It reads the pull request through the GitHub API, as
    # data, with a read-only token. Its checkout is main, never the pull request, so no code from the pull request
    # runs. Nor does code from src/, which has no code owner: the triage job posts this job's output, so triage.py
    # takes the rules of oss-verify validate from .github/scripts/validate_rules/ (tests/test_token_jobs.py). It must
    # never be given id-token: write, nor an environment.
    needs: route
    if: needs.route.outputs.triage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      comment: ${{ steps.triage.outputs.comment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
      - name: Write the comment
        id: triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.route.outputs.pr }}
        run: |
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          # A random delimiter, so that no text in the comment can end the output early.
          delimiter="triage-$(openssl rand -hex 16)"
          # The public comment is the job's output; the full table, every row, is this job's summary, from the same run.
          {
            echo "comment<<$delimiter"
            python3 .github/scripts/triage.py --repo "$REPO" --pr "$PR" --summary "$GITHUB_STEP_SUMMARY"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  triage:
    # Posts the comment triage-gather wrote, or updates the one already there, as the oss-verify GitHub App
    # (oss-verify[bot]), with an installation token that can write pull requests in this repository only. It makes
    # that token from the App's client id and its private key, which it reads at run time from Secret Manager
    # (oss-verify-github-app-key in theorem-agent-infra), signing in with this job's GitHub identity token by Google
    # workload identity federation (Theorem's infrastructure code). This repository stores no copy of the key. It
    # does nothing but post that text, and runs no code of the pull request.
    needs: [route, triage-gather]
    if: >-
      needs.triage-gather.outputs.comment != ''
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The GitHub Environment is what gets this job the App's key and keeps it from every other job: its identity
    # token carries an `environment` claim, and only a token with that claim may act as ossv-app-comment, the
    # dedicated reader of the key for these jobs (Theorem's infrastructure code). Its one protection rule is
    # the deployment-branch policy `main` (Theorem's infrastructure code); it has no
    # required reviewer and no wait timer, so it adds no wait and no approval. Removing this line does not weaken the
    # job; it stops it working.
    # deployment: false, so the comment posts no deployment; the environment claim the account needs is in the token
    # either way.
    environment:
      name: comment
      deployment: false
    # One triage comment at a time for a pull request: a newer run's comment replaces the run that is posting.
    concurrency:
      group: review-triage-${{ needs.route.outputs.pr }}
      cancel-in-progress: true
    permissions:
      # Only for the GitHub identity token that Google's federation trades for an access token of
      # ossv-app-comment@theorem-agent-root, which reads the App's key. This job posts text and runs no code of the
      # pull request.
      id-token: write
    env:
      # Theorem's Google project, as Theorem's infrastructure code declares them. Public identifiers, not
      # credentials: the provider admits this file on refs/heads/main (dispatch://INFRA-3746), and only a job in the
      # environment `comment` can act as this account.
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/844532188053/locations/global/workloadIdentityPools/github/providers/github-ossv
      GCP_SERVICE_ACCOUNT: ossv-app-comment@theorem-agent-root.iam.gserviceaccount.com
    steps:
      - name: Sign in to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          # Nothing is written to the workspace and nothing is exported: the token is this step's output alone.
          create_credentials_file: false
          export_environment_variables: false

      # Each line of the key is masked, and so is its base64 form, because one mask command registers one line: that
      # keeps these two representations out of the log, not every possible re-encoding of the key.
      - name: Read the oss-verify App's key
        id: key
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          payload=$(curl -q -sSf -H @<(builtin printf 'Authorization: Bearer %s\n' "$GCP_ACCESS_TOKEN") \
            'https://secretmanager.googleapis.com/v1/projects/theorem-agent-infra/secrets/oss-verify-github-app-key/versions/latest:access' \
            | jq -er '.payload.data | select(type == "string" and length > 0)')
          builtin printf '::add-mask::%s\n' "$payload"
          key=$(builtin printf '%s' "$payload" | base64 -d)
          while IFS= read -r line; do
            if [[ $line == *[![:space:]]* ]]; then builtin printf '::add-mask::%s\n' "$line"; fi
          done <<< "$key"
          delimiter="key-$(openssl rand -hex 16)"
          { echo "key<<$delimiter"; builtin printf '%s\n' "$key"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Get the oss-verify App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: Iv23liAWPMahJZYsw3un
          private-key: ${{ steps.key.outputs.key }}
          permission-pull-requests: write

      - name: Post the comment, or update the one already there
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.route.outputs.pr }}
          COMMENT: ${{ needs.triage-gather.outputs.comment }}
        run: |
          # Ours is the oss-verify App's comment that starts with the marker.
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "oss-verify[bot]" and (.body | startswith("<!-- oss-verify-triage -->"))) | .id')
          existing=${existing%%$'\n'*}
          if [ -n "$existing" ]; then
            jq -n --arg body "$COMMENT" '{body: $body}' | gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input - > /dev/null
          else
            jq -n --arg body "$COMMENT" '{body: $body}' | gh api --method POST "repos/$REPO/issues/$PR/comments" --input - > /dev/null
          fi

  collect:
    # The check review jobs (the top of this file), with .github/scripts/collect. A static name: GitHub reports the
    # check under it on every run. It is no check that the ruleset requires.
    name: review jobs
    needs: [route, gather, screen, review, session, hold, comment, triage-gather, triage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Only for the checkout of .github/scripts.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Every job route asked for passed, and no other ran
        env:
          ROUTE: ${{ needs.route.result }}
          # Each job is asked for on its own job's condition, written here the same way: gather when the item is
          # reviewable (an enrollment with a Build run's results or a held head, a change or an issue), and route did
          # not hold it at the daily cap; the screen when route did not hold it at the daily cap either, and gather kept
          # the item (its output digest) and its output screen is not false; the review when route did not hold it at
          # the daily cap either, the head is not held, and gather kept it and its output screen is false, or the
          # screen's verdict is clean; the session when the review kept one; hold when an enrollment's review ran;
          # comment on every run of an enrollment whose gather job took the project or that route held at the daily cap
          # (the check run Enrollment review), when the review wrote a change's comment, when the review of an issue
          # made its draft (the comment job takes a hold off it), when the screen passed a held head (the approval),
          # when a run by hand replays a merge (route's replay), or when a change, an issue or a held head is held
          # (route's cap, a screen that held it or failed, a screened review that failed, or no gathered item to read).
          # triage-gather is asked for when route asked for the triage comment, and triage when triage-gather wrote one.
          # The jobs that sign in (screen, review, hold, comment and triage) are never asked for on a run by
          # hand on another branch than main; after a Review approvals run, comment alone is asked for. So a held item
          # passes this check when the comment job recorded the hold: a screen's hold or the daily cap. It also passes
          # when, on a run by hand for a held head whose verdict of the review stands, the comment job recorded nothing.
          # A gather, screen, review (after its second attempt), hold or comment job that failed fails it, held or not.
          GATHER: ${{ needs.gather.result }}
          ASKED_GATHER: >-
            ${{ needs.route.result == 'success'
            && ((needs.route.outputs.kind == 'enrollment'
                 && (needs.route.outputs.build_run != '' || needs.route.outputs.held == 'true'))
                || needs.route.outputs.kind == 'change' || needs.route.outputs.kind == 'issue')
            && needs.route.outputs.trust != 'cap'
            && (needs.route.outputs.trust == 'writer' || needs.route.outputs.trust == 'screen') }}
          SCREEN: ${{ needs.screen.result }}
          # A measurement asks for the screen job alone (route's trust measure), and for no other job.
          ASKED_SCREEN: >-
            ${{ needs.route.outputs.trust != 'cap'
            && ((needs.gather.result == 'success' && needs.gather.outputs.digest != '' && needs.gather.outputs.screen != 'false')
                || needs.route.outputs.trust == 'measure')
            && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
          REVIEW: ${{ needs.review.result }}
          ASKED_REVIEW: >-
            ${{ needs.route.outputs.trust != 'cap' && needs.route.outputs.held != 'true'
            && needs.gather.result == 'success' && needs.gather.outputs.digest != ''
            && (needs.gather.outputs.screen == 'false'
                || (needs.screen.result == 'success' && needs.screen.outputs.verdict == 'clean'))
            && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
          SESSION: ${{ needs.session.result }}
          ASKED_SESSION: ${{ needs.review.outputs.session != '' }}
          HOLD: ${{ needs.hold.result }}
          ASKED_HOLD: >-
            ${{ needs.review.result != 'skipped' && (needs.gather.outputs.kind || needs.route.outputs.kind) == 'enrollment'
            && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
          COMMENT: ${{ needs.comment.result }}
          ASKED_COMMENT: >-
            ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
            && (((needs.gather.outputs.kind || needs.route.outputs.kind) == 'enrollment'
                 && (needs.gather.outputs.name != '' || needs.route.outputs.trust == 'cap'))
            || ((needs.gather.outputs.kind || needs.route.outputs.kind) == 'change' && needs.review.result == 'success' && needs.review.outputs.comment != '')
            || ((needs.gather.outputs.kind || needs.route.outputs.kind) == 'issue' && needs.review.result == 'success')
            || (needs.route.outputs.held == 'true' && needs.screen.result == 'success' && needs.screen.outputs.verdict == 'clean')
            || needs.route.outputs.replay == 'true'
            || (needs.route.outputs.refresh == 'true' && github.event_name == 'workflow_run')
            || (((needs.gather.outputs.kind || needs.route.outputs.kind) == 'change' || (needs.gather.outputs.kind || needs.route.outputs.kind) == 'issue' || needs.route.outputs.held == 'true')
                && (needs.route.outputs.trust == 'cap'
                    || (needs.route.outputs.trust == 'screen' && needs.gather.result == 'failure')
                    || (needs.gather.result == 'success' && needs.gather.outputs.digest != '' && needs.gather.outputs.screen != 'false'
                        && (needs.screen.result == 'failure'
                            || (needs.screen.result == 'success'
                                && (needs.screen.outputs.verdict != 'clean' || needs.review.result == 'failure'
                                    || needs.review.result == 'cancelled'))))))) }}
          TRIAGE_GATHER: ${{ needs.triage-gather.result }}
          ASKED_TRIAGE_GATHER: ${{ needs.route.outputs.triage == 'true' }}
          TRIAGE: ${{ needs.triage.result }}
          # triage-gather asks for the triage comment by writing one.
          ASKED_TRIAGE: >-
            ${{ needs.triage-gather.outputs.comment != ''
            && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        run: >-
          .github/scripts/collect "$ROUTE" "gather:$GATHER:$ASKED_GATHER" "screen:$SCREEN:$ASKED_SCREEN"
          "review:$REVIEW:$ASKED_REVIEW" "session:$SESSION:$ASKED_SESSION" "hold:$HOLD:$ASKED_HOLD"
          "comment:$COMMENT:$ASKED_COMMENT" "triage-gather:$TRIAGE_GATHER:$ASKED_TRIAGE_GATHER"
          "triage:$TRIAGE:$ASKED_TRIAGE"
