# Adapted from OSS Scanner's .github/workflows/triage.yaml (https://github.com/anthropics/oss-scanner), Copyright 2026
# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: OSS Verify's comment (its marker and checks), and then
# the move of its jobs to .github/workflows/review.yml and of this file to the trigger pull_request.
name: "Triage"
# Triages an enrollment pull request with what a reviewer would otherwise look up by hand. The comment on the pull
# request is public and carries only whether the repository is a fork, the license, whether whoever opened it looks like
# an active maintainer, the pull request's scope, oss-verify validate and the checklist. The full table, for Theorem's
# reviewers, is the job summary of review.yml's job triage-gather:
# it adds the project's standing, stars and forks, outside participants, criticality score, OSS-Fuzz, .oss-verify/ in
# its repository and its status in the proofs index. Both inform the review and decide nothing. A pull request that
# touches nothing under projects/ gets neither.
#
# This file only starts the triage. Its one job, triage, runs no script of this repository, checks out nothing and
# holds no permission. It starts only for a pull request that changes a file under projects/ (paths, below, with its
# limits).
# When a run of this file completes with success, .github/workflows/review.yml runs main's copy of two jobs for the
# pull request (workflow_run), if the pull request touches projects/ (the paths GitHub lists for it, renames under both
# names):
#   triage-gather  writes the comment with main's .github/scripts/triage.py, which reads the pull request through the
#                  GitHub API, as data, with a read-only token. Its job summary is the full table.
#   triage         posts the comment, or updates the one already there, as the oss-verify GitHub App
#                  (oss-verify[bot]).
# A run of a pull request from a fork gets a read-only token, which cannot comment, so review.yml posts the comment.
# An edit of the title alone runs no job, because the comment does not show the title. review.yml writes the comment
# only after a run of this file whose conclusion is success. An edit of the description of a pull request that changes
# a file under projects/ runs the job: the comment reports on the checklist in it. The check triage is not required
# by the ruleset, and the comment decides nothing.
#
# pull_request: the workflow file comes from the merge commit, so a pull request that changes it controls this run.
# The run decides nothing: review.yml reads only that it completed with success, and reads the pull request from the
# API.
#
# A pull request that has had none of the events below since this workflow was added has no comment. Someone with
# write access can ask for one, or for a fresh one, with a run by hand of review.yml on main, which also reviews the
# pull request:
#   gh workflow run review.yml -f pr=123
# For many pull requests, leave a few minutes between runs. A run makes about 30 API requests, plus one per file in the
# project's directory, every run in this repository draws on the same 1,000 an hour, and a check that finds them spent
# says "could not be checked".

run-name: ${{ github.event.pull_request.title }}

on:
  pull_request:
    # Only a pull request into main, the default branch. review.yml takes each run as a run of the open pull request
    # into the default branch from the run's head repository and branch, at the run's head commit. So a run for a pull
    # request into another branch gives the pull request into main from the same branch and commit a second triage.
    branches: [main]
    # Only a pull request that changes a file under projects/: review.yml writes a triage comment for no other. Before
    # this filter, each event of any other pull request ran this job and, on its completion, review.yml's route and
    # collect (route stopped with "touches nothing under projects/"), enroll-dispatch.yml's decide after that Review
    # run, and held-runs.yml's sweep. GitHub matches the filter against the files that the pull request changes (its
    # three-dot diff, from the merge base to the head), not those of the latest push alone, on each event of the types
    # below: an edit of the description of a pull request that changes nothing under projects/ starts no run either.
    # A run needs both filters, branches and paths, to match. A pull request whose later pushes take back each of its
    # changes under projects/ starts no more runs, and its comment stays as it was.
    # Where the filter and route can differ, route still reads the pull request's files and decides:
    #   - route counts a renamed file under its old name too. GitHub's docs do not say whether the filter does, so a
    #     pull request that only moves files out of projects/ may start no run, and then gets no triage comment.
    #   - With more than 3,000 changed files, nothing runs when none of the first 3,000 that GitHub reads is under
    #     projects/. route's list stops at 3,000 files too (the API's limit), so neither proves that such a pull
    #     request changes nothing under projects/.
    #   - When GitHub cannot make the diff in time, the run starts, and route writes no comment when nothing is under
    #     projects/. A pull request that changes this file controls its own run (above).
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushpull_requestpull_request_targetpathspaths-ignore)
    # held-runs.yml sweeps every held head of the repository when a run of Triage, Build or Tests completes. An event
    # that this filter skips starts no sweep, so a held head waits for the next event (a run of Build or Tests that
    # completes, a push to main, an issue), with no bound on the wait.
    # A workflow that its paths filter skips leaves its checks pending, and a pending check that the ruleset requires
    # blocks the merge. The check triage is not required (the ruleset requires enrollment, project-builds,
    # terms-accepted and tests), so the skip blocks nothing. Never put a paths filter on a workflow that posts a
    # required check.
    paths: ['projects/**']
    # edited: the comment reports on the checklist in the description.
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  # An edit of the title alone has a group of its own, the run's, so that it cancels no run whose completion has
  # review.yml write the comment. By event too, so that the runs of this file's copy from before the move to
  # pull_request (on pull_request_target) and the runs of this copy never cancel each other.
  group: ${{ github.event.action == 'edited' && !github.event.changes.body && !github.event.changes.base && format('triage-edited-{0}', github.run_id) || format('triage-{0}-{1}', github.event_name, github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  triage:
    name: triage
    # Not for an edit of the title alone, which the comment does not show.
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.body && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "When this run completes, review.yml writes the triage comment of a pull request that touches projects/."
