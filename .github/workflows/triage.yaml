# Anthropic PBC, Apache-2.0. Modified 2026 by Theorem Labs, PBC: OSS Verify's checks, and the comment moved to build.yaml.
name: "Triage"
# Triages an enrollment pull request with what a reviewer would otherwise look up by hand, and writes the full table,
# for Theorem's reviewers, to gather's job summary: the license, whether whoever opened it looks like an active
# maintainer, the pull request's scope, tools/validate.py and the checklist, and also the project's standing, stars and
# forks, outside participants, criticality score, OSS-Fuzz, .oss-verify/ in its repository and its status in the proofs
# index. It informs the review and decides nothing. A pull request that touches nothing under projects/ gets none.
#
# This workflow posts nothing. The public triage comment (the first five rows of that table) is posted by build.yaml's
# comment job, after its review job checks it as it checks every message to a maintainer
# (.claude/skills/write-to-maintainer): that check needs Claude, and the Anthropic federation admits only build.yaml.
#
# pull_request_target, not pull_request, so that the table is of the base branch's triage.py. gather reads the pull
# request through the GitHub API, as data, with a read-only token. Its checkout is the base branch (the default for
# pull_request_target), never the pull request, so no code from the pull request runs. No job of this file may be given
# id-token: write, nor an environment.
# Values from the event reach the scripts through environment variables, never by ${{ }} substitution into them.
#
# Two more jobs: route runs first and asks for gather only when the table can change: a run started
# by hand, or a pull request that touches projects/ (the paths GitHub lists for it, renames under both names), on any
# event but an edit of the title alone, which the table does not show. An edit of the description runs gather: the
# table reports on the checklist in it. required always runs, last, and passes only if route passed and gather passed
# when route asked for it (.github/scripts/collect); a job route did not ask for must be skipped. Its check, triage, is
# not required by the ruleset: the table decides nothing.
#
# Someone with write access can ask for a fresh table, from the same jobs with the same permissions:
#   gh workflow run triage.yaml -f pr=123
# It never checks out a pull request.
# For many pull requests, leave a few minutes between runs. A run makes about 30 API requests, plus one per file in the
# project's directory, every run in this repository draws on the same 1,000 an hour, and a check that finds them spent
# says "could not be checked".

# A run started by hand is listed under the number it was given, as a pull request's is under its title.
run-name: ${{ github.event.pull_request.title || format('Pull request {0}', inputs.pr) }}

on:
  pull_request_target:
    # edited: the comment reports on the checklist in the description.
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request to triage"
        required: true
        type: number

permissions: {}

concurrency:
  # An edit of the title alone has a group of its own, the run's, so that it cancels no run that is writing the table.
  group: ${{ github.event.action == 'edited' && !github.event.changes.body && !github.event.changes.base && format('triage-edited-{0}', github.run_id) || format('triage-{0}', github.event.pull_request.number || inputs.pr) }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      gather: ${{ steps.paths.outputs.gather }}
    steps:
      - name: Whether the comment can change
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT: ${{ github.event_name }}
          TITLE_ONLY: ${{ github.event.action == 'edited' && !github.event.changes.body && !github.event.changes.base }}
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "gather=true" >> "$GITHUB_OUTPUT"
            say "gather runs: started by hand."
            exit 0
          fi
          if [ "$TITLE_ONLY" = true ]; then
            say "Nothing runs: an edit of the pull request's title, which the comment does not show."
            exit 0
          fi
          # A failed read fails this job, and so the check: it never reads as "touches nothing".
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths"
          if grep -q '^projects/' "$RUNNER_TEMP/paths"; then
            echo "gather=true" >> "$GITHUB_OUTPUT"
            say "gather runs: the pull request touches projects/."
          else
            say "Nothing runs: the pull request touches nothing under projects/, so it gets no comment."
          fi

  gather:
    needs: route
    if: needs.route.outputs.gather == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
      - name: Write the full table
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          # The full table, every row, is this job's summary. The public comment that triage.py prints is not kept:
          # build.yaml's review job writes and checks its own.
          python3 .github/scripts/triage.py --repo "$REPO" --pr "$PR" --summary "$GITHUB_STEP_SUMMARY" > /dev/null

  required:
    name: triage
    needs: [route, gather]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only for the checkout of .github/scripts.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Every job route asked for passed, and no other ran
        env:
          ROUTE: ${{ needs.route.result }}
          GATHER: ${{ needs.gather.result }}
          ASKED_GATHER: ${{ needs.route.outputs.gather == 'true' }}
        run: .github/scripts/collect "$ROUTE" "gather:$GATHER:$ASKED_GATHER"
