name: "Tests"
# tests runs this repository's tests and checks every project with oss-verify validate, on main and on pull requests. It
# runs the pull request's code, with GitHub's pull_request event: a run from a fork gets a read-only token and no
# secret. While the author has no merged contribution here, GitHub holds the run until it is approved: review.yml
# approves it after its automated screen passes the pull request (.github/workflows/held-runs.yml starts that screen).
# A pull request from a fork that changes a file under projects/ is an enrollment: for it the job reads, as data, only
# the paths that GitHub's merge changes, runs no code of the fork, and passes with "not run" in its summary. enrollment
# (validate.yaml) refuses such a fork if it changes anything but one projects/<name>/, or if that project is seeded, and
# project-builds (build.yaml) builds that project. A pull request from a fork that changes no file under projects/ (a
# change to src/, say) is tested as a branch of this repository is, and review.yml gives it a change review.
#
# One job, tests, reports the required check tests. It has no if:, so it runs on every event this workflow takes, and
# the check is never a skipped job, which GitHub counts as a pass where a check is required. Each run tests the whole
# tree of its commit (for a pull request, GitHub's merge of it into the base branch), whatever paths the change touches:
# no step chooses tests by the changed paths. The steps, in order:
#   - On a pull request: it targets the default branch, and the checkout is GitHub's merge into it (below).
#   - On a pull request from a fork: whether the merge changes a file under projects/ (git diff against the merge's
#     first parent, renames as both names). If it does, the step says "Not run" in the summary, and each step after it
#     is skipped, so the job passes having run no code of the fork. These first steps run only git, gh and jq, and read
#     the event and the merge's paths as data.
#   - The tests in tests/ but the Docker tests (DOCKER_TESTS, below), which fail the job if any test skips,
#     oss-verify validate on every project, actionlint and shellcheck over the workflows, and the package's wheel,
#     built, installed and run.
# tests/test_seeded_projects.py's Committed, the test that docs/seeded-projects.tsv is what
# src/oss_verify/seeded_projects.py writes, runs in every run, so a change that makes the table stale fails the check
# tests, and Committed's message names the command that writes the table. A fork's change to projects/ runs no test
# (above), and enrollment refuses it if docs/seeded-projects.tsv marks that project seeded, so a fork's change to the
# port of a seeded project cannot merge: a branch of this repository carries such a change.
#
# On a pull request the checkout is GitHub's merge of it into its base branch. The job fails for a pull request into any
# branch but the default one, as enrollment and project-builds do (build.yaml says why). The workflow does not run on
# edited, which GitHub sends for an edit of the title or description (nothing this judges changes) and for a change
# of base. After a change of base, push a commit to run it again; until then a pull request into another branch keeps
# its failed check, and one moved to the default branch from another keeps the failure it got there. The job also fails
# unless the merge's first parent is on the base branch: a run after a change of base, such as one started by a reopen
# or a rerun, can check out a merge into the earlier base (https://github.com/actions/checkout/issues/919). It then says
# to push a commit, since a rerun checks out the same merge.
#
# No job gets a secret, cache, artifact or write permission. Never add one. The contents: read token goes to
# actions/checkout and to the step that asks the API where the merge's first parent is, never to a step that runs the
# branch's code.
#
# To run it on a branch:
#   gh workflow run tests.yaml --ref <branch>
# Such a run reports a check named tests too, but a check from a workflow_dispatch run never satisfies a ruleset's
# required check (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#checks-from-some-workflow-jobs-are-not-evaluated).

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# No job reads or writes the Actions cache (the top of this file).
cache-mode: none

env:
  # A pull request from a fork: when it changes a file under projects/, no step runs its code (the top of this file).
  FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
  # The Docker tests: the files whose tests build fixtures in the toolchain images, most of them running the binaries
  # under qemu-riscv64-static. The job tests leaves the whole files out (--ignore), so none of their tests counts as a
  # skip there. tests/test_routed_workflows.py lists them as run by no job yet (RUN_BY_NO_JOB_YET), and checks that every
  # other test runs here.
  # .github/workflows/frame-pointer-tests.yaml runs the class FramePointers of tests/test_builder.py.
  DOCKER_TESTS: >-
    tests/test_builder.py tests/test_append_docker.py tests/test_binary_checks_docker.py tests/test_seed_runs_docker.py
    tests/test_target_settings_docker.py

concurrency:
  # One group for each pull request, and one for the pushes to main (github.ref is then refs/heads/main): a newer run
  # cancels the older one. That loses nothing, since each run tests the whole tree of its commit, never the changes
  # since an earlier one, and the newer commit holds the older one's changes. A run by hand has the group of its branch.
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # For actions/checkout, and for the compare call of the step "The checkout is the merge into the base branch".
      contents: read
    # This repository's package, for python3 -P -c and -m: -P keeps the top of the checkout off sys.path, and
    # PYTHONPATH names its src/ alone. pytest reads the same directory from pyproject.toml's pythonpath.
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: The pull request targets the default branch
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.pull_request.base.repo.default_branch }}
        run: |
          if [ "$BASE" != "$DEFAULT" ]; then
            echo "::error::This pull request targets $BASE, not $DEFAULT: its checks are for $DEFAULT only. Change its base to $DEFAULT, then push a commit to run them again."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          # The commit and its parents: the next two steps read a pull request's merge against its first parent.
          fetch-depth: 2

      - name: The checkout is the merge into the base branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # The merge's first parent is the base branch's commit it was made on.
          parent=$(git rev-parse HEAD^1)
          status=$(gh api "repos/$REPO/compare/$parent...$(jq -rn --arg b "$BASE" '$b | @uri')" --jq .status)
          case $status in
            identical|ahead) ;;
            # A rerun uses the event's GITHUB_SHA (https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs).
            *) echo "::error::This run checked out GitHub's merge into an earlier base, not $BASE (its first parent $parent is not in the history of $BASE, compare: $status). Push a commit to the branch to run it again: a rerun checks out the same merge."
               exit 1 ;;
          esac

      # Inline, and it runs only git: the checkout holds the fork's files, and nothing of them runs here. Each step after
      # this one runs only when this step did not find an enrollment.
      - name: A fork's change to projects/ runs no code here
        id: fork
        if: env.FORK == 'true'
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/paths"
          changed=0 projects=0
          while IFS= read -r -d '' path; do
            changed=$((changed + 1))
            [[ $path == projects/* ]] && projects=$((projects + 1))
          done < "$RUNNER_TEMP/paths"
          if (( projects )); then
            echo "enrollment=true" >> "$GITHUB_OUTPUT"
            say "Not run: this pull request is from a fork and changes $projects of its $changed files under projects/, so it is an enrollment, and this workflow runs no code of a fork's enrollment. enrollment checks that it changes only one projects/<name>/, of a project that docs/seeded-projects.tsv does not mark seeded, and project-builds builds that project."
          else
            say "The tests run: this pull request is from a fork and changes none of its $changed files under projects/."
          fi

      # strace: a test in tests/ checks that the review's helpers keep the GitHub token out of each process's arguments.
      # pytest-xdist: the tests in tests/ run in parallel (that step says why).
      - name: Install PyYAML, pytest, pytest-xdist and strace
        if: steps.fork.outputs.enrollment != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml python3-pytest python3-pytest-xdist strace

      # The binary checks' rules (oss_verify.binary_isa, oss_verify.syscall_shapes) are tested against the files of the
      # public process model at the commit they were written against, fetched anonymously. Each python3 -c and -m here
      # runs with -P, or with PYTHONSAFEPATH=1, which does the same (the tests in tests/): either keeps the top of the
      # checkout off sys.path, so that no file or directory there shadows a module (.github/CODEOWNERS owns the top's .py
      # files and pyproject.toml). pytest runs with -c pyproject.toml, so that it reads no other configuration file, such
      # as one that a change adds under tests/, which has no owner.
      - name: The process model the binary checks were written against
        if: steps.fork.outputs.enrollment != 'true'
        run: |
          commit=$(python3 -P -c 'from oss_verify import binary_isa, syscall_shapes
          assert binary_isa.MODEL_COMMIT == syscall_shapes.MODEL_COMMIT, "the two checks name two model commits"
          print(syscall_shapes.MODEL_COMMIT)')
          git init -q "$RUNNER_TEMP/model"
          git -C "$RUNNER_TEMP/model" fetch -q --depth 1 https://github.com/theorem-labs/rocq-linux-process-semantics "$commit"
          git -C "$RUNNER_TEMP/model" checkout -q --detach FETCH_HEAD
          echo "OSS_VERIFY_MODEL=$RUNNER_TEMP/model" >> "$GITHUB_ENV"

      # Every test in tests/ but the Docker tests, which --ignore leaves out (DOCKER_TESTS, the top of this file).
      # tests/test_core_dump_filter.py runs here: it needs the runner's Docker, but no image to pull. -rs lists each
      # skipped test with its reason, and a skip fails the step: each test here needs only what this runner has (strace,
      # the model's checkout, jq, cc, Docker), so a skip means one of them is missing, and the check must not pass
      # without the test. pytest's last line counts the tests ("N passed, M skipped in ...").
      # The tests run in parallel, in one pytest-xdist worker for each core of the runner (-n "$(nproc)"): many of them
      # start processes, and in series this step took most of the check's time. With --dist worksteal, a worker that has
      # no test left takes tests that another worker has not started, so the slow tests near the end do not wait in one
      # worker's queue. pytest-xdist starts each worker as a python3 -c without -P, so the step sets PYTHONSAFEPATH=1: it
      # keeps the top of the checkout off sys.path in each worker, and in each python3 that a test starts, as -P does.
      # --durations=30 lists the 30 slowest tests.
      - name: The tests in tests/
        if: steps.fork.outputs.enrollment != 'true'
        env:
          PYTHONSAFEPATH: "1"
        run: |
          set -o pipefail
          read -r -a ignored <<< "$DOCKER_TESTS"
          python3 -P -m pytest -q -p no:cacheprovider -c pyproject.toml -rs -n "$(nproc)" --dist worksteal --durations=30 \
            "${ignored[@]/#/--ignore=}" | tee "$RUNNER_TEMP/pytest"
          if tail -n 1 "$RUNNER_TEMP/pytest" | grep -qE '(^|[ ,])[0-9]+ skipped'; then
            echo "::error::A test skipped here (each SKIPPED line above names one, and why): each test of this job must run."
            exit 1
          fi

      - name: Every project passes oss-verify validate
        if: steps.fork.outputs.enrollment != 'true'
        run: python3 -P -m oss_verify validate < /dev/null

      # actionlint over .github/workflows/: each workflow's keys, expressions and action pins, and shellcheck over the
      # script of each run:. Both are pinned by version and by the SHA-256 of their release archive (actionlint's from
      # its release's checksums file; shellcheck publishes none, so its archive's own, read on 2026-11-23), so that a
      # new runner image changes no finding. pyflakes, which actionlint runs on Python run: scripts when it finds it,
      # is not used: no step here has one. .github/actionlint.yaml lists the messages that it ignores, each with why.
      - name: actionlint and shellcheck pass the workflows
        if: steps.fork.outputs.enrollment != 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          lint=$RUNNER_TEMP/lint
          mkdir -p "$lint"
          curl -fsSL -o "$lint/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $lint/actionlint.tar.gz" | sha256sum -c --quiet
          tar -xzf "$lint/actionlint.tar.gz" -C "$lint" actionlint
          curl -fsSL -o "$lint/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $lint/shellcheck.tar.xz" | sha256sum -c --quiet
          tar -xJf "$lint/shellcheck.tar.xz" -C "$lint" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          "$lint/actionlint" -color -shellcheck "$lint/shellcheck" -pyflakes ""

      # The package as a user installs it: the wheel that uv builds with pyproject.toml's build backend, uv_build,
      # which uv runs itself (--offline: it fetches nothing), installed in a new virtual environment beside the
      # dependencies that uv.lock pins, which uv fetches from PyPI and checks by their hashes. Then its command runs from
      # that environment alone: PYTHONPATH, which names the checkout's src/ in this job, is unset, so the package that
      # runs is the installed one. uv is pinned by version and by the SHA-256 of its release archive.
      - name: The package builds, installs and runs
        if: steps.fork.outputs.enrollment != 'true'
        env:
          UV_VERSION: 0.12.5
          UV_SHA256: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
        run: |
          set -euo pipefail
          package=$RUNNER_TEMP/package
          mkdir -p "$package/uv"
          curl -fsSL -o "$package/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $package/uv.tar.gz" | sha256sum -c --quiet
          tar -xzf "$package/uv.tar.gz" -C "$package/uv" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          uv() { "$package/uv/uv" "$@" --no-config --no-cache; }
          uv build --offline --wheel --out-dir "$package/dist"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$package/requirements.txt"
          uv venv --python "$(command -v python3)" "$package/venv"
          uv pip install --python "$package/venv/bin/python" --require-hashes -r "$package/requirements.txt"
          uv pip install --offline --python "$package/venv/bin/python" --no-deps "$package"/dist/*.whl
          cd "$package"
          env -u PYTHONPATH "$package/venv/bin/oss-verify" --help
          installed=$(env -u PYTHONPATH "$package/venv/bin/python" -P -c 'import oss_verify; print(oss_verify.__file__)')
          [[ $installed == "$package/venv/"* ]] || { echo "::error::oss_verify ran from $installed, not the wheel"; exit 1; }
