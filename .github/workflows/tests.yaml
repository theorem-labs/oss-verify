name: "Tests"
# tests runs this repository's tests and checks every project with oss-verify validate, on pull requests, and on a
# push to main that changes a file under projects/ (below). It runs the pull request's code, with GitHub's pull_request
# event: a run from a fork gets a read-only token and no secret. While the author has no merged contribution here,
# GitHub holds the run until it is approved: review.yml approves it after its automated screen passes the pull request
# (.github/workflows/held-runs.yml starts that screen).
# A pull request from a fork that changes a file under projects/ is an enrollment: for it the jobs suite and docker
# read, as data, only the paths that GitHub's merge changes (suite also reads its workflow files and .github/CODEOWNERS
# with the base branch's workflow-credentials, below), run no code of the fork, and pass with "not run" in their
# summary. enrollment (validate.yaml) refuses such a fork if it changes anything but one projects/<name>/, or if that
# project is seeded, and project-builds (build.yaml) builds that project. A pull request from a fork that changes no
# file under projects/ (a change to src/, say) is tested as a branch of this repository is, and review.yml gives it a
# change review.
#
# Each run tests the whole tree of its commit (for a pull request, GitHub's merge of it into the base branch), whatever
# paths the change touches: no step chooses tests by the changed paths. The jobs:
#   suite   On a pull request: it checks that the pull request targets the default branch, and that the checkout is
#           GitHub's merge into it (below). On a pull request from a fork: whether the merge changes a file under
#           projects/ (git diff against the merge's first parent, renames as both names). If it does, the step says "Not
#           run" in the summary, and each step after it but the next one is skipped, so the job passes having run no
#           code of the fork. These first steps run only git, gh and jq, and read the event and the merge's paths as
#           data. The next step runs on every event, the fork's enrollment too: .github/scripts/workflow-credentials,
#           which reads .github/CODEOWNERS and the workflow files as data, and runs no code of them. It fails when:
#             - it finds no workflow file to read;
#             - .github/CODEOWNERS or a workflow file cannot be read, a workflow file is no YAML mapping, or is YAML
#               that GitHub and the script could read differently (an explicit tag, the merge key <<, a key that is no
#               plain scalar, a key repeated in any case);
#             - .github/CODEOWNERS does not give a workflow file to both @theorem-labs/engineering and
#               @theorem-labs/research (a required check is matched by its name, so a job of any workflow could
#               report one), naming what its jobs hold (a secret, an environment, id-token, a write permission or
#               write access to main's Actions cache);
#             - a workflow starts on pull_request_target, or one that starts on pull_request breaks its rule (r): it
#               reads a secret, a job has an environment, passes secrets, or calls a workflow of no file here, the
#               workflow's permissions are missing, the workflow's or a job's permissions are write-all or another
#               text than read-all, of no form GitHub reads or name id-token (at any level), the workflow's
#               permissions write anything, or a job writes anything but security-events, or writes without the if
#               github.event_name == 'push';
#             - a job that holds a credential runs a CodeQL analysis that can run code of the packages it reads: Rust
#               in any build mode, C#, Java or Kotlin, C or C++ in another build mode than none, a language or a
#               called workflow that the script cannot read, or Python unless the job's steps are the checkout, then
#               the step that fails when an entry at the top of the checkout is named for a module of Python's
#               standard library, exactly as written, then CodeQL's steps with no if, and neither the job nor its
#               workflow sets defaults, no CodeQL step gets a PYTHONPATH and no step writes $GITHUB_ENV;
#             - a job that can get a credential (id-token: write, write-all, or a read of a secret, its own or its
#               workflow's, or the calling job's for a called workflow) declares no environment of the script's
#               MAIN_ONLY_ENVIRONMENTS, whose one deployment branch is main, starts on pull_request,
#               pull_request_target, pull_request_review or pull_request_review_comment, or checks out other
#               than its run's own commit (actions/checkout with a ref or a repository, gh pr checkout,
#               refs/pull/, or a git fetch, checkout, switch, worktree, pull or reset); or a job that calls a
#               workflow passes it secrets (R10 of dispatch://INFRA-5359/spec).
#           The script, steering.py, which it imports, .github/CODEOWNERS and this file have owners, so only a person
#           can change the rule. A fork's run takes the script and steering.py from the merge's first parent, a commit
#           of the base branch (the step that checks out the merge checks it is one), and runs it with python3 -I,
#           which reads no PYTHONPATH (the job's names the merge's src/), so no module of the fork shadows one it
#           imports and no step runs a fork's code; while that commit has no script, a fork's run skips the check.
#           Then the tests in tests/ but the Docker
#           tests (DOCKER_TESTS, below), oss-verify validate on every project, actionlint and shellcheck over the
#           workflows, and the package's wheel, built, installed and run.
#   docker  The Docker tests: every test of DOCKER_TESTS, on the newest toolchain images of infra/toolchains.tsv, on the
#           frame-pointer images that it makes from two of them as toolchain-images.yaml does, and with
#           qemu-riscv64-static. A matrix of shards, each on a runner of its own: each shard runs the classes or files
#           that its entry names, on the images that its entry names, those its classes need. Every test of
#           DOCKER_TESTS is in exactly one shard, and each class of a shard finds there the images it needs
#           (tests/test_routed_workflows.py checks both). Its first step after the checkout is suite's step for a fork's
#           change to projects/, with the same text, so it runs no code of a fork's enrollment either. It does not run
#           for a pull request into another branch than the default one, for which suite fails.
#   tests   The required check tests: it passes only if suite and every shard of docker passed. It always runs, after
#           both, and runs nothing of the checkout. GitHub counts a skipped job as a pass where a check is required, so
#           neither suite nor docker reports the check.
# suite and docker run side by side, so a run takes as long as the longer of them, and fail if a test skips: each of
# their tests needs only what its runner has, so a skip means that something is missing, such as strace, the model's
# checkout, an image or qemu, and the check must not pass without the test.
# tests/test_seeded_projects.py's Committed, the test that docs/seeded-projects.tsv is what
# src/oss_verify/seeded_projects.py writes, runs in every run, so a change that makes the table stale fails the check
# tests, and Committed's message names the command that writes the table. A fork's change to projects/ runs no test
# (above), and enrollment refuses it if docs/seeded-projects.tsv marks that project seeded, so a fork's change to the
# port of a seeded project cannot merge: a branch of this repository carries such a change.
#
# On a pull request the checkout is GitHub's merge of it into its base branch. suite fails for a pull request into any
# branch but the default one, as enrollment and project-builds do (build.yaml says why). The workflow does not run on
# edited, which GitHub sends for an edit of the title or description (nothing this judges changes) and for a change
# of base. After a change of base, push a commit to run it again; until then a pull request into another branch keeps
# its failed check, and one moved to the default branch from another keeps the failure it got there. suite also fails
# unless the merge's first parent is on the base branch: a run after a change of base, such as one started by a reopen
# or a rerun, can check out a merge into the earlier base (https://github.com/actions/checkout/issues/919). It then says
# to push a commit, since a rerun checks out the same merge.
#
# On a push to main it runs only when the push changes a file under projects/ (push's paths filter), for a fork's
# enrollment. Any other merge puts on main a tree that a run here has already tested. The ruleset of main, which
# Theorem's infrastructure code declares and nobody may bypass, requires a pull request's branch to be up to date with
# main before it merges (strict required status checks), and a linear history. So the head of a pull request that
# merges holds main's tip, GitHub's merge of it into main has the head's tree, and the merge puts that tree on main: a
# run on the push would test the same tree a second time. When main moves before the merge, the pull request cannot
# merge until its branch is updated, and the update runs this again, on the new tree.
# A fork's enrollment is the exception: its run here runs no code of the fork (above), so the run on its push to main
# is the one run of the tests on what it merged. Every file it changes is under one projects/<name>/ (enrollment
# refuses any other), so the filter starts that run. GitHub compares the push's commit with the one before it, a squash
# merge's one commit here; a push that adds or deletes a file under projects/ matches too, and a diff that times out
# starts the run anyway
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#git-diff-comparisons).
# A newer push to main that changes projects/ cancels that run (concurrency, below), and its run tests a tree that
# holds the enrollment too. A pull request from a branch of this repository that changes projects/ runs twice, on the
# pull request and on the push. Of the 270 commits on main from 2026-10-01 to 2026-11-22, 36 changed projects/; 26 of
# those were pull requests, 17 of them from forks.
# pull_request has no paths filter: the ruleset reads the check tests from a pull request's run, and a filter there
# would leave that check pending, which blocks the merge (triage.yaml).
#
# No job gets a secret, cache, artifact or write permission. Never add one. The contents: read token goes to
# actions/checkout and to suite's step that asks the API where the merge's first parent is, never to a step that runs
# the branch's code. docker pulls only public images, and its registry, a service container on its runner, holds only
# the frame-pointer images that it makes.
#
# There is no run by hand: no workflow that starts by hand builds code (tests/test_trigger_move.py, case (x)), and
# docker builds the fixtures. Push a commit to a pull request to run it.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # A merge of a fork's enrollment (the top of this file).
  push:
    branches: [main]
    paths: ["projects/**"]

permissions: {}

# No job reads or writes the Actions cache (the top of this file).
cache-mode: none

env:
  # A pull request from a fork: when it changes a file under projects/, no step runs its code (the top of this file).
  FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
  # The Docker tests: the files whose tests build fixtures in the toolchain images, most of them running the binaries
  # under qemu-riscv64-static. suite leaves the whole files out (--ignore), so none of their tests counts as a skip
  # there, and docker runs them. tests/test_routed_workflows.py checks that each test runs in one of the two jobs.
  DOCKER_TESTS: >-
    tests/test_builder.py tests/test_append_docker.py tests/test_binary_checks_docker.py tests/test_seed_runs_docker.py
    tests/test_target_settings_docker.py
  # docker's crane: go-containerregistry's, pinned by version and by the SHA-256 of its release archive, the same as
  # toolchain-images.yaml's (tests/test_routed_workflows.py compares them).
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
  CRANE_ARCHIVE: go-containerregistry_Linux_x86_64.tar.gz

concurrency:
  # One group for each pull request, and one for the pushes to main (github.ref is then refs/heads/main): a newer run
  # cancels the older one. That loses nothing, since each run tests the whole tree of its commit, never the changes
  # since an earlier one, and the newer commit holds the older one's changes.
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # For actions/checkout, and for the compare call of the step "The checkout is the merge into the base branch".
      contents: read
    # This repository's package, for python3 -P -c and -m: -P keeps the top of the checkout off sys.path, and
    # PYTHONPATH names its src/ alone. pytest reads the same directory from pyproject.toml's pythonpath.
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: The pull request targets the default branch
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.pull_request.base.repo.default_branch }}
        run: |
          if [ "$BASE" != "$DEFAULT" ]; then
            echo "::error::This pull request targets $BASE, not $DEFAULT: its checks are for $DEFAULT only. Change its base to $DEFAULT, then push a commit to run them again."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          # The commit and its parents: the next two steps read a pull request's merge against its first parent.
          fetch-depth: 2

      - name: The checkout is the merge into the base branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # The merge's first parent is the base branch's commit it was made on.
          parent=$(git rev-parse HEAD^1)
          status=$(gh api "repos/$REPO/compare/$parent...$(jq -rn --arg b "$BASE" '$b | @uri')" --jq .status)
          case $status in
            identical|ahead) ;;
            # A rerun uses the event's GITHUB_SHA (https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs).
            *) echo "::error::This run checked out GitHub's merge into an earlier base, not $BASE (its first parent $parent is not in the history of $BASE, compare: $status). Push a commit to the branch to run it again: a rerun checks out the same merge."
               exit 1 ;;
          esac

      # Inline, and it runs only git: the checkout holds the fork's files, and nothing of them runs here. Each step after
      # this one but the next runs only when this step did not find an enrollment; the next, workflow-credentials, runs
      # the base branch's script for a fork, which runs no file of the fork.
      - name: A fork's change to projects/ runs no code here
        id: fork
        if: env.FORK == 'true'
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/paths"
          changed=0 projects=0
          while IFS= read -r -d '' path; do
            changed=$((changed + 1))
            [[ $path == projects/* ]] && projects=$((projects + 1))
          done < "$RUNNER_TEMP/paths"
          if (( projects )); then
            echo "enrollment=true" >> "$GITHUB_OUTPUT"
            say "Not run: this pull request is from a fork and changes $projects of its $changed files under projects/, so it is an enrollment, and this workflow runs no code of a fork's enrollment. enrollment checks that it changes only one projects/<name>/, of a project that docs/seeded-projects.tsv does not mark seeded, and project-builds builds that project."
          else
            say "The tests run: this pull request is from a fork, and none of its $changed files is under projects/."
          fi

      # .github/scripts/workflow-credentials (the top of this file), on every event, with no token: it reads files
      # only. PyYAML comes from the runner image, else from apt. python3 -I reads no PYTHONPATH and no user site, so
      # only the script's own directory and the interpreter's packages are on sys.path.
      - name: Each workflow has a code owner, and no pull_request job holds a credential
        run: |
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          if [ "$FORK" != true ]; then
            exec python3 -I .github/scripts/workflow-credentials
          fi
          # A fork's run: the base branch's script, on the merge's files.
          if ! git cat-file -e HEAD^1:.github/scripts/workflow-credentials 2> /dev/null; then
            echo "The base branch's commit $(git rev-parse HEAD^1) has no .github/scripts/workflow-credentials: no check."
            exit 0
          fi
          tools=$(mktemp -d)
          for name in workflow-credentials steering.py; do
            git show "HEAD^1:.github/scripts/$name" > "$tools/$name"
          done
          python3 -I "$tools/workflow-credentials" .

      # strace: a test in tests/ checks that the review's helpers keep the GitHub token out of each process's arguments.
      # pytest-xdist: the tests in tests/ run in parallel (that step says why).
      - name: Install PyYAML, pytest, pytest-xdist and strace
        if: steps.fork.outputs.enrollment != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml python3-pytest python3-pytest-xdist strace

      # The binary checks' rules (oss_verify.binary_isa, oss_verify.syscall_shapes) are tested against the files of the
      # public process model at the commit they were written against, fetched anonymously. Each python3 -c and -m here
      # runs with -P, or with PYTHONSAFEPATH=1, which does the same (the tests in tests/): either keeps the top of the
      # checkout off sys.path, so that no file or directory there shadows a module (.github/CODEOWNERS owns the top's .py
      # files and pyproject.toml). pytest runs with -c pyproject.toml, so that it reads no other configuration file, such
      # as one that a change adds under tests/, which has no owner.
      - name: The process model the binary checks were written against
        if: steps.fork.outputs.enrollment != 'true'
        run: |
          commit=$(python3 -P -c 'from oss_verify import binary_isa, syscall_shapes
          assert binary_isa.MODEL_COMMIT == syscall_shapes.MODEL_COMMIT, "the two checks name two model commits"
          print(syscall_shapes.MODEL_COMMIT)')
          git init -q "$RUNNER_TEMP/model"
          git -C "$RUNNER_TEMP/model" fetch -q --depth 1 https://github.com/theorem-labs/rocq-linux-process-semantics "$commit"
          git -C "$RUNNER_TEMP/model" checkout -q --detach FETCH_HEAD
          echo "OSS_VERIFY_MODEL=$RUNNER_TEMP/model" >> "$GITHUB_ENV"

      # Every test in tests/ but the Docker tests, which --ignore leaves out (DOCKER_TESTS, the top of this file).
      # tests/test_core_dump_filter.py runs here: it needs the runner's Docker, but no image to pull. -rs lists each
      # skipped test with its reason, and a skip fails the step: each test here needs only what this runner has (strace,
      # the model's checkout, jq, cc, Docker), so a skip means one of them is missing, and the check must not pass
      # without the test. pytest's last line counts the tests ("N passed, M skipped in ...").
      # The tests run in parallel, in one pytest-xdist worker for each core of the runner (-n "$(nproc)"): many of them
      # start processes, and in series this step took most of the check's time. With --dist worksteal, a worker that has
      # no test left takes tests that another worker has not started, so the slow tests near the end do not wait in one
      # worker's queue. pytest-xdist starts each worker as a python3 -c without -P, so the step sets PYTHONSAFEPATH=1: it
      # keeps the top of the checkout off sys.path in each worker, and in each python3 that a test starts, as -P does.
      # --durations=30 lists the 30 slowest tests.
      - name: The tests in tests/
        if: steps.fork.outputs.enrollment != 'true'
        env:
          PYTHONSAFEPATH: "1"
        run: |
          set -o pipefail
          read -r -a ignored <<< "$DOCKER_TESTS"
          python3 -P -m pytest -q -p no:cacheprovider -c pyproject.toml -rs -n "$(nproc)" --dist worksteal --durations=30 \
            "${ignored[@]/#/--ignore=}" | tee "$RUNNER_TEMP/pytest"
          if tail -n 1 "$RUNNER_TEMP/pytest" | grep -qE '(^|[ ,])[0-9]+ skipped'; then
            echo "::error::A test skipped here (each SKIPPED line above names one, and why): each test of this job must run."
            exit 1
          fi

      - name: Every project passes oss-verify validate
        if: steps.fork.outputs.enrollment != 'true'
        run: python3 -P -m oss_verify validate < /dev/null

      # actionlint over .github/workflows/: each workflow's keys, expressions and action pins, and shellcheck over the
      # script of each run:. Both are pinned by version and by the SHA-256 of their release archive (actionlint's from
      # its release's checksums file; shellcheck publishes none, so its archive's own, read on 2026-11-23), so that a
      # new runner image changes no finding. pyflakes, which actionlint runs on Python run: scripts when it finds it,
      # is not used: no step here has one. .github/actionlint.yaml lists the messages that it ignores, each with why.
      - name: actionlint and shellcheck pass the workflows
        if: steps.fork.outputs.enrollment != 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          lint=$RUNNER_TEMP/lint
          mkdir -p "$lint"
          curl -fsSL -o "$lint/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $lint/actionlint.tar.gz" | sha256sum -c --quiet
          tar -xzf "$lint/actionlint.tar.gz" -C "$lint" actionlint
          curl -fsSL -o "$lint/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $lint/shellcheck.tar.xz" | sha256sum -c --quiet
          tar -xJf "$lint/shellcheck.tar.xz" -C "$lint" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          "$lint/actionlint" -color -shellcheck "$lint/shellcheck" -pyflakes ""

      # The package as a user installs it: the wheel that uv builds with pyproject.toml's build backend, uv_build,
      # which uv runs itself (--offline: it fetches nothing), installed in a new virtual environment beside the
      # dependencies that uv.lock pins, which uv fetches from PyPI and checks by their hashes. Then its command runs from
      # that environment alone: PYTHONPATH, which names the checkout's src/ in this job, is unset, so the package that
      # runs is the installed one. uv is pinned by version and by the SHA-256 of its release archive.
      - name: The package builds, installs and runs
        if: steps.fork.outputs.enrollment != 'true'
        env:
          UV_VERSION: 0.12.5
          UV_SHA256: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
        run: |
          set -euo pipefail
          package=$RUNNER_TEMP/package
          mkdir -p "$package/uv"
          curl -fsSL -o "$package/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $package/uv.tar.gz" | sha256sum -c --quiet
          tar -xzf "$package/uv.tar.gz" -C "$package/uv" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          uv() { "$package/uv/uv" "$@" --no-config --no-cache; }
          uv build --offline --wheel --out-dir "$package/dist"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$package/requirements.txt"
          uv venv --python "$(command -v python3)" "$package/venv"
          uv pip install --python "$package/venv/bin/python" --require-hashes -r "$package/requirements.txt"
          uv pip install --offline --python "$package/venv/bin/python" --no-deps "$package"/dist/*.whl
          cd "$package"
          env -u PYTHONPATH "$package/venv/bin/oss-verify" --help
          installed=$(env -u PYTHONPATH "$package/venv/bin/python" -P -c 'import oss_verify; print(oss_verify.__file__)')
          [[ $installed == "$package/venv/"* ]] || { echo "::error::oss_verify ran from $installed, not the wheel"; exit 1; }

  docker:
    # Not for a pull request into another branch: suite fails for it, and so does the check tests.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.base.ref == github.event.pull_request.base.repo.default_branch
    name: docker (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The shards. The Docker tests are CPU-bound: they took 2187 CPU-s, in 642 s of tests in four shards, on an
    # n2d-standard-4 VM (2 AMD Milan cores of 2 threads each, as a 4-vCPU GitHub runner is 2 cores of 2 threads; at
    # 80c44a1, INFRA-5359), so even with the builds of each class at once one runner needs about 9 minutes for them.
    # Each shard is whole classes, or whole files, so a setUpClass builds once, and each has a runner's 4 threads: rust
    # the two classes that build Rust's standard library, c the classes of the C, Go and cJSON fixtures, and
    # python-records PythonBuilder with the files of the link records. Each shard also costs 71-92 s of its job beside
    # its tests (the runner, its tools, and the pull of its images, each of which holds the 1.1 GB layer of the C
    # toolchain; the medians by shard of runs 45933112913 to 45980529993), so PythonBuilder, 91 s of tests since its
    # CPython runtime is prebuilt, is no shard of its own: on that VM, with this change's edits of the tests,
    # python-records took 231.6 s of tests where the shards python and records took 93.8 s and 167.4 s apart. workers is
    # the shard's pytest-xdist workers: one for each class that the shard can run beside another without leaving the
    # threads to one. python-records has three: on that VM it took 231.6 s with three and 239.0 s with four. c has
    # three, for its five classes: with two, in run 45933112913, they took 319 s of class time (pytest's durations) in a
    # step of 192 s; on that VM it took 72.5 s with two, 69.0 s with three and 69.3 s with four. languages are the
    # languages whose newest toolchain image the shard pulls, and frame_pointers the rows of infra/toolchains.tsv whose
    # frame-pointer image it makes: the images that its classes need, and no other, as pulling all of them took each
    # shard 87-141 s. fail-fast is off, so each shard reports its own tests; the check tests waits for all of them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: rust
            workers: 2
            languages: rust
            frame_pointers: oss-fuzz-theorems-2026.10-rust
            tests: tests/test_builder.py::RustBuilder tests/test_builder.py::FramePointersRust
          - shard: c
            workers: 3
            languages: c go
            frame_pointers: oss-fuzz-theorems-2026.10
            tests: >-
              tests/test_builder.py::Builder tests/test_builder.py::UbsanChecks tests/test_builder.py::GoBuilder
              tests/test_builder.py::AllocationFailureOnCjson tests/test_builder.py::FramePointersC
          - shard: python-records
            workers: 3
            languages: python c
            frame_pointers: ""
            tests: >-
              tests/test_builder.py::PythonBuilder tests/test_append_docker.py tests/test_binary_checks_docker.py
              tests/test_seed_runs_docker.py tests/test_target_settings_docker.py
    permissions:
      contents: read
    services:
      registry:
        # docker.io/library/registry:2, pinned by the digest of its image index, the image of toolchain-images.yaml's
        # registry (tests/test_routed_workflows.py compares them). crane puts the frame-pointer images in it.
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
          # The commit and its parents: the next step reads a pull request's merge against its first parent.
          fetch-depth: 2

      # suite's step, with the same text (tests/test_routed_workflows.py compares them). Inline, and it runs only git:
      # the checkout holds the fork's files, and nothing of them runs here. Each step after this one runs only when this
      # step did not find an enrollment.
      - name: A fork's change to projects/ runs no code here
        id: fork
        if: env.FORK == 'true'
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/paths"
          changed=0 projects=0
          while IFS= read -r -d '' path; do
            changed=$((changed + 1))
            [[ $path == projects/* ]] && projects=$((projects + 1))
          done < "$RUNNER_TEMP/paths"
          if (( projects )); then
            echo "enrollment=true" >> "$GITHUB_OUTPUT"
            say "Not run: this pull request is from a fork and changes $projects of its $changed files under projects/, so it is an enrollment, and this workflow runs no code of a fork's enrollment. enrollment checks that it changes only one projects/<name>/, of a project that docs/seeded-projects.tsv does not mark seeded, and project-builds builds that project."
          else
            say "The tests run: this pull request is from a fork, and none of its $changed files is under projects/."
          fi

      # The images and the fixtures' builds take 8 GB of the runner's 145 GB disk (104 GB free before them, 96 GB after,
      # with build.yaml's removals of unused toolchains, on this workflow's run at 7aa0e6b on 2026-11-23): so nothing is
      # removed to make room. crane makes the frame-pointer images. qemu-riscv64-static runs the fixtures' riscv64
      # binaries, as in build.yaml: Debian 13's qemu-user 1:10.0.11+ds-0+deb13u1, pinned by its SHA-256 at its
      # snapshot.debian.org address, and taken out of its package, not installed, so it is registered with no kernel's
      # binfmt_misc.
      - name: Install PyYAML, pytest, pytest-xdist, crane and qemu-riscv64-static
        if: steps.fork.outputs.enrollment != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml python3-pytest python3-pytest-xdist
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/qemu"
          curl -fsSL -o "$RUNNER_TEMP/$CRANE_ARCHIVE" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/$CRANE_ARCHIVE"
          echo "$CRANE_SHA256  $RUNNER_TEMP/$CRANE_ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$CRANE_ARCHIVE" -C "$RUNNER_TEMP/bin" crane
          cd "$RUNNER_TEMP/qemu"
          deb=qemu-user_10.0.11+ds-0+deb13u1_amd64.deb
          curl -fsSL --retry 3 -o "$deb" https://snapshot.debian.org/file/a0eaa62f815efb2361d43b1e3f8011c17ad9123a
          echo "6b6fea55551fbcc1eb30e146ad5abdfbb49f8fa8c5998016242126de4d7f80df  $deb" | sha256sum -c --quiet
          dpkg-deb -x "$deb" .
          ln -s qemu-riscv64 usr/bin/qemu-riscv64-static
          usr/bin/qemu-riscv64-static --version | grep -q 'version 10\.0\.11'
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/qemu/usr/bin" >> "$GITHUB_PATH"

      # The toolchain images of this shard (the matrix above): the newest toolchain image of each of its languages
      # (oss_verify.check_build.newest_toolchain), which the Docker tests build on, each pinned by its digest. Then the
      # frame-pointer images of its frame_pointers rows, for FramePointersC and FramePointersRust
      # (tests/test_builder.py's FRAME_POINTER_IMAGES): for each row, the row's image with OFT_FRAME_POINTERS=1, made as
      # make of toolchain-images.yaml makes it (crane mutate, into the registry on this runner), and the base image,
      # which those tests build on too. The pulls run at once, and crane copies each row's layers from ghcr.io into the
      # registry while they run: every image here holds the C toolchain's 1.1 GB layer, which Docker fetches and unpacks
      # once. Docker pulls a made image only after the toolchain images, so that it has their layers and fetches none of
      # them again from the registry.
      - name: Pull the toolchain images, and make the frame-pointer images
        id: images
        if: steps.fork.outputs.enrollment != 'true'
        env:
          LANGUAGES: ${{ matrix.languages }}
          FRAME_POINTERS: ${{ matrix.frame_pointers }}
        run: |
          set -euo pipefail
          read -r -a languages <<< "$LANGUAGES"
          read -r -a rows <<< "$FRAME_POINTERS"
          images=$(python3 -P -c 'import sys
          from oss_verify import check_build
          print(*sorted({check_build.newest_toolchain(language) for language in sys.argv[1:]}))' "${languages[@]}")
          pulls=()
          for image in $images; do
            [[ "$image" =~ ^ghcr\.io/theorem-labs/[a-z0-9-]+@sha256:[0-9a-f]{64}$ ]] ||
              { echo "::error::infra/toolchains.tsv names a toolchain image with no digest: '$image'"; exit 1; }
            docker pull --quiet "$image" > /dev/null &
            pulls+=("$!")
          done
          bases=() refs=()
          for row in "${rows[@]}"; do
            base=$(awk -F'\t' -v row="$row" '$1 == row { print $2 }' infra/toolchains.tsv)
            [[ "$base" =~ ^ghcr\.io/theorem-labs/oss-fuzz-theorems-toolchain(-[a-z]+)?@sha256:[0-9a-f]{64}$ ]] ||
              { echo "::error::infra/toolchains.tsv has no row $row with a toolchain digest: '$base'"; exit 1; }
            name=${base%@*}
            ref=$(crane mutate "$base" --env OFT_FRAME_POINTERS=1 -t "localhost:5000/${name#ghcr.io/}:frame-pointers")
            [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::crane gave no digest: '$ref'"; exit 1; }
            bases+=("$base") refs+=("$ref")
          done
          # wait fails the step (set -e) with the status of a pull that failed.
          for pull in "${pulls[@]}"; do wait "$pull"; done
          for i in "${!rows[@]}"; do
            row=${rows[$i]} base=${bases[$i]} ref=${refs[$i]}
            docker pull --quiet "$base" > /dev/null
            docker pull --quiet "$ref" > /dev/null
            echo "$row: made $ref"
            case $row in
              *-rust) echo "rust=$ref" >> "$GITHUB_OUTPUT" ;;
              *) echo "c=$ref" >> "$GITHUB_OUTPUT" ;;
            esac
          done
          df -h /

      # The tests of this shard (the matrix above), on its pytest-xdist workers. --dist loadscope keeps the tests of a
      # class on one worker, so that its setUpClass builds its images once; each class runs the builds of its fixture at
      # once (tests/test_builder.py, compile_builds). A skip fails the step, as in suite.
      - name: The Docker tests
        if: steps.fork.outputs.enrollment != 'true'
        env:
          OV_DOCKER_TESTS: "1"
          OV_FP_TOOLCHAIN_C: ${{ steps.images.outputs.c }}
          OV_FP_TOOLCHAIN_RUST: ${{ steps.images.outputs.rust }}
          PYTHONSAFEPATH: "1"
          SHARD_TESTS: ${{ matrix.tests }}
          WORKERS: ${{ matrix.workers }}
        run: |
          set -o pipefail
          read -r -a tests <<< "$SHARD_TESTS"
          python3 -P -m pytest -q -p no:cacheprovider -c pyproject.toml -rs -n "$WORKERS" --dist loadscope --durations=30 \
            "${tests[@]}" | tee "$RUNNER_TEMP/pytest"
          if tail -n 1 "$RUNNER_TEMP/pytest" | grep -qE '(^|[ ,])[0-9]+ skipped'; then
            echo "::error::A test skipped here (each SKIPPED line above names one, and why): each test of this job must run."
            exit 1
          fi

  tests:
    # The required check tests (the top of this file). A static name: GitHub reports the check under it on every run.
    needs: [suite, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: suite and docker passed
        env:
          SUITE: ${{ needs.suite.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          failed=0
          for job in "suite:$SUITE" "docker:$DOCKER"; do
            if [ "${job#*:}" != success ]; then
              echo "::error::${job%%:*}: ${job#*:}, not success"
              failed=1
            fi
          done
          [ "$failed" = 1 ] || echo "suite and docker passed." | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"
