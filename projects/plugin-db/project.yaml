# plugin-db: the database of what is known about an audio plugin, for FreeMixer. The fuzz targets drive the key of
# an entry: the pin of a plugin (the SHA-256 of each file it loads, the omx-layout/1 fingerprint of its controls and
# ports, and the verdict and pool words a pin line carries), as a C header, and every reader of text in it: the pin
# line, the layout bytes and the digest. Pinned to main at the merge of FreeMixer/plugin-db#18.
repo: https://github.com/FreeMixer/plugin-db#028de535f48d2c1fbdee3d4e89d62fb100facfea
primary_contact: linuxnow@gmail.com
homepage: https://github.com/FreeMixer/plugin-db
language: c
sanitizers: [address, undefined]
mutants: fuzz/sabotage
fuzz_targets:
  - fuzz_pin
  - fuzz_layout
  - fuzz_digest
