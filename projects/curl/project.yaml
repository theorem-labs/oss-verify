# Seeded by Theorem from the oss-fuzz-theorems 2026.10 release, not enrolled by the project's
# maintainers: provisional. To adopt it, set primary_contact and remove these lines (docs/project-yaml.md).
repo: https://github.com/curl/curl#f190aa8ecea728e6ce7fb7a6250e03df4d4eaca5
primary_contact: n/a
homepage: https://curl.haxx.se
language: c++
sanitizers: [address, undefined]
# build.sh builds the 24 fuzz targets below. fuzz_bufq and fuzz_fnmatch keep the release's build: their binaries reach
# no TLS code, and a build with TLS off changes fuzz_bufq's plain and UBSan code. Every other target is built with TLS
# off. The structured targets (curl_fuzzer_proto_file and the 18 after it) share one build of libcurl, OpenLDAP and
# libprotobuf-mutator in each build, on the toolchain's protobuf 3.21.12.
fuzz_targets: [fuzz_bufq, fuzz_fnmatch, fuzz_url, fuzz_doh, fuzz_netrc, curl_fuzzer_proto_file, curl_fuzzer_proto,
  curl_fuzzer_proto_http, curl_fuzzer_proto_http2, curl_fuzzer_proto_socks4, curl_fuzzer_proto_ws,
  curl_fuzzer_proto_telnet, curl_fuzzer_proto_smtp, curl_fuzzer_proto_imap, curl_fuzzer_proto_pop3,
  curl_fuzzer_proto_mqtt, curl_fuzzer_proto_dict, curl_fuzzer_proto_ldap, curl_fuzzer_proto_rtsp,
  curl_fuzzer_proto_ipfs, curl_fuzzer_proto_gopher, curl_fuzzer_proto_api, curl_fuzzer_proto_multi,
  curl_fuzzer_proto_timing]
