# libreac: the C library for Roland REAC audio over Ethernet (EtherType 0x8819): frame decode and encode, control
# blocks, stagebox identity and head-amps, discovery, and the pcap reader. The pin moves from v1.9.0 (d16f3f4) to
# 848c6cb5 of sjawhar/libreac, the head of FreeREAC/libreac#47 (for issue #35). Its base is FreeREAC/libreac main at
# cfb43f91 (the merge of #45). The changes to built or fuzzed code are:
#   - #45: fuzz_ctrl's round trip requires each block the row has.
#   - #47: pcap_source counts the oversized records it skips, and LIBREAC_ABI becomes 7.
#   - #41: reac_code.h declares three more codes; #43: LIBREAC_VERSION_MINOR becomes 10. Neither changes a binary.
# The other changes are fuzz tooling (#43 adds fuzz_qdisc, which build.sh does not build), tests, the Python
# bindings, the build system and packaging, CI and documentation.
# Every number except issue #35 is a FreeREAC/libreac pull request.
repo: https://github.com/sjawhar/libreac#848c6cb5d3f8768e6ecc2d5e72b4f57d44fc2070
primary_contact: linuxnow@gmail.com
homepage: https://github.com/FreeREAC/libreac
language: c
sanitizers: [address, undefined]
fuzz_targets:
  - fuzz_decode
  - fuzz_ctrl
  - fuzz_identity
  - fuzz_disco
  - fuzz_scene
  - fuzz_boxreg
  - fuzz_knock
  - fuzz_grant
  - fuzz_pcap
mutants: fuzz/sabotage
