# libreac: the C library for Roland REAC audio over Ethernet (EtherType 0x8819): frame decode and encode, control
# blocks, stagebox identity and head-amps, discovery, and the pcap reader. Pinned to the v1.7.2 release.
repo: https://github.com/FreeREAC/libreac#9ed322efd8d562066d30bd967ca5e9d6245ad4a6
primary_contact: linuxnow@gmail.com
homepage: https://github.com/FreeREAC/libreac
language: c
sanitizers: [address, undefined]
fuzz_targets:
  - fuzz_decode
  - fuzz_ctrl
  - fuzz_identity
  - fuzz_disco
  - fuzz_scene
  - fuzz_boxreg
  - fuzz_knock
  - fuzz_grant
  - fuzz_pcap
