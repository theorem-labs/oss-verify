# reac-pw: the FreeREAC daemon that bridges Roland REAC and PipeWire. The fuzz targets drive the readers of the
# untrusted input it parses itself, beside the REAC frames libreac parses: the operator's config file and `--box` pin,
# the three control writes a PipeWire client sets on a node, and the link-alias rtnetlink reply it reads (the qdisc
# dump is libreac-transport's since 1.0.42, fuzzed there). Pinned to main at the merge of FreeREAC/reac-pw#90, whose
# docs/fuzz-checks.md reads every check.
repo: https://github.com/FreeREAC/reac-pw#51cc82dc19adb2683afc7989a89bc2f068f4554c
primary_contact: linuxnow@gmail.com
homepage: https://github.com/FreeREAC/reac-pw
language: c
sanitizers: [address, undefined]
mutants: fuzz/sabotage
fuzz_targets:
  - fuzz_segconf
  - fuzz_pin
  - fuzz_headamp
  - fuzz_rate
  - fuzz_role
  - fuzz_qdisc
  - fuzz_link
