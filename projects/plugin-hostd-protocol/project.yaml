# plugin-hostd-protocol: the command protocol library that plugin-hostd and FreeMixer's mod-host speak to their
# controller, from mod-host's protocol layer: the command parser, the dispatcher that maps each verb onto a host backend,
# and the scenario reader. The fuzz targets read each reply from a buffer (fuzz/socket_fuzz.c in place of src/socket.c)
# and compare values, each check in a check_<property> function with its mutant and input records.
# Pinned to the head of FreeMixer/plugin-hostd-protocol#8, the fuzz/ written to the OSS Verify contract.
repo: https://github.com/FreeMixer/plugin-hostd-protocol#cab7957c82eac3d79c73a0e767bdbf44d0f57a40
primary_contact: linuxnow@gmail.com
homepage: https://github.com/FreeMixer/plugin-hostd-protocol
language: c
sanitizers: [address, undefined]
mutants: fuzz/sabotage
fuzz_targets:
  - fuzz_protocol
  - fuzz_dispatch
  - fuzz_scenario
