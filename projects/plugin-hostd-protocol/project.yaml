# plugin-hostd-protocol: the command protocol library that plugin-hostd and OpenMixer's mod-host speak to their
# controller, from mod-host's protocol layer: the command parser, the dispatcher that maps each verb onto a host backend,
# and the scenario reader. The fuzz targets read each reply from a buffer (fuzz/socket_fuzz.c in place of src/socket.c)
# and compare values, each check in a check_<property> function with its mutant and input records.
# Pinned to the current main, with the curve verbs: the headers of omx-dsp and omx-contract come through sources.
repo: https://github.com/Open-Mixer/plugin-hostd-protocol#317876b44f87c6c7e71896c6ce53204e0caae508
primary_contact: linuxnow@gmail.com
homepage: https://github.com/Open-Mixer/plugin-hostd-protocol
language: c
sanitizers: [address, undefined]
mutants: fuzz/sabotage
fuzz_targets:
  - fuzz_protocol
  - fuzz_dispatch
  - fuzz_scenario
  - fuzz_session
