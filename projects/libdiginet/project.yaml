# libdiginet: the DigiNet protocol of the Digidesign Control|24 and ProControl control surfaces, raw Ethernet frames
# (EtherType 0x885F), for OpenMixer. The fuzz targets drive the readers of every byte a desk sends: the frame, the
# command stream, the controls in it, the session they drive and the desk mux that hands each desk its own. Pinned to
# the head of main.
repo: https://github.com/Open-Mixer/libdiginet#68c249366493bea30f0a3de21723da533dc16c46
primary_contact: linuxnow@gmail.com
homepage: https://github.com/Open-Mixer/libdiginet
language: c
sanitizers: [address, undefined]
mutants: fuzz/sabotage
fuzz_targets:
  - fuzz_frame
  - fuzz_decode
  - fuzz_codec
  - fuzz_transport
  - fuzz_mux
