# mod-host's protocol layer: the command parser, the dispatcher that maps each verb onto a host backend, the scenario
# reader and the state paths, with the fuzz targets of fuzz/ in OpenMixer's mod-host (its branch freemixer). Pinned to
# the merge of Open-Mixer/mod-host#11. The fuzz targets read each reply from a buffer (fuzz/socket_fuzz.c in place of
# src/socket.c), keep their scratch files in the working directory, and compare values, each check with its mutant and
# input records.
repo: https://github.com/Open-Mixer/mod-host#5a0a4ea54fdeb3e0734d505d7226dffe465c576c
primary_contact: linuxnow@gmail.com
homepage: https://github.com/Open-Mixer/mod-host
language: c
sanitizers: [address, undefined]
fuzz_targets:
  - fuzz_protocol
  - fuzz_dispatch
  - fuzz_scenario
  - fuzz_statepaths
