# omx-dsp: the DSP library of OpenMixer, linked statically by the engine and the omx plugins. The fuzz targets drive what
# reaches it from outside: a host's port words and a block's samples through every instance face, the scalar laws, the
# EQ, the sample-rate converter and the delay lines, and a stream of MIDI messages through the note map.
# Pinned to the head of omx-dsp's main: each fuzz check read against its comment (docs/fuzz-checks.md), the records
# of each check directly above it, and the placement code of the harmonic resonance processor in src/.
repo: https://github.com/Open-Mixer/omx-dsp#c9221b09e46672ae99237569e739297766574da6
primary_contact: linuxnow@gmail.com
homepage: https://github.com/Open-Mixer/omx-dsp
language: c
sanitizers: [address, undefined]
fuzz_targets:
  - fuzz_fx
  - fuzz_laws
  - fuzz_eq
  - fuzz_src
  - fuzz_delay
  - fuzz_note_map
